/* ---------------- SAVE HANDLERS ---------------- */
function normalizePhone(p){ return (p||"").replace(/[\s\-()]/g,''); }
// Age is never stored as a static number — it's always calculated live from
// date of birth so it stays correct as years pass, with an approximate-age
// fallback for patients whose exact DOB isn't known.
function calcAgeFromDob(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr+'T00:00:00');
  if(isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m<0 || (m===0 && today.getDate()<dob.getDate())) age--;
  return age>=0 ? age : null;
}
function displayAge(p){
  if(!p) return '—';
  const fromDob = calcAgeFromDob(p.dob);
  if(fromDob!==null) return String(fromDob);
  if(p.approxAge) return '~'+p.approxAge;
  if(p.age) return String(p.age); // legacy patients saved before this feature
  return '—';
}
async function nextPatientCode(){
  const seq = await runTransaction(db, async (tx)=>{
    const snap = await tx.get(clinicDoc());
    const data = snap.exists() ? snap.data() : {};
    const currentSeq = (data.settings && data.settings.nextPatientSeq) || 1;
    const newSettings = {...(data.settings||state.settings), nextPatientSeq: currentSeq+1};
    tx.set(clinicDoc(), {...data, settings:newSettings}, {merge:true});
    return currentSeq;
  });
  state.settings.nextPatientSeq = seq+1;
  return 'PT-' + String(seq).padStart(4,'0');
}
// Same atomic pattern as patient codes, generalized for visits/prescriptions/
// receipts — each gets its own independent counter field in settings.
async function nextSequenceCode(fieldName, prefix){
  const seq = await runTransaction(db, async (tx)=>{
    const snap = await tx.get(clinicDoc());
    const data = snap.exists() ? snap.data() : {};
    const currentSeq = (data.settings && data.settings[fieldName]) || 1;
    const newSettings = {...(data.settings||state.settings), [fieldName]: currentSeq+1};
    tx.set(clinicDoc(), {...data, settings:newSettings}, {merge:true});
    return currentSeq;
  });
  state.settings[fieldName] = seq+1;
  return prefix + '-' + String(seq).padStart(4,'0');
}
async function savePatient(id){
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const errEl = document.getElementById('phoneError');
  errEl.textContent = "";
  if(!name){ showToast('Name is required'); return; }
  if(!phone){ errEl.textContent = "Phone number is required."; return; }
  const saveBtn = document.querySelector('.sheet .btn-primary');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  try{
    const normPhone = normalizePhone(phone).replace(/\D/g,'');
    const dupSnap = await getDocs(query(patientsCol(), where('phoneNormalized','==',normPhone), limit(2)));
    const duplicate = dupSnap.docs.find(d=>d.id!==id);
    if(duplicate){
      errEl.textContent = `This number is already used by ${duplicate.data().name}.`;
      if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
      return;
    }
    const occupationVal = document.getElementById('f_occupation').value.trim();
    if(occupationVal && !state.occupationsList.includes(occupationVal)){
      state.occupationsList.push(occupationVal);
      saveSettingsDoc();
    }
    const tags = (state.modal.selectedTags||[]).slice();
    const data = {
      name, nameLower: name.toLowerCase(),
      dob: document.getElementById('f_dob').value,
      approxAge: document.getElementById('f_approxAge').value,
      gender: document.getElementById('f_gender').value,
      maritalStatus: document.getElementById('f_marital').value,
      occupation: occupationVal,
      phone, phoneNormalized: normPhone,
      bloodGroup: document.getElementById('f_bg').value,
      city: document.getElementById('f_city').value.trim(),
      tags,
      allergies: document.getElementById('f_all').value.trim(),
      address: document.getElementById('f_addr').value.trim(),
    };
    if(id){
      await updateDoc(doc(patientsCol(), id), data);
      const cached = getPatient(id);
      if(cached) Object.assign(cached, data);
      const idx = state.patients.findIndex(p=>p.id===id);
      if(idx>-1) state.patients[idx] = {...state.patients[idx], ...data};
    } else {
      const patientCode = await nextPatientCode();
      const newDocData = {...data, patientCode, createdAt:todayISO(), lastVisitDate:null};
      const ref = await addDoc(patientsCol(), newDocData);
      const p = {id:ref.id, ...newDocData};
      cachePatient(p);
      state.patients.unshift(p);
      state.view.patientId = p.id;
    }
    closeModal();
    if(!id){ state.view.screen='patient-detail'; render(); } else { render(); }
    invalidateSearchPool();
    showToast('Patient saved');
  }catch(e){
    console.error('save patient failed', e);
    showToast('Save failed — check your connection');
    if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
  }
}
async function deletePatient(id){
  lockSheetButtons('Deleting…');
  try{
    const [vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(query(visitsCol(), where('patientId','==',id))),
      getDocs(query(rxCol(), where('patientId','==',id))),
      getDocs(query(receiptsCol(), where('patientId','==',id)))
    ]);
    const batch = writeBatch(db);
    vSnap.docs.forEach(d=>batch.delete(d.ref));
    rxSnap.docs.forEach(d=>batch.delete(d.ref));
    rcSnap.docs.forEach(d=>batch.delete(d.ref));
    batch.delete(doc(patientsCol(), id));
    await batch.commit();
    delete state._patientCache[id];
    state.patients = state.patients.filter(p=>p.id!==id);
    state.visits = []; state.prescriptions = []; state.receipts = [];
    closeModal();
    state.view = {tab:'patients',screen:'patients-list',patientId:null,visitId:null};
    render();
    invalidateSearchPool();
    showToast('Patient deleted');
  }catch(e){ console.error('delete patient failed', e); showToast('Delete failed — check your connection'); unlockSheetButtons(); }
}
async function recomputePatientLastVisit(patientId){
  const dates = state.visits.filter(v=>v.patientId===patientId).map(v=>v.date).filter(Boolean).sort();
  const last = dates.length ? dates[dates.length-1] : null;
  try{ await updateDoc(doc(patientsCol(), patientId), {lastVisitDate:last}); }catch(e){ console.error('lastVisitDate update failed', e); }
  const cached = getPatient(patientId);
  if(cached) cached.lastVisitDate = last;
  const idx = state.patients.findIndex(p=>p.id===patientId);
  if(idx>-1) state.patients[idx] = {...state.patients[idx], lastVisitDate:last};
}
async function saveVisit(patientId, editId){
  const data = {
    date: document.getElementById('v_date').value || todayISO(),
    chiefComplaint: document.getElementById('v_cc').value.trim(),
    diagnosis: document.getElementById('v_dx').value.trim(),
    notes: document.getElementById('v_notes').value.trim(),
    vitals:{
      bp: document.getElementById('v_bp').value.trim(),
      temp: document.getElementById('v_temp').value.trim(),
      pulse: document.getElementById('v_pulse').value.trim(),
      weight: document.getElementById('v_weight').value.trim(),
    },
    attachments: state.modal.attachments || []
  };
  lockSheetButtons('Saving…');
  try{
    if(editId){
      await updateDoc(doc(visitsCol(), editId), data);
      Object.assign(getVisit(editId), data);
    } else {
      const visitCode = await nextSequenceCode('nextVisitSeq', 'V');
      const newData = {patientId, visitCode, createdAt:todayISO(), ...data};
      const ref = await addDoc(visitsCol(), newData);
      const v = {id:ref.id, ...newData};
      state.visits.push(v);
      state.view.visitId = v.id;
    }
    await recomputePatientLastVisit(patientId);
    closeModal();
    if(!editId){ state.view.screen='visit-detail'; }
    render();
    showToast('Visit saved');
  }catch(e){ console.error('save visit failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
}
async function deleteVisit(id){
  const v = getVisit(id);

  lockSheetButtons('Deleting…');
  try{
    const [rxSnap, rcSnap] = await Promise.all([
      getDocs(query(rxCol(), where('visitId','==',id))),
      getDocs(query(receiptsCol(), where('visitId','==',id)))
    ]);

    rxSnap.docs.forEach(d=>batch.delete(d.ref));
    rcSnap.docs.forEach(d=>batch.delete(d.ref));

    state.view.screen='patient-detail';

async function saveRx(visitId, existingId){
  const meds = state.modal.meds.filter(m=>m.name.trim());
  if(meds.length===0){ showToast('Add at least one medicine'); return; }
  const v = getVisit(visitId);
  const p = getPatient(v.patientId) || {};
  const data = {
    visitId, visitCode: v.visitCode||'', patientId: v.patientId, date: v.date, medicines: meds,
    advice: document.getElementById('rx_advice').value.trim(),
    followUp: document.getElementById('rx_followup').value,
    patientName: p.name||'', patientNameLower: (p.name||'').toLowerCase(),
    patientCode: p.patientCode||'', patientPhone: normalizePhone(p.phone||'').replace(/\D/g,'')
  };
  lockSheetButtons('Saving…');
  try{
    if(existingId){
      await updateDoc(doc(rxCol(), existingId), data);
      Object.assign(state.prescriptions.find(r=>r.id===existingId), data);
    } else {
      const rxCode = await nextSequenceCode('nextRxSeq', 'RX');
      const ref = await addDoc(rxCol(), {...data, rxCode});
      state.prescriptions.push({id:ref.id, ...data, rxCode});
    }
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Prescription saved');
  }catch(e){ console.error('save rx failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
}
async function deleteRx(id, visitId){
  lockSheetButtons('Deleting…');
  try{
    await deleteDoc(doc(rxCol(), id));
    state.prescriptions = state.prescriptions.filter(r=>r.id!==id);
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Prescription deleted');
  }catch(e){ console.error('delete rx failed', e); showToast('Delete failed — check your connection'); unlockSheetButtons(); }
}
async function saveReceipt(visitId, existingId){
  const items = state.modal.items.filter(i=>i.desc.trim() && i.amount!=="");
  if(items.length===0){ showToast('Add at least one item'); return; }
  const total = items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const payments = (state.modal.payments||[]).filter(p=>p.amount!=="" && parseFloat(p.amount)>0);
  const amountPaid = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const status = amountPaid<=0 ? 'unpaid' : (amountPaid>=total ? 'paid' : 'partial');
  const v = getVisit(visitId);
  const p = getPatient(v.patientId) || {};
  const data = {
    visitId, visitCode: v.visitCode||'', patientId: v.patientId, date: v.date, items, total,
    payments, amountPaid, status,
    patientName: p.name||'', patientNameLower: (p.name||'').toLowerCase(),
    patientCode: p.patientCode||'', patientPhone: normalizePhone(p.phone||'').replace(/\D/g,'')
  };
  lockSheetButtons('Saving…');
  try{
    if(existingId){
      await updateDoc(doc(receiptsCol(), existingId), data);
      Object.assign(state.receipts.find(r=>r.id===existingId), data);
    } else {
      const receiptCode = await nextSequenceCode('nextReceiptSeq', 'RC');
      const ref = await addDoc(receiptsCol(), {...data, receiptCode});
      state.receipts.push({id:ref.id, ...data, receiptCode});
    }
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Receipt saved');
  }catch(e){ console.error('save receipt failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
}
async function deleteReceipt(id, visitId){
  lockSheetButtons('Deleting…');
  try{
    await deleteDoc(doc(receiptsCol(), id));
    state.receipts = state.receipts.filter(r=>r.id!==id);
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Receipt deleted');
  }catch(e){ console.error('delete receipt failed', e); showToast('Delete failed — check your connection'); unlockSheetButtons(); }
}
async function recordPayment(receiptId){
  const rc = state.receipts.find(r=>r.id===receiptId) || state.recordsReceipts.find(r=>r.id===receiptId);
  if(!rc){ showToast('Receipt not found'); return; }
  const amountVal = document.getElementById('rp_amount').value;
  const method = document.getElementById('rp_method').value;
  const amount = parseFloat(amountVal);
  if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }
  lockSheetButtons('Saving…');
  try{
    const payments = getReceiptPayments(rc).slice();
    payments.push({amount, method, date: todayISO()});
    const amountPaid = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
    const status = amountPaid<=0 ? 'unpaid' : (amountPaid>=rc.total ? 'paid' : 'partial');
    await updateDoc(doc(receiptsCol(), rc.id), {payments, amountPaid, status});
    Object.assign(rc, {payments, amountPaid, status});
    closeModal(); render(); invalidateRecordsSearchPool();
    showToast(status==='paid' ? 'Payment recorded — fully paid' : 'Payment recorded');
  }catch(e){ console.error('record payment failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
}

/* ---------------- PDF GENERATION ---------------- */
function letterheadBlock(doc, y){
  const s = state.settings;
  let textX = 15;
  if(s.logoDataUrl){
    try{
      const fmt = s.logoDataUrl.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
      doc.addImage(s.logoDataUrl, fmt, 15, y-11, 16, 16);
      textX = 35;
    }catch(e){ console.error('logo render failed', e); }
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(30,74,71);
  doc.text(s.clinicName||"Clinic", textX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,100,98);
  let line2 = [s.doctorName, s.qualification].filter(Boolean).join(" · ");
  if(line2) doc.text(line2, textX, y+6);
  let line3 = [s.regNo? "Reg. No: "+s.regNo : "", s.phone].filter(Boolean).join("   |   ");
  if(line3) doc.text(line3, textX, y+11.5);
  if(s.address) doc.text(s.address, textX, y+17);
  doc.setDrawColor(47,111,107); doc.setLineWidth(0.8);
  doc.line(15, y+22, 195, y+22);
  return y+30;
}
function buildPrescriptionDoc(rx, p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = letterheadBlock(doc, 18);
  doc.setFontSize(11); doc.setTextColor(21,43,43); doc.setFont('helvetica','bold');
  doc.text(`Patient: ${p.name}`, 15, y);
  doc.setFont('helvetica','normal');
  doc.text(`Age/Sex: ${displayAge(p)} / ${p.gender||'—'}`, 130, y);
  y += 6;
  doc.text(`Patient ID: ${p.patientCode||'—'}`, 15, y);
  doc.text(`Rx No: ${rx.rxCode||'—'}`, 130, y);
  y += 6;
  doc.text(`Date: ${fmtDate(rx.date)}`, 15, y);
  y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Rx', 15, y);
  y += 8;
  doc.setFontSize(11);
  rx.medicines.forEach((m,i)=>{
    doc.setFont('helvetica','bold');
    doc.text(`${i+1}. ${m.name}`, 18, y);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.text(`${m.dosage||''}  ·  ${m.frequency||''}  ·  ${m.duration||''}${m.instructions? '  ·  '+m.instructions:''}`, 22, y+5);
    doc.setFontSize(11);
    y += 12;
    if(y>270){ doc.addPage(); y=20; }
  });
  if(rx.advice){
    y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text('Advice:', 15, y);
    doc.setFont('helvetica','normal');
    const split = doc.splitTextToSize(rx.advice, 175);
    doc.text(split, 15, y+5); y += 5 + split.length*5;
  }
  if(rx.followUp){
    y += 4; doc.setFont('helvetica','bold'); doc.text('Follow-up: ', 15, y);
    doc.setFont('helvetica','normal'); doc.text(fmtDate(rx.followUp), 38, y);
  }
  doc.setFontSize(9); doc.setTextColor(140,150,148);
  doc.text('Generated via clinic app — not valid without doctor signature.', 15, 285);
  return doc;
}
function buildReceiptDoc(rc, p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = letterheadBlock(doc, 18);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(21,43,43);
  doc.text('Payment Receipt', 15, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,100,98);
  doc.text(`Receipt No: ${rc.receiptCode||'—'}`, 130, y);
  doc.setTextColor(21,43,43);
  y+=9;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Patient: ${p.name}`, 15, y);
  doc.text(`Date: ${fmtDate(rc.date)}`, 130, y);
  y += 6;
  doc.text(`Patient ID: ${p.patientCode||'—'}`, 15, y);
  y += 10;
  doc.setDrawColor(224,230,226);
  doc.line(15,y,195,y); y+=7;
  doc.setFont('helvetica','bold');
  doc.text('Description', 15, y); doc.text('Amount', 175, y, {align:'right'});
  y += 5; doc.setFont('helvetica','normal');
  doc.line(15,y,195,y); y+=7;
  rc.items.forEach(it=>{
    doc.text(it.desc, 15, y);
    doc.text(`Rs. ${it.amount}`, 195, y, {align:'right'});

  });

  doc.text(`Payment mode: ${rc.paymentMode||'—'}`, 15, y);
  doc.setFontSize(9); doc.setTextColor(140,150,148);
  doc.text('Thank you for visiting.', 15, 285);
  return doc;
}
async function downloadPrescriptionPDF(rxId){
  const rx = findRxRecord(rxId);
  if(!rx){ showToast('Prescription not found'); return; }
  const p = await resolvePatientForRecord(rx);
  const doc = buildPrescriptionDoc(rx, p);
  doc.save(`Prescription_${(p.name||'patient').replace(/\s+/g,'_')}_${rx.date}.pdf`);
  showToast('PDF downloaded');
}
async function downloadReceiptPDF(receiptId){
  const rc = findReceiptRecord(receiptId);
  if(!rc){ showToast('Receipt not found'); return; }
  const p = await resolvePatientForRecord(rc);
  const doc = buildReceiptDoc(rc, p);
  doc.save(`Receipt_${(p.name||'patient').replace(/\s+/g,'_')}_${rc.date}.pdf`);
  showToast('PDF downloaded');
}

/* ---------------- UTIL ---------------- */
function escapeHtml(s){ if(s===undefined||s===null) return ""; return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
// Lightweight, safe markdown renderer for AI output: escapes everything
// first (so nothing the AI returns can inject real HTML), then converts a
// small set of markdown patterns to formatting tags on top of the already-
// escaped text.
function mdToHtml(text){
  let safe = escapeHtml(text||'');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  safe = safe.replace(/(^|[\s(])\*(?!\s)(.+?)(?<!\s)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  const lines = safe.split('\n');
  let html = '', listType = null;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*•]\s+(.*)/);
    const numbered = raw.match(/^\s*\d+[\.\)]\s+(.*)/);
    if(bullet){
      if(listType!=='ul'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ul style="margin:4px 0 4px 18px;padding:0">'; listType='ul'; }
      html += `<li style="margin-bottom:2px">${bullet[1]}</li>`;
    } else if(numbered){
      if(listType!=='ol'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ol style="margin:4px 0 4px 18px;padding:0">'; listType='ol'; }
      html += `<li style="margin-bottom:2px">${numbered[1]}</li>`;
    } else {
      if(listType){ html += listType==='ul'?'</ul>':'</ol>'; listType=null; }
      html += raw.trim()==='' ? '<div style="height:6px"></div>' : `<div style="margin:2px 0">${raw}</div>`;
    }
  }
  if(listType) html += listType==='ul'?'</ul>':'</ol>';
  return html;
}

/* ---------------- EXIT GUARDS ---------------- */
// 1) Browser tab close / reload / navigate-away: shows the browser's own
//    native "leave site?" prompt. Wording is controlled by the browser, not us.
//    Note: iOS Safari largely ignores this (Apple disabled custom unload
//    prompts years ago) — the back-button trap below still works there.
window.addEventListener('beforeunload', (e)=>{
  e.preventDefault();
  e.returnValue = '';
});

// 2) Back button / swipe-back gesture: trapped with our own confirmation.
let exitGuardActive = true;
function armExitGuard(){
  history.pushState({guard:true}, '', location.href);
  window.addEventListener('popstate', onPopState);
}
function onPopState(){
  if(!exitGuardActive) return; // user already chose to exit — let this one through
  history.pushState({guard:true}, '', location.href); // re-arm the trap
  if(state.modal && state.modal.type !== 'confirm-exit'){
    closeModal(); // back closes an open form/sheet first, like a normal app
    return;
  }
  if(state.view.screen==='visit-detail' || state.view.screen==='patient-detail'){
    goBack(); // back steps up through the app's own navigation first
    return;
  }
  if(state.view.tab!=='patients'){
    goTab('patients','patients-list');
    return;
  }
  openModal('confirm-exit');
}
function handleExitChoice(leave){
  closeModal();
  if(leave){
    exitGuardActive = false;
    window.removeEventListener('popstate', onPopState);
    showToast('Press back once more to exit');
  }
}
armExitGuard();
