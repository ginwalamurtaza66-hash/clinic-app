/* ---------------- LONG OPERATIONS ----------------
   Bulk work — importing 5,000 rows, erasing a clinic, loading demo data —
   used to run with no visible sign that anything was happening. A 5,000-row
   import is thirteen sequential batch commits and can take the better part of
   a minute, during which the button looked idle and pressable.

   Pressing it twice ran the whole import twice. Both runs read the existing
   phone numbers before either had written anything, so neither could see the
   other's rows as duplicates, and both proceeded — which is how a partial
   double-import happens. That is a data-integrity bug, not a missing spinner,
   and the guard is the important half of this fix.

   beginSave()/endSave() already did exactly this for single-record saves and
   was simply never applied to the bulk paths. runExclusive() is that idea plus
   a visible state, and the click dispatcher enforces it globally so a new bulk
   action cannot forget to opt in. */
/* A web page is not a background service. When the screen sleeps or the app is
   backgrounded, the browser throttles timers and may discard the page outright,
   which freezes a batch loop wherever it happens to be — a 5,000-row import
   stopping around 3,100 is eight of its thirteen batches, then nothing.

   Three defences, in order of how much they help:

   1. A screen wake lock for the duration, so the screen does not sleep in the
      first place. This is the one that actually prevents the problem, and it
      is why the operation is worth blocking the UI for.
   2. A beforeunload prompt, so closing the tab mid-write asks first.
   3. Watching for the page being hidden anyway — the wake lock does not exist
      on iOS Safari and does not stop someone switching apps — so the operation
      can say it was interrupted rather than finishing silently short.

   Every wrapped operation is idempotent by design: the import skips rows whose
   phone number already exists, erase and demo-removal delete by query, and the
   index repair only writes records that are out of date. So the honest recovery
   is "run it again", and the message says so. */
let _wakeLock = null;
async function acquireWakeLock(){
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      _wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){ _wakeLock = null; }   // denied or unsupported — the rest still applies
}
function releaseWakeLock(){
  if(_wakeLock){ try{ _wakeLock.release(); }catch(e){} _wakeLock = null; }
}
function _busyUnloadGuard(e){
  if(!state._busy) return;
  e.preventDefault();
  e.returnValue = '';   // required for the browser to show its own prompt
  return '';
}
async function runExclusive(key, label, fn){
  if(state._busy){
    showToast(`${state._busy.label} is still running — please wait`);
    return;
  }
  state._busy = {key, label, done:0, total:0, interrupted:false};
  render();
  await acquireWakeLock();
  window.addEventListener('beforeunload', _busyUnloadGuard);
  const onHidden = () => {
    if(document.visibilityState === 'hidden' && state._busy) state._busy.interrupted = true;
  };
  document.addEventListener('visibilitychange', onHidden);
  const progress = (done, total) => {
    if(!state._busy) return;
    state._busy.done = done; state._busy.total = total;
    render();
  };
  try{
    return await fn(progress);
  } finally {
    const wasInterrupted = !!(state._busy && state._busy.interrupted);
    const done = state._busy ? state._busy.done : 0;
    const total = state._busy ? state._busy.total : 0;
    document.removeEventListener('visibilitychange', onHidden);
    window.removeEventListener('beforeunload', _busyUnloadGuard);
    releaseWakeLock();
    state._busy = null;
    render();
    if(wasInterrupted && total && done < total){
      showNotice(`${label} was interrupted`,
        `The screen turned off or the app was switched away, so this stopped after about ${done.toLocaleString()} of ${total.toLocaleString()}. Run it again to finish — anything already done will be skipped.`, 'warn');
    }
  }
}
function renderBusyOverlay(){

  const pct = b.total ? Math.round((b.done/b.total)*100) : null;
  return `

// Scroll retention.
//
// render() rebuilds the whole of #app, which throws away <main>'s scroll
// position — so returning from a record, or loading another page of results,
// used to dump you back at the top of a list you'd scrolled a long way into.
// rememberScroll() banks the current position against the screen you're
// leaving; setting _restoreScrollFor makes the NEXT render put it back, but
// only if that render is actually showing the screen the position belongs to.
// Which element actually scrolls depends on the viewport: <main> has its own
// overflow, but when the shell isn't height-constrained (short pages, desktop
// widths, some mobile browsers) the document scrolls instead and <main> just
// grows. Ask rather than assume, or the position gets saved from an element
// that never moved.
function scrollHost(){
  const m = document.querySelector('main');
  if(m && m.scrollHeight > m.clientHeight + 4) return m;
  return document.scrollingElement || document.documentElement;
}
function rememberScroll(screen){
  const h = scrollHost();
  if(!h) return;
  state._scrollMemory = state._scrollMemory || {};
  state._scrollMemory[screen || state.view.screen] = h.scrollTop;
}
function restoreScrollOnNextRender(screen){ state._restoreScrollFor = screen; }
function applyPendingScrollRestore(){
  const want = state._restoreScrollFor;
  state._restoreScrollFor = null;
  if(!want || want !== state.view.screen) return;
  const top = (state._scrollMemory||{})[want];
  if(!top) return;
  const h = scrollHost();
  if(h) h.scrollTop = top;
}
function forgetScroll(){ state._scrollMemory = {}; state._restoreScrollFor = null; }

function goBack(){
  if(state.view.screen==="visit-detail"){
    // A visit opened from Records (or the attachments manager) belongs to that
    // list, not to the patient's chart. Going back has to return to the list
    // you actually came from, with its filters and scroll position intact —
    // otherwise you land in the patient chart and have to re-enter the tab,
    // which reloads the list from page one.
    const from = state.view.from;
    if(from && from.screen){
      state.view = {tab: from.tab, screen: from.screen, patientId:null, visitId:null};
      restoreScrollOnNextRender(from.screen);
      render();
      return;
    }
    state.view.screen="patient-detail";
    restoreScrollOnNextRender("patient-detail");
  }
  else if(state.view.screen==="patient-detail"){ state.view.screen="patients-list"; state.view.patientId=null; state.view.from=null; restoreScrollOnNextRender("patients-list"); }
  else if(state.view.screen==="master-list-detail"){ goToMasterLists(); return; }
  else if(state.view.screen==="master-lists"){ state.view.screen="settings"; state.view.tab="settings"; }
  else if(state.view.screen==="analytics" || state.view.screen==="duplicate-finder" || state.view.screen==="attachments-manager" || state.view.screen==="sync-conflicts"){ state.view.screen="settings"; state.view.tab="settings"; }

/* ================= APPOINTMENTS (3.22.0) ================= */

async function loadBookingRequests(){
  try{
    const snap = await withTimeout(getDocs(query(bookingRequestsCol(),
      where('status','==','Pending'), orderBy('requestedDate'), limit(50))),
      15000, 'load booking requests');
    state.bookingRequests = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // A pending request from a stranger carries a phone number, not a patient.
    // Resolve each against the patient index so the front desk can see at a
    // glance whether this is someone already on file. Matching is a HINT, not
    // an identification: families share one mobile number, which is why the
    // app has family links at all, and why confirming still asks the staff
    // member which patient this is.
    for(const r of state.bookingRequests){
      const digits = String(r.mobile||'').replace(/\D/g,'');
      if(digits.length < 5){ r._matches = []; continue; }
      try{
        const m = await withTimeout(getDocs(query(patientsCol(),
          where('phoneNormalized','==',digits), limit(5))), 12000, 'match booking phone');
        r._matches = m.docs.map(d=>({id:d.id, ...d.data()}));
      }catch(e){ console.error('phone match failed', e && e.code, e && e.message); r._matches = []; }
    }
    state._bookingLoadFailed = false;
  }catch(e){
    // Log the WHOLE error, not just e.code. Firestore puts the one-click index
    // creation URL in e.message, and 3.23.1 logged only the code -- so the
    // on-screen message told people to look in the console for a link that
    // this very line had just thrown away. Reported from a live clinic.
    console.error('loadBookingRequests failed', e && e.code, e && e.message, e);
    // 'failed-precondition' means the composite index is missing, not that the
    // connection is down. The first version of this handler said "check your
    // connection" for every failure, which sent someone hunting a network
    // problem that did not exist while Firestore was printing a one-click fix
    // link in a console nobody had open.
    state._bookingLoadCode = (e && e.code) || '';
    // Say so rather than rendering an empty inbox: "no requests" and "we could
    // not check" look identical on screen and mean opposite things.
    state._bookingLoadFailed = true;
    state.bookingRequests = [];
  }
}

async function confirmBookingRequest(requestId, patientId){
  const req = (state.bookingRequests||[]).find(r=>r.id===requestId);
  if(!req) return;
  if(state._bookingBusy) return;          // double-submit guard, per invariant 31
  state._bookingBusy = requestId; render();
  const lockId = slotLockId(req.requestedDate, req.requestedSlot);
  try{
    const apptRef = doc(appointmentsCol());
    // One batch: claim the slot, create the appointment, mark the request
    // Confirmed. The slot lock is a create -- `allow update: if false` means a
    // set() onto an existing lock is REJECTED, so if another confirmation got
    // there first this whole batch fails and nothing is half-written. The
    // check and the claim are one operation, which is what makes it race-free;
    // reading first and then writing would leave a window between them.
    //
    // A booking with no usable date/slot yields lockId '' and is confirmed
    // without a lock rather than being blocked -- an unslotted appointment
    // reserves nothing, and refusing to confirm it would be worse.
    const batch = writeBatch(db);
    if(lockId){
      batch.set(doc(slotLocksCol(), lockId), {
        date: req.requestedDate || '',
        slot: req.requestedSlot || '',
        createdAt: new Date().toISOString()
        // NO requestId or patientId here. This document is publicly readable
        // and a booking's ID is the token that opens that booking.
      });
    }
    batch.set(apptRef, {
      // IDs only. Names are NOT copied here — that is the denormalisation
      // problem in §6, and an appointment that outlives a rename should still
      // point at the right person.
      patientId: patientId || '',
      requestId,
      requestedDate: req.requestedDate || '',
      requestedSlot: req.requestedSlot || '',
      reason: req.reason || '',
      mobile: req.mobile || '',
      name: req.name || '',              // the name AS TYPED by the requester
      status: 'Confirmed',
      visitId: '',                        // filled when they actually arrive
      createdAt: new Date().toISOString(),
      _v: 1
    });
    batch.update(doc(bookingRequestsCol(), requestId),
      { status:'Confirmed', confirmedAt: new Date().toISOString() });
    await withTimeout(batch.commit(), 15000, 'confirm booking');
    showToast('Appointment confirmed');
  }catch(e){
    console.error('confirmBookingRequest failed', e && e.code, e && e.message);
    // permission-denied on this path almost always means the lock already
    // existed. Confirm that before blaming it, so a genuine rules problem is
    // not reported to the clinic as a double booking.
    let taken = false;
    if(e && e.code === 'permission-denied' && lockId){
      try{
        const snap = await getDoc(doc(slotLocksCol(), lockId));
        taken = snap.exists();
      }catch(_){ /* leave taken false and use the generic message */ }
    }
    showToast(taken
      ? 'That slot has just been taken — decline this request or offer another time'
      : 'Could not confirm — check your connection and try again');
  }finally{
    state._bookingBusy = null;
    await loadBookingRequests();
    render();
  }
}

async function declineBookingRequest(requestId, reason){
  if(state._bookingBusy) return;
  state._bookingBusy = requestId; render();
  try{
    // Read the request rather than looking it up in state.bookingRequests.
    // That array holds ONLY Pending requests -- loadBookingRequests queries
    // where('status','==','Pending') -- so a confirmed booking is never in it
    // and a state lookup silently found nothing, leaving the slot locked
    // forever. Caught by a test; the code read fine.
    let prior = null;
    try{
      const snap = await withTimeout(getDoc(doc(bookingRequestsCol(), requestId)),
        10000, 'read booking request');
      if(snap.exists()) prior = snap.data();
    }catch(e){ console.error('reading request before decline failed', e && e.code); }

    await withTimeout(updateDoc(doc(bookingRequestsCol(), requestId),
      { status:'Declined', declinedAt: new Date().toISOString(),
        declineReason: String(reason||'').slice(0,200) }),
      15000, 'decline booking request');
    // Declining a request that had been confirmed must give the slot back,
    // or the clinic loses that time forever with nothing on screen to explain
    // why it can never be booked again. Deliberately AFTER the status update
    // and deliberately non-fatal: a freed slot that failed to free is a
    // nuisance, whereas a decline that appears to fail because the cleanup
    // threw would make staff decline it twice.
    if(prior && prior.status === 'Confirmed'){
      const lockId = slotLockId(prior.requestedDate, prior.requestedSlot);
      if(lockId){
        try{
          await withTimeout(deleteDoc(doc(slotLocksCol(), lockId)), 10000, 'free slot');
        }catch(e){
          console.error('freeing slot lock failed', e && e.code, e && e.message);
        }
      }
    }
    showToast('Request declined');
  }catch(e){
    console.error('declineBookingRequest failed', e && e.code);
    showToast('Could not decline — check your connection and try again');
  }finally{
    state._bookingBusy = null;
    await loadBookingRequests();
    render();
  }
}

function goToAppointments(){
  state.view = { screen:'appointments' };
  // null means "not loaded yet", [] means "loaded and genuinely empty". Without
  // this the first paint used the stale/empty array and flashed "No new
  // requests" for the length of the query -- which reads as "you have none",
  // the opposite of the truth, to anyone who looks away for a second.
  state.bookingRequests = null;
  state._bookingLoadFailed = false;
  render();
  loadBookingRequests().then(render);
}

/* ---------------- ALL BOOKINGS ---------------- */

/* Every booking the clinic has ever received, with filters and multi-select.
   Appointments shows only what is waiting; this is the history.

   WHY THE QUERY IS DELIBERATELY DUMB: it orders by requestedDate and filters
   status, archived and the date range IN MEMORY. Filtering server-side would
   need a composite index per combination of filters, and each one is a manual
   console action on every clinic -- the exact step that has been skipped three
   times in this project's history. A few hundred documents filter instantly in
   the browser, and orderBy on a single field uses an automatic index. No new
   console step ships with this feature.

   The cap is real: past BOOKINGS_PAGE_MAX the screen says so rather than
   silently showing a truncated history, because a filter over a truncated set
   quietly lies. */
const BOOKINGS_PAGE_MAX = 300;

async function loadAllBookings(){
  state._allBookingsLoading = true;
  state._allBookingsFailed = false;
  try{
    const snap = await withTimeout(getDocs(query(bookingRequestsCol(),
      orderBy('requestedDate','desc'), limit(BOOKINGS_PAGE_MAX + 1))),
      15000, 'load all bookings');
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state._allBookingsTruncated = rows.length > BOOKINGS_PAGE_MAX;
    state.allBookings = rows.slice(0, BOOKINGS_PAGE_MAX);
  }catch(e){
    console.error('loadAllBookings failed', e && e.code, e && e.message);
    state._allBookingsFailed = true;
    state._allBookingsCode = e && e.code;
    // Do NOT fall back to an empty list: "we could not load your bookings" and
    // "you have no bookings" must never look the same.
    state.allBookings = null;
  }finally{
    state._allBookingsLoading = false;
  }
}

function goToAllBookings(){
  state.view = { screen:'all-bookings' };
  state.allBookings = null;
  state._bookingsSelected = [];
  state._bookingsSelectMode = false;
  if(!state._bookingsFilter) state._bookingsFilter =
    { status:'all', showArchived:false, from:'', to:'' };
  render();
  loadAllBookings().then(render);
}

/* The filter is applied in one place so the list, the counter, the select-all
   box and the bulk actions can never disagree about what "these bookings"
   means -- selecting all, changing a filter and then archiving is exactly how
   a bulk action archives something nobody could see. */
function filteredBookings(){
  const f = state._bookingsFilter || {};
  return (state.allBookings || []).filter(b => {
    if(!f.showArchived && b.archived) return false;
    if(f.showArchived && !b.archived) return false;
    if(f.status && f.status !== 'all' && (b.status||'Pending') !== f.status) return false;
    const d = b.requestedDate || '';
    if(f.from && d && d < f.from) return false;
    if(f.to && d && d > f.to) return false;
    return true;
  });
}

function setBookingsFilter(key, value){
  state._bookingsFilter = Object.assign({}, state._bookingsFilter, { [key]: value });
  // Anything selected but now filtered out must be dropped from the selection,
  // or a later "archive selected" acts on rows the person can no longer see.
  const visible = new Set(filteredBookings().map(b => b.id));
  state._bookingsSelected = (state._bookingsSelected||[]).filter(id => visible.has(id));
  render();
}

function toggleBookingSelected(id){
  const cur = state._bookingsSelected || [];
  state._bookingsSelected = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat([id]);
  render();
}

function toggleSelectAllBookings(){
  const visible = filteredBookings().map(b => b.id);
  const all = visible.length && visible.every(id => (state._bookingsSelected||[]).includes(id));
  state._bookingsSelected = all ? [] : visible;
  render();
}

function exitBookingsSelectMode(){
  state._bookingsSelectMode = false;
  state._bookingsSelected = [];
  render();
}

/* Archive is the default and delete is not. A booking request is around 300
   bytes; ten thousand of them is about three megabytes, so deleting to save
   space solves a problem this app does not have, while destroying the record
   of an appointment the clinic may need if a patient ever disputes one.
   Archiving hides it from the default view and keeps the history. */
async function archiveSelectedBookings(archived){
  const ids = (state._bookingsSelected || []).slice();
  if(!ids.length) return;
  state._bookingsBusy = true; render();
  let done = 0;
  try{
    // Chunked: Firestore caps a batch at 500 writes, and a clinic clearing a
    // year of history will exceed that.
    for(let i = 0; i < ids.length; i += 400){
      const chunk = ids.slice(i, i + 400);
      const batch = writeBatch(db);
      chunk.forEach(id => batch.update(doc(bookingRequestsCol(), id),
        { archived: !!archived, archivedAt: archived ? new Date().toISOString() : null }));
      await withTimeout(batch.commit(), 20000, 'archive bookings');
      done += chunk.length;
    }
    showToast((archived ? 'Archived ' : 'Restored ') + done + ' booking' + (done===1?'':'s'));
  }catch(e){
    console.error('archiveSelectedBookings failed', e && e.code, e && e.message);
    showToast('Could not ' + (archived ? 'archive' : 'restore') +
      ' — check your connection and try again');
  }finally{
    state._bookingsBusy = false;
    state._bookingsSelected = [];
    state._bookingsSelectMode = false;
    await loadAllBookings();
    render();
  }
}

async function deleteSelectedBookings(){
  const ids = (state._bookingsSelected || []).slice();
  if(!ids.length) return;
  // Gated the same way as every other irreversible action in this app (see
  // isDoctor() on the Staff tab, prescription edits and booking settings).
  // Archiving is reversible and open to everyone; permanently destroying
  // appointment history is not. Checked HERE and not only on the button,
  // because a hidden button is not a permission.
  if(!isDoctor()){
    showToast('Only a doctor can permanently delete bookings — archive instead');
    return;
  }
  const rows = (state.allBookings||[]).filter(b => ids.includes(b.id));
  state._bookingsBusy = true; render();
  let done = 0;
  try{
    for(let i = 0; i < ids.length; i += 400){
      const chunk = ids.slice(i, i + 400);
      const batch = writeBatch(db);
      chunk.forEach(id => batch.delete(doc(bookingRequestsCol(), id)));
      await withTimeout(batch.commit(), 20000, 'delete bookings');
      done += chunk.length;
    }
    // Deleting a CONFIRMED booking must give its slot back, or the clinic
    // loses that time forever with nothing left on screen to explain why it
    // can never be booked again. Non-fatal, and after the delete: a slot that
    // failed to free is a nuisance, a delete that looked like it failed would
    // be repeated.
    for(const b of rows){
      if((b.status||'') !== 'Confirmed') continue;
      const lockId = slotLockId(b.requestedDate, b.requestedSlot);
      if(!lockId) continue;
      try{
        await withTimeout(deleteDoc(doc(slotLocksCol(), lockId)), 10000, 'free slot');
      }catch(e){ console.error('freeing slot after delete failed', e && e.code); }
    }
    showToast('Deleted ' + done + ' booking' + (done===1?'':'s'));
  }catch(e){
    console.error('deleteSelectedBookings failed', e && e.code, e && e.message);
    showToast('Could not delete — check your connection and try again');
  }finally{
    state._bookingsBusy = false;
    state._bookingsSelected = [];
    state._bookingsSelectMode = false;
    await loadAllBookings();
    render();
  }
}

function renderAllBookings(){
  if(state._allBookingsLoading && state.allBookings === null){
    return `<div class="empty-state"><div class="spinner"></div>
      <p style="margin-top:10px">Loading bookings…</p></div>`;
  }
  if(state._allBookingsFailed){
    return `<div class="card"><div style="font-size:13px;color:var(--danger);line-height:1.5">
      ${state._allBookingsCode === 'failed-precondition'
        ? 'Bookings need a database index that has not been created yet. Open this screen with the browser console open — Firestore prints a link that creates it in one click.'
        : 'Could not load bookings. This is not the same as having none — check your connection and try again.'}
      </div><button class="btn btn-secondary btn-block" style="margin-top:10px" data-h-click="${_h(()=>{ goToAllBookings() })}">Try again</button></div>`;
  }

  const f = state._bookingsFilter || {};
  const rows = filteredBookings();
  const sel = state._bookingsSelected || [];
  const selMode = state._bookingsSelectMode;
  const allSel = rows.length && rows.every(b => sel.includes(b.id));
  const STATUSES = ['all','Pending','Confirmed','Declined','Cancelled'];

  const chip = (label, active, onClick) =>
    `<button class="btn ${active?'btn-primary':'btn-secondary'}" style="padding:5px 11px;font-size:12px;border-radius:999px"
      data-h-click="${onClick}">${label}</button>`;

  const filters = `<div class="card" style="padding:11px 12px">
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${STATUSES.map(st => chip(st==='all'?'All':st, (f.status||'all')===st,
        _h(()=>{ setBookingsFilter('status', st) }))).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:9px;align-items:center">
      <label style="font-size:11.5px;color:var(--ink-soft)">From</label>
      <input type="date" value="${escapeAttr(f.from||'')}" style="flex:1;font-size:12px"
        data-h-change="${_h((e)=>{ setBookingsFilter('from', e.target.value) })}">
      <label style="font-size:11.5px;color:var(--ink-soft)">To</label>
      <input type="date" value="${escapeAttr(f.to||'')}" style="flex:1;font-size:12px"
        data-h-change="${_h((e)=>{ setBookingsFilter('to', e.target.value) })}">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px">
      <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${f.showArchived?'checked':''}
          data-h-change="${_h(()=>{ setBookingsFilter('showArchived', !f.showArchived) })}">
        Show archived
      </label>
      ${(f.from||f.to||(f.status&&f.status!=='all'))
        ? `<button class="btn btn-secondary" style="padding:4px 10px;font-size:11.5px"
            data-h-click="${_h(()=>{ state._bookingsFilter={status:'all',showArchived:f.showArchived,from:'',to:''}; state._bookingsSelected=[]; render() })}">Clear filters</button>`
        : ''}
    </div>
  </div>`;

  const bar = selMode
    ? `<div class="card" style="padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <label style="font-size:12.5px;display:flex;align-items:center;gap:7px;cursor:pointer">
          <input type="checkbox" ${allSel?'checked':''}
            data-h-change="${_h(()=>{ toggleSelectAllBookings() })}">
          ${sel.length} selected
        </label>
        <button class="btn btn-secondary" style="padding:4px 10px;font-size:11.5px"
          data-h-click="${_h(()=>{ exitBookingsSelectMode() })}">Cancel</button>
      </div>`
    : `<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 2px 8px">
        <div style="font-size:11.5px;color:var(--ink-soft)">${rows.length} booking${rows.length===1?'':'s'}${f.showArchived?' (archived)':''}</div>
        ${rows.length ? `<button class="btn btn-secondary" style="padding:4px 10px;font-size:11.5px"
          data-h-click="${_h(()=>{ state._bookingsSelectMode=true; render() })}">Select</button>` : ''}
      </div>`;

  const truncated = state._allBookingsTruncated
    ? `<div class="card" style="font-size:11.5px;color:var(--ink-soft);line-height:1.5">
        Showing the most recent ${BOOKINGS_PAGE_MAX} bookings. Older ones are not
        listed here, so a filter applies only to these. Archive what you have
        dealt with to keep this list meaningful.</div>`
    : '';

  if(!rows.length){
    return `${filters}${truncated}<div class="empty-state">
      <p>${(state.allBookings||[]).length ? 'No bookings match these filters.' : 'No bookings yet.'}</p></div>`;
  }

  const list = rows.map(b => {
    const st = b.status || 'Pending';
    const tone = st==='Confirmed' ? 'var(--tincture)' : st==='Pending' ? 'var(--ink-soft)' : 'var(--danger)';
    const checked = sel.includes(b.id);
    return `<div class="card" style="padding:10px 12px;display:flex;gap:10px;align-items:flex-start${checked?';background:var(--tincture-tint)':''}"
        ${selMode?`data-h-click="${_h(()=>{ toggleBookingSelected(b.id) })}"`:''}>
      ${selMode ? `<input type="checkbox" ${checked?'checked':''} style="margin-top:3px;pointer-events:none">` : ''}
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(b.name||'—')}</div>
          <div class="stamp-tag" style="color:${tone};border-color:${tone};flex:none">${escapeHtml(st)}</div>
        </div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">
          ${escapeHtml(b.requestedDate||'—')}${b.requestedSlot?' · '+escapeHtml(b.requestedSlot):''}
          ${b.mobile?' · '+escapeHtml(b.mobile):''}
        </div>
        ${b.archived?`<div style="font-size:11px;color:var(--ink-soft);margin-top:3px">Archived</div>`:''}
      </div>
    </div>`;
  }).join('');

  const actions = (selMode && sel.length)
    ? `<div class="card" style="position:sticky;bottom:8px;display:flex;gap:8px;padding:10px 12px">
        ${f.showArchived
          ? `<button class="btn btn-secondary btn-block" ${state._bookingsBusy?'disabled':''}
              data-h-click="${_h(()=>{ archiveSelectedBookings(false) })}">Restore</button>`
          : `<button class="btn btn-primary btn-block" ${state._bookingsBusy?'disabled':''}
              data-h-click="${_h(()=>{ archiveSelectedBookings(true) })}">Archive</button>`}
        ${isDoctor() ? `<button class="btn btn-secondary btn-block" ${state._bookingsBusy?'disabled':''}
          style="color:var(--danger);border-color:var(--danger)"
          data-h-click="${_h(()=>{ confirmDeleteBookings() })}">Delete</button>` : ''}
      </div>`
    : '';

  return `${filters}${truncated}${bar}${list}${actions}`;
}

/* Delete asks, archive does not. Archiving is reversible from the same screen;
   deleting a booking destroys the record of an appointment. The count goes in
   the question because "Delete?" after a mis-tapped select-all is how a year
   of history disappears. */
function confirmDeleteBookings(){
  if(!isDoctor()){
    showToast('Only a doctor can permanently delete bookings — archive instead');
    return;
  }
  const n = (state._bookingsSelected||[]).length;
  if(!n) return;
  openModal('confirm-delete-bookings', {count:n});
}

/* A link to the full history, appended to EVERY state of this screen.

   3.27.0 shipped renderAllBookings() with no way to reach it: the only call to
   goToAllBookings() was the "Try again" button on that screen's own error
   state, so the screen existed and no route led to it. A feature nobody can
   navigate to is not a feature.

   It matters most in the empty state -- "no new requests" is precisely when
   someone wants to look at what has already been through. */
function renderAllBookingsLink(){
  return `<div style="margin-top:14px;text-align:center">
    <button class="btn btn-outline" data-h-click="${_h(()=>{ goToAllBookings() })}"
      style="font-size:12.5px">View all bookings</button></div>`;
}

function renderAppointments(){
  return renderAppointmentsBody() + renderAllBookingsLink();
}

function renderAppointmentsBody(){
  const reqs = state.bookingRequests || [];
  if(state.bookingRequests === null && !state._bookingLoadFailed){
    return `<div class="empty-state"><div class="spinner"></div>
      <p style="margin-top:10px">Checking for booking requests…</p></div>`;

/* Matches the Records screen's counter, so both lists read the same way.

   Three modes, three honest answers, because "34 of 1,240" would be a lie in
   two of them:
     browse — paging through everyone, so the total is the clinic total.
     filter — the query counts the filtered set, so the total is that count.
     search — indexed queries cap at SEARCH_HIT_LIMIT per lookup, so there is
              no total to report and claiming one would invent it. Says how
              many matched instead. */
function renderPatientsCountLine(){
  const loaded = state.patients.length;
  const mode = state._patientsMode || 'browse';
  if(state._patientsLoading) return '';
  let text, note = '';
  if(mode === 'search'){
    text = `${loaded} match${loaded===1?'':'es'}`;
    note = 'best matches';
  } else if(mode === 'filter'){
    const t = state._filteredPatientCount;
    text = (typeof t === 'number')
      ? (loaded >= t ? `${t} patient${t===1?'':'s'} match` : `${loaded} of ${t} matching patients`)
      : `${loaded} matching patient${loaded===1?'':'s'}`;
  } else {
    let t = state._totalPatientCount;
    // If the list holds more than the total claims, the total is stale — the
    // count is fetched once per clinic load and nothing re-ran it after demo
    // data was added. Never print a number smaller than what is visibly on
    // screen: "0 patients" above a list of patients is self-evidently wrong,
    // and it makes the app look broken even when the data is fine.
    if(typeof t === 'number' && loaded > t){
      t = null;
      if(!state._countRefetchPending){
        state._countRefetchPending = true;
        refreshPatientCount().finally(()=>{ state._countRefetchPending = false; });
      }
    }
    text = (typeof t === 'number')
      ? (loaded >= t ? `${t} patient${t===1?'':'s'}` : `${loaded} of ${t} patients`)
      : `${loaded} patient${loaded===1?'':'s'} loaded`;
  }
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;margin-bottom:2px;border-bottom:1px solid var(--rule)">
      <span class="mono" style="font-size:11.5px;color:var(--ink-soft)">${escapeHtml(text)}</span>
      ${note ? `<span class="mono" style="font-size:10.5px;color:var(--amber-ink);background:var(--amber-tint);padding:2px 6px;border-radius:4px">${escapeHtml(note)}</span>` : ''}
    </div>`;
}
// Joins a row of optional metadata fragments with " · ", dropping any that
// are empty — string concatenation with a fixed separator after every
// field (the previous approach) leaves a stray "· ·" wherever a field like
// gender is blank, which is common on quickly-added patient records.
function joinMeta(parts){ return parts.filter(Boolean).join(' · '); }

/* ---------------- LIVE BOOKING REQUESTS ---------------- */

/* A listener, not a poll. Until 3.26.0 the pending count refreshed only when
   someone entered the Patients tab, so a request that arrived while the clinic
   was looking at the screen stayed invisible until they navigated away and
   back. The front desk learned to switch tabs to "check", which is a workaround
   for a bug wearing the costume of a feature.

   NOT push notifications. Real push needs Firebase Cloud Messaging, a Cloud
   Function to send, the Blaze billing plan, and per-clinic VAPID keys -- and on
   iOS it only works if the PWA has been installed to the home screen. That is a
   large per-clinic setup burden for an app meant to be handed to a clinic
   cheaply. This covers the case that actually matters: the app is open on the
   front desk and something arrives.

   Cost: one listener while the app is open. Firestore bills documents
   DELIVERED, so an idle listener costs nothing and a new request costs one
   read -- cheaper than the count aggregation it replaces, which cost one every
   time anyone touched the Patients tab. */
let _bookingUnsub = null;

function stopBookingListener(){
  if(_bookingUnsub){
    try{ _bookingUnsub(); }catch(e){ console.error('detaching booking listener failed', e); }
    _bookingUnsub = null;
  }
  state._bookingListenerSeen = null;
}

function startBookingListener(){
  stopBookingListener();
  // currentUser, not state.user: the app keeps the signed-in user in a module
  // variable and never mirrors it onto state. Guarding on state.user meant the
  // listener silently never attached — the count stayed null and nothing said so.
  if(!state.clinicId || !currentUser) return;
  try{
    _bookingUnsub = onSnapshot(
      query(bookingRequestsCol(), where('status','==','Pending'),
            orderBy('requestedDate'), limit(50)),
      (snap) => {
        const ids = snap.docs.map(d => d.id);
        state._pendingBookingCount = ids.length;

        // The first snapshot reports every existing request as an addition.
        // Chiming for a backlog the clinic already knows about would train
        // them to ignore the sound, so the first delivery only establishes a
        // baseline.
        const seen = state._bookingListenerSeen;
        state._bookingListenerSeen = new Set(ids);
        if(seen){
          const fresh = ids.filter(id => !seen.has(id));
          if(fresh.length){
            playNewRequestChime();
            showToast(fresh.length === 1
              ? 'New booking request'
              : fresh.length + ' new booking requests');
          }
        }

        // Keep the Appointments list live too, but only while it is on screen:
        // replacing it underneath someone mid-scroll on another screen is
        // worse than a slightly stale list they cannot see.
        if(state.view && state.view.screen === 'appointments'){
          loadBookingRequests().then(render);
        } else {
          render();
        }
      },
      (e) => {
        // A listener that dies must not leave a stale count on screen looking
        // authoritative. Fall back to the count-on-tab-entry behaviour.
        console.error('booking listener failed', e && e.code, e && e.message);
        _bookingUnsub = null;
        state._bookingListenerSeen = null;
      });
  }catch(e){
    console.error('starting booking listener failed', e && e.code, e && e.message);
  }
}

/* A short two-note chime, synthesised rather than shipped as an audio file:
   no extra asset to precache, nothing to 404, and it works offline.

   Browsers refuse to play audio before the user has interacted with the page.
   Staff have signed in by the time this can fire, which counts -- but if it is
   ever blocked the toast still appears, so the sound is an enhancement and
   never the only signal. */
function playNewRequestChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    _audioCtx = _audioCtx || new Ctx();
    if(_audioCtx.state === 'suspended') _audioCtx.resume().catch(()=>{});
    const now = _audioCtx.currentTime;
    [[880, 0], [1174.7, 0.13]].forEach(([freq, at]) => {
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      // Ramped, not switched: a square-edged gain change clicks audibly.
      gain.gain.setValueAtTime(0.0001, now + at);
      gain.gain.exponentialRampToValueAtTime(0.16, now + at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.22);
      osc.connect(gain); gain.connect(_audioCtx.destination);
      osc.start(now + at); osc.stop(now + at + 0.25);
    });
  }catch(e){
    // Never let a blocked or unavailable audio device break the notification.
    console.error('chime failed', e && e.message);
  }
}
let _audioCtx = null;

async function refreshPendingBookingCount(){
  try{
    // A count aggregation, not a fetch: this runs on every visit to the
    // Patients tab, and pulling the documents just to length them would cost
    // a read per request for a number nobody clicks most days.
    const snap = await withTimeout(getCountFromServer(query(bookingRequestsCol(),
      where('status','==','Pending'))), 12000, 'count booking requests');
    state._pendingBookingCount = snap.data().count;
  }catch(e){
    console.error('refreshPendingBookingCount failed', e && e.code, e && e.message);
    // Leave the previous count alone rather than showing zero: a failed count
    // and no requests must not look the same.
  }
}

/* Says how many visits match, and — when the answer is only partial — says so

function renderRecordsCountLine(){
  const loaded = state.recordsVisits.length;
  if(!loaded && state._recordsLoading) return '';
  const searching = !!(state._recordsSearch && state._recordsSearch.trim());
  const total = state._recordsTotalCount;
  let text;
  if(searching){
    // Was "in the most recent 1000 visits" — no longer true, and it understated
    // the app. Search now runs across the whole history via the patient index.
    text = state._recordsSearchNarrowed
      ? `${loaded} match${loaded===1?'':'es'} — showing the first ${RECORDS_SEARCH_PATIENT_CAP} patients found. Narrow your search for the rest.`
      : `${loaded} match${loaded===1?'':'es'}`;
  } else if(typeof total === 'number'){
    text = loaded >= total
      ? `${total} visit${total===1?'':'s'}`
      : `${loaded} of ${total} visits`;
  } else {
    text = `${loaded} visit${loaded===1?'':'s'} loaded`;
  }
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;margin-bottom:2px;border-bottom:1px solid var(--rule)">
      <span class="mono" style="font-size:11.5px;color:var(--ink-soft)">${escapeHtml(text)}</span>
      ${searching && state._recordsSearchNarrowed ? `<span class="mono" style="font-size:10.5px;color:var(--amber-ink);background:var(--amber-tint);padding:2px 6px;border-radius:4px">partial</span>` : ''}
    </div>`;
}
function renderRecordsControls(){

    {id:'paid', label:'Paid'}, {id:'partial', label:'Partial'}, {id:'unpaid', label:'Unpaid'}

      <div style="cursor:pointer" data-h-click="${_h((event,el)=>{ setRecordsStatusFilters(['partial','unpaid']) })}">
        <div style="font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--amber-ink)">₹${pendingTotal} pending</div>
        <div style="font-size:11.5px;color:var(--amber-ink)">Across ${pendingVisits.length} unpaid or partially-paid visit(s) loaded so far — tap to see all</div>
      </div>
      <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;flex-shrink:0" data-h-click="${_h((event,el)=>{ toggleRecordsSelectionMode() })}">Select</button>
    </div>` : ''}
    ${selMode ? `
    <div class="card" style="background:var(--teal-tint);border:none;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;color:var(--teal-dark);font-weight:600">${selCount} visit${selCount===1?'':'s'} selected</div>
      <button class="subtle-link" data-h-click="${_h((event,el)=>{ toggleRecordsSelectionMode() })}">Cancel</button>
    </div>` : ''}
    <div class="badges" style="margin:0 0 8px">
      <button class="badge ${statusFilters.length===0?'rx':'receipt'}" style="border:none" data-h-click="${_h((event,el)=>{ setRecordsStatusFilters([]) })}">${statusFilters.length===0?'✓ ':''}All</button>
      ${statusChips.map(c=>`<button class="badge ${statusFilters.includes(c.id)?'rx':'receipt'}" style="border:none" data-h-click="${_h((event,el)=>{ toggleRecordsStatusFilter((c.id)) })}">${statusFilters.includes(c.id)?'✓ ':''}${c.label}</button>`).join("")}
    </div>
    <div style="font-size:11px;color:var(--ink-soft);margin:-4px 0 12px">Tap to combine — e.g. Partial + Unpaid together for everything outstanding.</div>
    <div class="badges" style="margin:0 0 12px">
      <button class="badge ${state._recordsLabReportFilter?'rx':'receipt'}" style="border:none" data-h-click="${_h((event,el)=>{ toggleRecordsLabReportFilter() })}">${state._recordsLabReportFilter?'✓ ':''}📎 Has lab report</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:${state._recordsFiltersOpen?'10px':'14px'}">
      <input id="recordsSearchInput" style="flex:1;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--ink)" placeholder="Search by patient name, phone, ID, or visit ID" data-h-input="${_h((event,el)=>{ onRecordsSearch(el.value) })}" value="${escapeAttr(state._recordsSearch||'')}">
      <button class="icon-btn" style="background:var(--teal-tint);color:var(--teal-dark);flex-shrink:0" data-h-click="${_h((event,el)=>{ toggleRecordsFilters() })}">${icon('tune',{size:20})}</button>

    <div class="card" style="margin-bottom:14px">
      <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px">Visit date range</label>
      <div class="row2">
        <div class="field" style="margin-bottom:0"><input type="date" value="${state._recordsDateFrom||''}" data-h-change="${_h((event,el)=>{ setRecordsDateFrom(el.value) })}"></div>
        <div class="field" style="margin-bottom:0"><input type="date" value="${state._recordsDateTo||''}" data-h-change="${_h((event,el)=>{ setRecordsDateTo(el.value) })}"></div>
      </div>

function toggleRecordsLabReportFilter(){
  state._recordsLabReportFilter = !state._recordsLabReportFilter;
  loadRecordsPage(true).then(render);
}
function toggleRecordsSelectionMode(){
  state._recordsSelectionMode = !state._recordsSelectionMode;
  state._recordsSelectedIds = [];
  render();
}
function toggleRecordSelection(visitId){
  if(!state._recordsSelectedIds) state._recordsSelectedIds = [];
  const i = state._recordsSelectedIds.indexOf(visitId);
  if(i===-1) state._recordsSelectedIds.push(visitId); else state._recordsSelectedIds.splice(i,1);
  render();
}
function toggleRecordsStatusFilter(status){
  if(!state._recordsStatusFilters) state._recordsStatusFilters = [];
  const i = state._recordsStatusFilters.indexOf(status);
  if(i===-1) state._recordsStatusFilters.push(status); else state._recordsStatusFilters.splice(i,1);
  // The filter is part of the query now, so changing it means refetching from
  // the first page rather than re-rendering what is already in memory.
  loadRecordsPage(true).then(render);
}
function setRecordsStatusFilters(arr){
  state._recordsStatusFilters = arr;
  loadRecordsPage(true).then(render);
}
function receiptStatusBadgeFromVisit(v){
  const status = v.receiptStatus || 'unpaid';
  const label = {paid:'Paid', partial:'Partial', unpaid:'Unpaid'}[status];
  const style = status==='paid' ? 'background:var(--teal-tint);color:var(--teal-dark);border:1px solid var(--teal)'
    : status==='partial' ? 'background:var(--amber-tint);color:var(--amber-ink);border:1px solid var(--tincture)'
    : 'background:var(--danger-tint);color:var(--danger);border:1px solid var(--danger)';
  return `<span class="badge" style="${style}">🧾 ${label}</span>`;
}
function renderRecordsList(){
  if(state._recordsLoading) return `<div class="skel-card"><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div><div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w40"></div></div><div class="skel-card"><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>`;
  const statusFilters = state._recordsStatusFilters || [];
  let visits = state.recordsVisits.slice();
  // No client-side status/attachment filtering here any more — loadRecordsPage()
  // puts both into the Firestore query, so this list is already the complete
  // filtered set for the pages fetched so far. Re-filtering here would have
  // silently masked a query that stopped working.
  // The text-search path is the exception: it reads from the capped pool, so it
  // still narrows locally and says so in the UI.
  if(state._recordsSearch && state._recordsSearch.trim()){
    if(statusFilters.length>0){
      visits = visits.filter(v=>v.hasReceipt && statusFilters.includes(v.receiptStatus));
    }
    if(state._recordsLabReportFilter){
      visits = visits.filter(v=>v.attachments && v.attachments.length);
    }
  }
  visits.sort((a,b)=>b.date.localeCompare(a.date));
  if(visits.length===0){
    const hasQuery = state._recordsSearch || state._recordsDateFrom || state._recordsDateTo || statusFilters.length>0 || state._recordsLabReportFilter;
    return `<div class="empty-state"><div class="eb">🗂️</div><h3>${hasQuery? "No matches" : "No visits yet"}</h3><p>${hasQuery? "Try a different search, date range, or filter." : "Visits you log will show up here."}</p></div>`;
  }
  const selMode = state._recordsSelectionMode;
  const selectedIds = state._recordsSelectedIds||[];
  const rows = visits.map(v=>{
    const selectable = v.hasReceipt && v.receiptStatus!=='paid';
    const isSelected = selectedIds.includes(v.id);
    const clickAction = selMode
      ? (selectable ? (()=>toggleRecordSelection(v.id)) : (()=>{}))
      : (()=>openVisitDirect(v.id, v.patientId));
    return `
    <div class="card" style="cursor:${selMode&&!selectable?'default':'pointer'};position:relative;${selMode&&!selectable?'opacity:0.5':''}${isSelected?';border-color:var(--teal);box-shadow:0 0 0 1.5px var(--teal)':''}" data-h-click="${_h((event,el)=>{ const f=clickAction; if(typeof f==='function') f(event,el); })}">
      ${selMode ? `<div style="position:absolute;top:14px;right:14px">${icon(isSelected?'check_circle':'radio_unchecked',{size:22,color:isSelected?'var(--teal)':'var(--line)',filled:isSelected})}</div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;${selMode?'padding-right:28px':''}">
        <div class="name" style="font-size:15px">${escapeHtml(v.patientName||'Unknown patient')} ${v.patientCode?`<span class="mono" style="font-size:11px;font-weight:500;color:var(--ink-soft)">${escapeHtml(v.patientCode)}</span>`:''}</div>
        <span class="mono" style="font-size:10px;color:var(--ink-soft);flex-shrink:0">${escapeHtml(v.visitCode||'')}</span>
      </div>
      <div class="meta" style="margin-bottom:8px">${fmtDate(v.date)} · ${escapeHtml(v.chiefComplaint||'No complaint noted')}</div>
      <div class="badges" style="margin-top:0">
        ${v.department? `<span class="badge">${escapeHtml(v.department)}</span>`:''}
        ${v.hasRx? `<span class="badge rx">℞ Prescription</span>`:''}
        ${v.hasReceipt? receiptStatusBadgeFromVisit(v) : ''}
        ${(v.attachments&&v.attachments.length)? `<span class="badge receipt">📎 Lab Report</span>`:''}
      </div>
    </div>`;
  }).join("");
  const hasMore = statusFilters.length===0 && !state._recordsLabReportFilter && !state._recordsSearch && state._recordsHasMore;
  return rows + (hasMore ? `<button class="btn btn-outline btn-block" style="margin-top:6px" data-h-click="${_h((event,el)=>{ loadMoreRecordsClick(el) })}">Load more visits</button>` : '')
    + (selMode ? renderRecordsSelectionBar() : '');
}
function renderRecordsSelectionBar(){
  const ids = state._recordsSelectedIds||[];
  if(ids.length===0) return '';
  const visits = state.recordsVisits.filter(v=>ids.includes(v.id));
  const total = visits.reduce((s,v)=>s+Math.max((v.receiptTotal||0)-(v.receiptAmountPaid||0),0),0);
  return `<div style="position:sticky;bottom:8px;margin-top:12px;background:var(--teal-dark);color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--el-4)">
    <div>
      <div style="font-weight:600;font-size:14px">${ids.length} selected · ₹${total} outstanding</div>
      <div style="font-size:11px;opacity:0.85">Generates one PDF listing each visit's balance</div>
    </div>
    <button class="btn btn-amber" style="flex-shrink:0" data-h-click="${_h((event,el)=>{ generatePendingReport() })}">Generate report</button>
  </div>`;
}
async function loadMoreRecordsClick(btn){ btn.textContent='Loading…'; btn.disabled=true; await loadMoreRecords(); }
async function loadRecordsPage(reset){
  if(reset){
    state.recordsVisits = [];
    state._recordsCursor = null;
    state._recordsHasMore = true;
  }
  if(!state._recordsHasMore) return;
  const from = state._recordsDateFrom, to = state._recordsDateTo;
  const constraints = recordsFilterConstraints();
  if(from) constraints.push(where('date','>=',from));
  if(to) constraints.push(where('date','<=',to));
  constraints.push(orderBy('date','desc'));
  if(state._recordsCursor) constraints.push(startAfter(state._recordsCursor));
  constraints.push(limit(RECORDS_PAGE_SIZE));
  try{
    const snap = await getDocs(query(visitsCol(), ...constraints));
    const newVisits = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.recordsVisits = reset ? newVisits : state.recordsVisits.concat(newVisits);
    state._recordsCursor = snap.docs.length ? snap.docs[snap.docs.length-1] : state._recordsCursor;
    state._recordsHasMore = snap.docs.length === RECORDS_PAGE_SIZE;
  }catch(e){
    console.error('records load failed', e);
    // A missing composite index is the one failure worth naming, because the
    // fix is a link in the console and nothing else explains an empty list.
    const needsIndex = e && (e.code === 'failed-precondition' ||
      /index/i.test(e.message||''));
    showToast(needsIndex
      ? 'This filter combination needs a database index — see the console for the one-click link'
      : 'Could not load records');
  }
  if(reset) refreshRecordsCount();
}

/* The status and attachment filters used to be applied in renderRecordsList(),
   over state.recordsVisits — that is, over whatever happened to be loaded. With
   a page size of 30, ticking "Unpaid" showed unpaid visits from the newest 30
   visits and nothing older, and the count grew as you tapped Load more.

   For a search box that is a limitation. For "which patients still owe us
   money" it is a wrong answer that looks authoritative, and the debts most
   worth chasing are the oldest ones — exactly the ones that never appeared.

   These are exact-value matches, which is what Firestore is good at, so they
   belong in the query. Both fields are stamped on the visit when a receipt is
   saved or attachments change. */
function recordsFilterConstraints(){
  const out = [];
  const statuses = state._recordsStatusFilters || [];
  if(statuses.length > 0){
    // 'in' is capped at 30 values; there are three possible statuses.
    out.push(where('receiptStatus','in', statuses.slice(0,30)));
  }
  if(state._recordsLabReportFilter){
    out.push(where('hasAttachments','==', true));
  }
  return out;
}

async function refreshRecordsCount(){
  state._recordsTotalCount = null;
  const from = state._recordsDateFrom, to = state._recordsDateTo;
  const constraints = recordsFilterConstraints();
  if(from) constraints.push(where('date','>=',from));
  if(to) constraints.push(where('date','<=',to));
  try{
    const snap = await getCountFromServer(query(visitsCol(), ...constraints));
    state._recordsTotalCount = snap.data().count;
    render();
  }catch(e){
    // A count is a nicety. If it fails the list is still correct, so this
    // stays silent rather than throwing a toast over a working screen.
    console.error('records count failed', e && e.code, e && e.message);
  }
}
async function loadMoreRecords(){
  // Keep the reader where they were — the whole list re-renders, so without
  // this "Load more" throws you back to the newest visit every time.
  rememberScroll("records");
  await loadRecordsPage(false);
  restoreScrollOnNextRender("records");
  render();
}
async function ensureRecordsSearchPool(){
  if(state._recordsSearchPool) return;
  try{
    const snap = await getDocs(query(visitsCol(), orderBy('date','desc'), limit(SEARCH_POOL_SIZE)));
    state._recordsSearchPool = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error('records search pool load failed', e); showToast('Search failed to load — ' + (e.message||'check your connection').slice(0,80)); state._recordsSearchPool = []; }
}
function invalidateRecordsSearchPool(){ state._recordsSearchPool = null; }
/* Records search used to filter a pool of the most recent SEARCH_POOL_SIZE
   visits. At 100 visits/day that pool is the last ten days; at 250/day it is
   four. A doctor looking for last month's visit got "no matches" and a label
   calling the result partial — honest, but useless at the volume this is sold
   into. It also cost 1,000 reads every time the pool loaded.

   The fix needs no new fields. Records search only ever matched on patient
   name, patient code, visit code and phone — never on diagnosis or notes,
   which firestore.indexes.json deliberately excludes from indexing. So the
   query is resolved through the PATIENT index, which 3.16.0 already made
   unbounded (nameLower range, nameTokens array-contains, exact code, exact
   phone), and then those patients' visits are fetched directly. The
   patientId+date composite index already exists for the duplicate finder.

   Cost: about 60 reads instead of 1,000, across the whole history rather than
   the last few days.

   The ceiling that remains is Firestore's 'in' limit of 30 values, so a search
   matching more than 30 DIFFERENT patients is reported as narrowed rather than
   silently clipped. A search that broad is a browse, not a lookup. */
const RECORDS_SEARCH_PATIENT_CAP = 30;
const RECORDS_SEARCH_HIT_LIMIT = 100;

async function findMatchingPatientIds(q){
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');
  const lookups = [
    getDocs(query(patientsCol(), orderBy('nameLower'),
      where('nameLower','>=',qLower), where('nameLower','<',qLower + '\uf8ff'),
      limit(SEARCH_HIT_LIMIT))),
    getDocs(query(patientsCol(), where('patientCode','==', q.toUpperCase()), limit(5)))
  ];
  if(qLower.length >= NAME_TOKEN_MIN){
    lookups.push(getDocs(query(patientsCol(),
      where('nameTokens','array-contains', qLower.slice(0, NAME_TOKEN_MAX)),
      limit(SEARCH_HIT_LIMIT))));
  }
  if(digits.length >= 5){
    lookups.push(getDocs(query(patientsCol(),
      where('phoneNormalized','==',digits), limit(5))));
  }
  const ids = [];
  const seen = new Set();
  (await Promise.allSettled(lookups)).forEach(r=>{
    if(r.status === 'fulfilled'){
      r.value.docs.forEach(d=>{
        if(seen.has(d.id)) return;
        seen.add(d.id); ids.push(d.id);
        cachePatient({id:d.id, ...d.data()});
      });
    } else console.error('records patient lookup failed', r.reason && r.reason.code);
  });
  return ids;
}

async function searchRecordsRemote(qRaw){
  const q = qRaw.trim();
  if(!q){ state._recordsSearchNarrowed = false; await loadRecordsPage(true); render(); return; }
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');
  const merged = {};
  const add = d => { merged[d.id] = {id:d.id, ...d.data()}; };

  const patientIds = await findMatchingPatientIds(q);
  state._recordsSearchNarrowed = patientIds.length > RECORDS_SEARCH_PATIENT_CAP;
  const usable = patientIds.slice(0, RECORDS_SEARCH_PATIENT_CAP);

  const lookups = [
    getDocs(query(visitsCol(), where('visitCode','==', q.toUpperCase()), limit(10)))
  ];
  if(usable.length){
    lookups.push(getDocs(query(visitsCol(),
      where('patientId','in', usable), orderBy('date','desc'),
      limit(RECORDS_SEARCH_HIT_LIMIT))));
  }
  (await Promise.allSettled(lookups)).forEach(r=>{
    if(r.status === 'fulfilled') r.value.docs.forEach(add);
    else console.error('records visit lookup failed', r.reason && r.reason.code);
  });

  // Small clinics keep the mid-word matching the indexes can't express —
  // "erma" finding Verma. Gated on clinic size for the same reason patient
  // search gates it: on a large clinic the pool is both expensive and a
  // misleading slice of history.
  if(poolIsWorthLoading()){
    await ensureRecordsSearchPool();
    (state._recordsSearchPool||[]).forEach(v=>{
      const nameHay = v.patientNameLower || (v.patientName||'').toLowerCase();
      const codeHay = (v.patientCode||'').toLowerCase();
      const visitHay = (v.visitCode||'').toLowerCase();
      const phoneHay = v.patientPhone||'';
      if(nameHay.includes(qLower) || codeHay.includes(qLower) || visitHay.includes(qLower)
         || (digits.length>=3 && phoneHay.includes(digits))) add({id:v.id, data:()=>v});
    });
  }

  state.recordsVisits = Object.values(merged)
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  state._recordsHasMore = false;
  render();
}
function onRecordsSearch(v){
  state._recordsSearch = v;
  if(v.trim()){ state._recordsDateFrom=""; state._recordsDateTo=""; }
  clearTimeout(window._recordsSearchDebounce);
  window._recordsSearchDebounce = setTimeout(()=>{ searchRecordsRemote(v); }, 300);
}
function setRecordsDateFrom(v){ state._recordsDateFrom = v; loadRecordsPage(true).then(render); }
function setRecordsDateTo(v){ state._recordsDateTo = v; loadRecordsPage(true).then(render); }
function toggleRecordsFilters(){ state._recordsFiltersOpen = !state._recordsFiltersOpen; render(); }
function clearRecordsFilters(){ state._recordsSearch=""; state._recordsDateFrom=""; state._recordsDateTo=""; state._recordsStatusFilters=[]; state._recordsLabReportFilter=false; loadRecordsPage(true).then(render); }

/* ---- AI Assistant (Gemini) ---- */
const AI_SYSTEM_PROMPT = `You are a clinical decision-support assistant helping a licensed doctor review their own patient's records inside their clinic's private records app. You are NOT diagnosing a patient and your output is NOT a prescription — you are a second pair of eyes for the doctor's own judgment.
Rules you must follow:
- Be concise and clinically literal. Use plain language a doctor can scan quickly.
- When asked to summarize, note patterns across visits (recurring complaints, possible chronic conditions) based only on what's in the records given to you.
- When asked about possible diagnoses or medications, give general, textbook-level possibilities and common medication classes (not exact doses) framed as "considerations to evaluate," never as a final answer. Always state that the doctor must confirm with their own clinical judgment, exam, and any necessary tests.
- The patient record given to you includes, per visit, whether lab report attachments exist and that visit's billing status (total/paid/balance). Actual attachment images may also be included directly in the message — when they are, read them and describe/use their real contents (test names, values, findings) rather than saying you can't see them. If asked about a specific visit's report, look for the "[Attachment: Visit ...]" label matching that visit.
- Never invent facts not present in the given patient history or images — if information is missing, say so.
- Keep responses under ~200 words unless the doctor asks for more detail.`;

// Google deprecates/rotates free-tier model names fairly often, sometimes
// earlier than their own announced dates. Rather than hardcode one name
// that can break again, try a short list of current candidates in order
// and fall back automatically if one isn't available for this key/region.
const GEMINI_MODEL_CANDIDATES = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-3.1-flash-lite'];

async function callGeminiAPI(history){
  const key = state.settings.geminiApiKey;
  if(!key) throw new Error('NO_KEY');
  /* The consent check lives HERE, at the point data leaves the clinic, and
     not only on the screen that collects it. A UI-only gate is one stale
     render or one new caller away from sending a patient's record to a third
     party, and that failure would be silent. */
  if(!state.settings.aiConsentAt) throw new Error('NO_CONSENT');
  const contents = history.map(m=>{
    const parts = [{text:m.text}];
    (m.images||[]).forEach(img=>{
      parts.push({text:`[Attachment: ${img.label}]`});
      parts.push({inlineData:{mimeType:img.mimeType, data:img.data}});
    });
    return {role: m.role==='user'?'user':'model', parts};
  });
  const sleep = ms => new Promise(r=>setTimeout(r, ms));
  let lastErr;
  for(const model of GEMINI_MODEL_CANDIDATES){
    // Google's free-tier models occasionally return 503 (server overloaded)
    // for reasons unrelated to the request itself — one short automatic
    // retry clears most of these without bothering the person.
    for(let attempt=0; attempt<2; attempt++){
      let res;
      try{
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method:'POST',
          headers:{'Content-Type':'application/json','x-goog-api-key':key},
          body: JSON.stringify({
            systemInstruction:{parts:[{text:AI_SYSTEM_PROMPT}]},
            contents
          })
        });
      }catch(networkErr){
        throw new Error(`NETWORK_ERROR: ${networkErr.message}`);
      }
      if(res.status===503 && attempt===0){
        await sleep(1500);
        continue; // one retry on the same model before giving up on it
      }
      if(res.status===404){
        lastErr = new Error(`API_ERROR: 404 model "${model}" not available for this key`);
        break; // try the next candidate model
      }
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        lastErr = new Error(`API_ERROR: ${res.status} ${errText.slice(0,200)}`);
        if(res.status===503) break; // exhausted retry — try next model candidate
        throw lastErr;
      }
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
      if(!text) throw new Error('EMPTY_RESPONSE');
      return text;
    }
  }
  throw lastErr || new Error('ALL_MODELS_UNAVAILABLE');
}
// Extracts the mimeType + raw base64 payload from a data: URL so it can be
// sent to Gemini as inline image data (separate from the "data:...;base64,"
// wrapper the browser needs but the API doesn't want).
function parseDataUrl(dataUrl){
  const match = /^data:([^;]+);base64,(.*)$/.exec(dataUrl||'');
  if(!match) return null;
  return {mimeType: match[1], data: match[2]};
}
// Gathers this patient's actual lab report photos (most recent visits
// first) so the AI can visually read them, not just know they exist.
// Capped to keep each request a reasonable size/cost.
function collectPatientAttachmentImages(maxImages){
  const images = [];
  const sortedVisits = state.visits.slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const v of sortedVisits){
    if(images.length>=maxImages) break;
    (v.attachments||[]).forEach(a=>{
      if(images.length>=maxImages) return;
      const parsed = parseDataUrl(a.dataUrl);
      if(parsed) images.push({...parsed, label:`Visit ${v.visitCode||v.id} (${fmtDate(v.date)})`});
    });
  }
  return images;
}
function buildPatientContext(p){
  if(!p) return null;
  const visits = visitsForPatient(p.id);
  let totalOutstanding = 0;
  const lines = visits.map(v=>{
    const rx = rxForVisit(v.id);
    const rc = receiptForVisit(v.id);
    const meds = rx && rx.medicines.length ? rx.medicines.map(m=>`${m.name} (${m.dosage||'—'}, ${m.frequency||'—'}, ${m.duration||'—'})`).join('; ') : 'none recorded';
    const vit = v.vitals||{};
    const attachInfo = (v.attachments && v.attachments.length) ? `${v.attachments.length} lab report/attachment(s) on file` : 'no attachments';
    let billingInfo = 'no receipt recorded for this visit';
    if(rc){
      const paid = getReceiptAmountPaid(rc);
      const status = getReceiptStatus(rc);
      const balance = Math.max(rc.total - paid, 0);
      totalOutstanding += balance;
      billingInfo = `Total Rs.${rc.total}, Paid Rs.${paid}, Balance Rs.${balance}, Status: ${status.toUpperCase()}`;
    }
    return `- ${fmtDate(v.date)} [Visit ${v.visitCode||v.id}] — complaint: ${v.chiefComplaint||'—'}; diagnosis: ${v.diagnosis||'—'}; notes: ${v.notes||'—'}; vitals: BP ${vit.bp||'—'}, Temp ${vit.temp||'—'}, Pulse ${vit.pulse||'—'}, Weight ${vit.weight||'—'}; medicines prescribed: ${meds}; attachments: ${attachInfo}; billing: ${billingInfo}`;
  }).join('\n');
  const billingSummary = totalOutstanding>0
    ? `Total outstanding balance across all visits: Rs.${totalOutstanding}.`
    : (visits.some(v=>receiptForVisit(v.id)) ? 'All recorded receipts for this patient are fully paid — no outstanding balance.' : 'No receipts recorded for this patient yet.');
  /* The patient's NAME is deliberately not sent. It was, until 3.21.0, along
     with the whole identified record — but the assistant is summarising
     clinical patterns and never needed a name to do it. Sending the patient
     code instead means what leaves the clinic is a medical history that
     cannot be tied to a person without the clinic's own database. The
     doctor already knows who they selected. */
  return `PATIENT RECORD (from clinic database — treat as ground truth, do not assume anything beyond this):
Patient reference: ${p.patientCode||p.id} (name withheld — refer to them as "the patient") | Age: ${displayAge(p)} | Gender: ${p.gender||'—'} | Marital status: ${p.maritalStatus||'—'} | Occupation: ${p.occupation||'—'} | Blood group: ${p.bloodGroup||'—'} | Known allergies: ${p.allergies||'none noted'}
Billing summary: ${billingSummary}
Visit history, most recent first (${visits.length} total) — each line includes whether that visit has lab report attachments and its billing status:
${lines || 'No visits recorded yet.'}`;
}

// Fetches a patient's visits/prescriptions on demand for AI context when
// they weren't opened via the normal patient-detail screen first.
async function ensurePatientRecordsLoaded(id){

function describeAIError(e){
  if(e.message==='NO_KEY') return "No AI key set up yet — add one in Settings → AI Assistant.";
  const msg = e.message || String(e);
  if(msg.startsWith('NETWORK_ERROR')) return "Couldn't reach the AI service — check your internet connection and try again.\n\nDetails: " + msg;
  if(msg==='ALL_MODELS_UNAVAILABLE' || msg.includes('API_ERROR: 404')) return "None of the current AI models are available for this key. Try generating a fresh key at aistudio.google.com/apikey — Google rotates model availability fairly often.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 400')) return "The AI service rejected the request (likely an invalid or malformed API key). Double-check the key in Settings.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 403')) return "The AI service refused this key (permission denied — it may be restricted or disabled). Try generating a new key at aistudio.google.com/apikey.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 429')) return "Free tier limit reached for the moment — wait a minute and try again.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 503')) return "Google's AI servers are overloaded right now (not an issue with your setup) — this already retried automatically and still failed. Wait a minute and try again.\n\nDetails: " + msg;
  return "Sorry, that request failed.\n\nDetails: " + msg;
}
async function sendAIMessage(){
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if(!text || state._aiLoading) return;
  state._aiChat = state._aiChat || [];
  state._aiChat.push({role:'user', text});
  input.value = '';
  state._aiLoading = true;
  document.getElementById('aiChatLog').innerHTML = renderAIChatLog();
  try{
    const p = state._aiPatientId ? getPatient(state._aiPatientId) : null;
    const ctx = buildPatientContext(p);
    const history = [];
    if(ctx){
      const images = collectPatientAttachmentImages(10);
      const imageNote = images.length ? `\n\n${images.length} lab report attachment image(s) from this patient's visits are included below — read them directly and describe/answer questions about their actual contents.` : '';
      history.push(
        {role:'user', text: ctx + imageNote + "\n\n(Acknowledge briefly that you have this patient's record, then wait for my question.)", images},
        {role:'model', text:`Got it — I have ${p.name}'s visit history${images.length? ` and ${images.length} attached lab report image(s)`:''}. What would you like to know?`}
      );
    }
    history.push(...state._aiChat);
    const reply = await callGeminiAPI(history);
    state._aiChat.push({role:'model', text:reply});
  }catch(e){
    state._aiChat.push({role:'model', text: describeAIError(e)});
    console.error('AI chat error', e);
  }
  state._aiLoading = false;
  document.getElementById('aiChatLog').innerHTML = renderAIChatLog();
}

/* AI patient-summary button (Patient Detail) */
async function runAIPatientSummary(patientId){
  openModal('ai-summary', {patientId});
  const p = getPatient(patientId);
  if(!p){ showToast('Patient record not loaded — reopen their chart and try again'); return; }
  const resultEl = ()=>document.getElementById('aiSummaryResult');
  try{
    const ctx = buildPatientContext(p);
    const images = collectPatientAttachmentImages(6);
    const imageNote = images.length ? `\n\n${images.length} lab report attachment image(s) are included below — factor their actual contents into the summary if relevant.` : '';
    const prompt = `${ctx}${imageNote}\n\nTask: In plain language, (1) summarize this patient's history, (2) flag any chronic or recurring conditions the pattern suggests, (3) list general medication classes commonly considered for those conditions for the doctor to review — not specific doses. Keep it under 180 words.`;
    const reply = await callGeminiAPI([{role:'user', text:prompt, images}]);
    if(resultEl()) resultEl().innerHTML = mdToHtml(reply);
  }catch(e){
    if(resultEl()) resultEl().innerHTML = escapeHtml(describeAIError(e)).replace(/\n/g,'<br>');
    console.error('AI summary error', e);
  }
}

/* ---- WhatsApp sharing ---- */
function findRxRecord(rxId){ return state.prescriptions.find(r=>r.id===rxId); }
function findReceiptRecord(id){ return state.receipts.find(r=>r.id===id); }
async function resolvePatientForRecord(rec){
  let p = getPatient(rec.patientId);
  if(!p) p = await fetchPatientDirect(rec.patientId);
  if(!p) p = {name:rec.patientName||'Unknown patient', patientCode:rec.patientCode||'', phone:rec.patientPhone||''};
  return p;
}
async function shareOnWhatsApp(type, id){
  const rec = type==='rx' ? findRxRecord(id) : findReceiptRecord(id);
  if(!rec){ showToast('Record not found'); return; }
  const p = await resolvePatientForRecord(rec);
  const label = type==='rx' ? 'prescription' : 'receipt';
  const clinic = state.settings.clinicName || 'the clinic';
  const filename = type==='rx'
    ? `Prescription_${(p.name||'patient').replace(/\s+/g,'_')}_${rec.date}.pdf`
    : `Receipt_${(p.name||'patient').replace(/\s+/g,'_')}_${rec.date}.pdf`;
  const doc = type==='rx' ? buildPrescriptionDoc(rec, p) : buildReceiptDoc(rec, p);
  const blob = doc.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  const shareText = `Sharing your ${label} from ${clinic}.`;

  // Best path: native share sheet with the PDF already attached — the person
  // picks WhatsApp (or anything else) and the file is there, no manual step.
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename, text:shareText});
      return;
    }catch(err){
      if(err && err.name==='AbortError') return; // they backed out of the share sheet — don't fall back
    }
  }
  // Fallback (mostly desktop browsers, which can't attach files to WhatsApp
  // Web via a link — that's a WhatsApp platform limit, not something a
  // website can work around): open the chat and download the PDF so it's
  // one tap to attach manually.
  const digits = normalizePhone(p.phone).replace(/\D/g,'');
  const msg = encodeURIComponent(`${shareText} The PDF just downloaded to this device — please attach it here.`);
  if(digits) window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
  else showToast('No phone number on file for this patient');
  doc.save(filename);
}

/* Consent is recorded with who accepted it and when, because "the clinic
   agreed" is not an answer to a patient asking who decided. Only a doctor
   can accept: a receptionist cannot sign the clinic up to disclose clinical
   records to a third party. */
function acceptAIConsent(){
  if(!isDoctor()){ showToast('Only a doctor can turn on the AI assistant'); return; }
  const key = (document.getElementById('s_geminiKey')||{}).value || '';
  if(!key.trim()){ showToast('Paste your Gemini API key first'); return; }
  state.settings.geminiApiKey = key.trim();
  state.settings.aiConsentAt = new Date().toISOString();
  state.settings.aiConsentBy = (currentUser && currentUser.email) || 'a doctor';
  saveSettingsDoc(); render();
  showToast('AI assistant turned on');
}
function turnOffAI(){
  if(!isDoctor()){ showToast('Only a doctor can change this'); return; }
  // Withdrawing clears the key as well as the consent. Leaving a working key
  // behind an un-ticked flag is the kind of state that quietly comes back on.
  state.settings.geminiApiKey = '';
  state.settings.aiConsentAt = '';
  state.settings.aiConsentBy = '';
  saveSettingsDoc(); render();
  showToast('AI assistant turned off — key removed');
}
function publicConfigRef(){ return doc(db, 'clinics', state.clinicId, 'publicConfig', 'booking'); }

async function loadBookingConfig(){

    state.bookingConfig = snap.exists() ? snap.data() : null;
  }catch(e){ console.error('loadBookingConfig failed', e && e.code); state.bookingConfig = null; }

async function saveBookingConfig(){
  if(!isDoctor()){ showToast('Only a doctor can change booking settings'); return; }
  const v = id => (document.getElementById(id)||{}).value || '';
  const cfg = {
    clinicName: v('bk_name').trim().slice(0,120),
    address: v('bk_addr').trim().slice(0,200),
    slotStart: v('bk_start') || '09:00',
    slotEnd: v('bk_end') || '17:00',
    slotMinutes: Math.max(5, Math.min(120, parseInt(v('bk_step'),10) || 30)),
    fee: Math.max(0, parseInt(v('bk_fee'),10) || 0),
    upiId: v('bk_upi').trim().slice(0,60),
    upiName: v('bk_upiname').trim().slice(0,80),
    active: (document.getElementById('bk_active')||{}).checked !== false,
    holidays: (state.bookingConfig && state.bookingConfig.holidays) || [],
    halfDays: (state.bookingConfig && state.bookingConfig.halfDays) || [],
    updatedAt: new Date().toISOString()
  };
  /* Everything in this document is world-readable — book.html fetches it with
     no login. Nothing secret may go in it, which is the entire reason it is a
     separate document from clinics/{id}, where geminiApiKey lives. The field
     list above is explicit rather than a spread of some settings object so a
     future key added to settings cannot ride along into public view. */
  try{
    await withTimeout(setDoc(publicConfigRef(), cfg), 15000, 'save booking config');
    state.bookingConfig = cfg;
    showToast('Booking settings saved');
    render();
  }catch(e){
    console.error('saveBookingConfig failed', e && e.code);
    showToast('Could not save — check your connection');
  }
}

async function addBookingHoliday(){
  const d = (document.getElementById('bk_holdate')||{}).value || '';
  const r = (document.getElementById('bk_holreason')||{}).value || '';
  if(!d){ showToast('Pick a date first'); return; }
  const cur = (state.bookingConfig && state.bookingConfig.holidays) || [];
  if(cur.some(h=>h.date===d)){ showToast('That date is already a holiday'); return; }
  const next = cur.concat([{date:d, reason:String(r).trim().slice(0,60)}])
                  .sort((a,b)=>a.date.localeCompare(b.date));
  await updateBookingList('holidays', next);
}
