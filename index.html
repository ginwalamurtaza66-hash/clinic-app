<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- Content Security Policy.
     script-src has NO 'unsafe-inline': every handler is a registered closure
     (see _h/_hReset), so injected markup cannot execute even if it reaches
     the DOM — this is now a real structural defence, not just defence in
     depth. style-src keeps 'unsafe-inline' for inline style="" attributes,
     which cannot execute script.
     frame-ancestors is omitted here because browsers ignore it in a <meta>
     tag — it is sent as a real header via firebase.json instead. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'sha256-0iGjpzLPRd3LKavmSIZDUSSyi9avLCHgT3ec5u/n2xA=' https://www.gstatic.com;
  style-src 'self' 'unsafe-inline';
  font-src 'self' data:;
  img-src 'self' data: blob:;
  connect-src 'self' https://*.googleapis.com https://www.gstatic.com;
  worker-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Clinic Chart</title>
<!-- BUILD_MARKER: v2026-08-06-pwa-install-fix -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFEAE0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141F1C">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clinic Chart">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="./vendor/fonts.css?v=1" rel="stylesheet">
<!-- Vendored, not CDN-loaded. These three libraries used to be loaded from the
     cdnjs origin with no Subresource Integrity, on a CSP that allowed that whole
     origin — so anything served from there would have executed with full access
     to the page and to Firestore. Serving our own copies removes the third-party
     origin from script-src entirely, which is strictly stronger than an SRI
     hash, and it also fixes a second bug: the service worker only ever cached
     same-origin files, so PDF export, charts and the QR code silently failed
     offline. They are same-origin now, so they precache.
     To update one: replace the file, bump the ?v= query, re-run
     stamp_csp_hash.py, and bump CACHE_NAME in sw.js.
     Note: no literal script/img source attribute is written anywhere in this
     comment on purpose — invariant 5, Chrome's preload scanner reads raw bytes
     and will happily fetch a URL it finds inside a comment. -->
<script src="vendor/jspdf.umd.min.js?v=4.2.1"></script>
<script src="vendor/chart.umd.min.js?v=4.5.1"></script>
<script src="vendor/qrcode.min.js?v=1.0.0"></script>
<script src="vendor/jsQR.min.js?v=1.4.0"></script>
<style>
  :root{
    /* Paper: the original --bg (#F3F5F2, cool sage) warmed toward ledger
       paper. This is an evolution of the existing identity, not a swap to
       a generic cream — it still reads as a sibling of the old background,
       just warmer. */
    --bg:#EFEAE0;
    /* Card was pure white against the new warm paper background — stood out
       starkly rather than sitting in the same "material" as everything
       else. Warmed to sit closer to paper, the way a clean sheet of paper
       in a folder still reads as paper, not a blue-white screen glow. */
    --card:#FBF8EF;
    --ink:#152B2B;
    --ink-soft:#5C6E6C;
    --line:#E0E6E2;
    /* Ledger hairline: a warmer, more visible rule than --line, used only in
       the new ledger-row and timeline treatments so nothing already relying
       on --line anywhere else in the app is affected. */
    --rule:#DDD0AC;
    --teal:#2F6F6B;
    --teal-dark:#1E4A47;
    --teal-tint:#E6EEEC;
    --amber:#E8A33D;
    /* Deepened from #FBF0DC — that pale a cream sat almost exactly on top
       of the new paper --bg in lightness, so every "Partial"/pending/warning
       chip built on it lost its edge against the page. This value keeps the
       same warm-gold hue but with enough depth to read as its own surface. */
    --amber-tint:#F3DFAE;
    /* Text colour used on top of --amber-tint. Was 11 scattered hardcoded
       hex values (#7A4E0B and #8A5A0F both in use) — collapsed to one
       token so dark mode has a single place to adjust it. */
    --amber-ink:#7A4E0B;
    --danger:#C1443C;
    --danger-tint:#FBE9E7;
    /* Tincture: the colour of an amber homeopathic mother-tincture bottle —
       chosen deliberately over a clay/terracotta accent, which reads too
       close to a generic AI-default palette. Used for stamped chips, the
       seal FAB, and the small botanical accent mark. */
    --tincture:#9C6B2E;
    --tincture-tint:#F1E4CC;
    /* Analytics pivot tables (department subtotal columns, grand-total
       corner) used three hardcoded hex values left over from before any of
       this redesign started — never touched, and invisible to dark mode.
       Collapsed to one token for the emphasis tier above --teal-tint. */
    --teal-tint-deep:#D2E5E1;
    --radius:16px;
    --shadow: 0 1px 2px rgba(21,43,43,0.06), 0 4px 14px rgba(21,43,43,0.05);
    /* Material-style layered elevation: each level adds a soft ambient
       shadow plus a tighter, darker key-light shadow — closer to how
       Material 3 actually renders depth than a single flat box-shadow. */
    --el-1: 0 1px 2px rgba(21,43,43,0.08), 0 1px 3px 1px rgba(21,43,43,0.06);
    --el-2: 0 1px 2px rgba(21,43,43,0.09), 0 2px 6px 2px rgba(21,43,43,0.07);
    --el-3: 0 1px 3px rgba(21,43,43,0.10), 0 4px 8px 3px rgba(21,43,43,0.08);
    --el-4: 0 2px 3px rgba(21,43,43,0.12), 0 6px 10px 4px rgba(21,43,43,0.10);
  }

*{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* .ico: inline SVG icons (see the ICON SYSTEM comment in the script below).
     Replaced the old .msi Material Symbols ligature-font rule — icons are
     now self-contained vector markup with no webfont dependency. */
  .ico{display:inline-block; vertical-align:middle; flex-shrink:0;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
  .app-shell{display:flex; flex-direction:column; min-height:100vh;}
  .app-content{display:flex; flex-direction:column; flex:1; min-width:0; order:1;}

  /* Top bar */
  .topbar{
    padding:18px 18px 14px;
    background:var(--bg);
    color:var(--ink);
    border-bottom:1px solid var(--rule);
    position:sticky; top:0; z-index:20;
  }
  .topbar .clinic-name{font-family:'Fraunces',serif; font-weight:600; font-size:21px; letter-spacing:0.1px; color:var(--ink);}
  .topbar .doctor-name{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .topbar-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .icon-btn{
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    width:38px;height:38px; display:flex;align-items:center;justify-content:center;
    color:var(--teal-dark); font-size:16px; transition:background 0.15s ease, transform 0.1s ease;
    box-shadow:var(--el-1);
  }
  .icon-btn:active{transform:scale(0.92);}
  .search-wrap{margin-top:12px;}
  .search-wrap input{
    width:100%; border:1px solid var(--rule); border-radius:12px; padding:10px 12px;
    font-size:14px; background:var(--card); color:var(--ink); box-shadow:var(--el-1);
  }
  .search-wrap input::placeholder{color:var(--ink-soft);}

  main{flex:1; padding:14px 14px 90px; overflow-y:auto;}

  /* Cards */
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--el-1);
    padding:14px; margin-bottom:10px; border:1px solid var(--line);
    transition:box-shadow 0.18s ease, transform 0.1s ease;
  }
  .patient-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .patient-card .name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px;}
  .patient-card .meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .chev{color:var(--ink-soft); font-size:18px;}
  a.card, div.card[data-h-click]{cursor:pointer;}
  div.card[data-h-click]:active{transform:scale(0.97); box-shadow:var(--el-1);}
  /* Bounce: a small overshoot on release feels more tactile than a linear
     ease, and it's transform-only — no layout/paint cost, so it's exactly
     as cheap as the flat scale it replaces. */
  .card, .tile, .btn, .fab, .icon-btn, .edit-link{
    transition:transform 0.16s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s ease;
  }

  /* ---- Three-tile action grid (Family / Vitals trend / ID card) ---- */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .tile{background:var(--card); border:none; border-radius:var(--radius); box-shadow:var(--el-1); padding:14px 6px 11px; text-align:center; cursor:pointer;}
  .tile:active{transform:scale(0.95);}
  .tile .tico{color:var(--teal-dark); margin-bottom:6px;}
  .tile .tl{font-size:10.5px; font-weight:600; color:var(--ink); letter-spacing:0.01em;}

  /* ---- Ledger rows: label-left/value-right with a hairline between,
     replacing a grid of stat-cards on the patient chart. ---- */
  .ledger{background:var(--card); border-radius:var(--radius); box-shadow:var(--el-1); overflow:hidden; margin-bottom:14px;}
  .ledger-row{display:flex; justify-content:space-between; align-items:baseline; padding:10px 14px; border-bottom:1px solid var(--line); gap:10px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .lg-lbl{font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap;}
  .ledger-row .lg-val{font-size:13.5px; text-align:right;}
  .ledger-row .lg-val a{color:var(--teal-dark); text-decoration:none;}
  .ledger-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .stamp-tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.04em; border:1px solid var(--teal); color:var(--teal-dark); padding:3px 8px; border-radius:3px; background:rgba(47,111,107,.06); display:inline-block;}
  .edit-link{background:none; border:none; font:inherit; font-size:12px; font-weight:600; color:var(--teal-dark); cursor:pointer; display:flex; align-items:center; gap:4px; padding:4px 0;}
  .leaf-mark{width:13px; height:13px; stroke:var(--teal); fill:var(--teal-tint); stroke-width:1.3; flex-shrink:0; vertical-align:-2px;}

  /* ---- Case-history timeline: replaces a flat list of visit cards with a
     dated left margin and a connecting rule, per the reviewed mockup. ---- */
  .timeline{position:relative; margin-bottom:6px;}
  .timeline::before{content:''; position:absolute; left:46px; top:6px; bottom:6px; width:1px; background:var(--rule);}
  .tl-entry{display:flex; gap:12px; padding:10px 0; position:relative; cursor:pointer;}
  .tl-entry .tl-when{width:46px; flex-shrink:0; text-align:right; padding-right:12px; position:relative;}
  .tl-entry .tl-when .tl-d{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; color:var(--ink); line-height:1;}
  .tl-entry .tl-when .tl-m{font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; margin-top:2px;}
  .tl-entry .tl-dot{position:absolute; right:-3.5px; top:4px; width:7px; height:7px; border-radius:50%; background:var(--teal); border:2px solid var(--bg);}
  .tl-entry .tl-body{flex:1; background:var(--card); border-radius:12px; box-shadow:var(--el-1); padding:11px 13px;}
  .tl-entry .tl-cc{font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; color:var(--ink); margin:0 0 3px; line-height:1.3;}
  .tl-entry .tl-code{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-soft);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .eb{font-size:34px; margin-bottom:10px;}
  .empty-state h3{margin:0 0 6px; color:var(--ink); font-size:17px;}
  .empty-state p{font-size:13.5px; margin:0;}

  /* Skeleton loading placeholders */
  @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
  .skel{
    background:linear-gradient(90deg, var(--line) 25%, #EDF1EE 37%, var(--line) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite;
    border-radius:8px;
  }
  .skel-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--el-1); padding:14px; margin-bottom:10px; border:1px solid var(--line);}
  .skel-line{height:12px; margin-bottom:8px;}
  .skel-line.w60{width:60%;}
  .skel-line.w40{width:40%;}
  .skel-line.w80{width:80%;}
  .skel-line:last-child{margin-bottom:0;}

  /* Vitals strip (signature element) */
  .chart-tab{
    display:flex; background:var(--card); border-radius:var(--radius);
    border:1px solid var(--line); box-shadow:var(--el-1); overflow:hidden; margin-bottom:14px;
  }
  .chart-tab .seg{flex:1; padding:11px 8px; text-align:center; border-right:1px solid var(--line); position:relative;}
  .chart-tab .seg:last-child{border-right:none;}
  .chart-tab .seg::after{
    content:""; position:absolute; bottom:0; left:20%; right:20%; height:3px;
    background:var(--amber); border-radius:3px 3px 0 0;
  }
  .chart-tab .seg .v{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .chart-tab .seg .l{font-size:10px; letter-spacing:0.4px; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft);
    font-weight:600; margin:18px 0 8px 2px;
  }
  .section-label:first-child{margin-top:2px;}

  .visit-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .visit-row .date{font-weight:600; font-size:14px;}
  .visit-row .cc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .badges{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .badge{
    font-size:11px; padding:3px 9px; border-radius:100px; font-weight:600; border:1px solid transparent;
  }
  .badge.rx{background:var(--teal-tint); color:var(--teal-dark); border-color:var(--teal);}
  .badge.receipt{background:var(--amber-tint); color:var(--amber-ink); border-color:var(--tincture);}

  /* ---- Analytics pivot tables: date-locked, header-locked, totals-locked,
     scrolling only sideways. See CHANGELOG for why this replaced nested
     divs — a flat grid is what you can actually reconcile a cash box
     against. ---- */
  .achip{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .achip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
  .achip:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .pivotcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--el-1);margin-bottom:12px;overflow:hidden;}
  .pivothead{padding:14px 14px 10px;}
  .pivothead h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0;}
  .pivothead .cap{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .pv-scroller{overflow:auto;max-height:360px;-webkit-overflow-scrolling:touch;}
  .pv-scroller table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
  .pv-scroller th,.pv-scroller td{font-size:12.5px;white-space:nowrap;padding:8px 9px;background:var(--card);}
  .pv-scroller thead th{position:sticky;top:0;z-index:3;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);text-align:right;}
  .pv-scroller thead tr.r2 th{top:29px;}
  .pv-scroller th.grp{text-align:center;color:var(--teal-dark);background:var(--teal-tint);border-bottom:1px solid var(--line);}
  .pv-scroller th.sub{font-size:9.5px;}
  .pv-scroller th.deptsub{color:var(--teal-dark);font-weight:800;}
  .pv-scroller .edge{border-right:2px solid var(--line);}
  .pv-scroller th.rowhead,.pv-scroller td.rowhead{position:sticky;left:0;z-index:2;text-align:left;font-weight:600;min-width:82px;box-shadow:1px 0 0 var(--line),6px 0 8px -6px rgba(21,43,43,.16);}
  .pv-scroller thead th.rowhead{z-index:4;}
  .pv-scroller td{text-align:right;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .pv-scroller td.rowhead{font-family:'Inter',sans-serif;font-variant-numeric:normal;}
  .pv-scroller td.zero{color:#B6C2BE;}
  .pv-scroller td.deptcol{background:var(--teal-tint);font-weight:700;color:var(--teal-dark);}
  .pv-scroller th.total,.pv-scroller td.total{background:var(--teal-tint);color:var(--teal-dark);font-weight:600;}
  .pv-scroller tfoot td{position:sticky;bottom:0;z-index:3;background:var(--teal-tint);color:var(--teal-dark);font-weight:700;box-shadow:0 -1px 0 var(--line);}
  .pv-scroller tfoot td.deptcol{background:var(--teal-tint-deep);}
  .pv-scroller tfoot td.rowhead{z-index:4;box-shadow:1px 0 0 var(--line),6px 0 8px -6px rgba(21,43,43,.16),0 -1px 0 var(--line);}
  .pv-scroller tfoot td.grand{background:var(--teal-tint-deep);}
  .pv-hint{font-size:10.5px;color:var(--ink-soft);padding:8px 14px 12px;}
  .stackchart{display:flex;align-items:flex-end;gap:14px;height:190px;padding:6px 2px 0;}
  .stackchart .barcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;}
  .stackchart .barval{font-size:10.5px;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);margin-bottom:4px;}
  .stackchart .bartrack{flex:1;width:100%;display:flex;align-items:flex-end;}
  .stackchart .bar{width:100%;border-radius:7px;overflow:hidden;display:flex;flex-direction:column-reverse;min-height:4px;}
  .stackchart .seg{width:100%;}
  .stackchart .barlabel{font-size:11px;color:var(--ink-soft);margin-top:6px;font-weight:600;}
  .chartlegend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
  .chartlegend .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);}
  .chartlegend .lg i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  /* Buttons */
  .btn{
    border:none; border-radius:100px; padding:11px 18px; font-size:14px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--teal); color:#fff; box-shadow:var(--el-1);}
  .btn-primary:active{box-shadow:none; filter:brightness(0.94);}
  .btn-secondary{background:var(--teal-tint); color:var(--teal-dark); border:1px solid var(--teal);}
  .btn-amber{background:var(--amber); color:#3D2B05; box-shadow:var(--el-1);}
  .btn-outline{background:var(--card); color:var(--ink); border:1px solid var(--rule);}
  .btn-whatsapp{background:var(--card); color:#1A9E4E; border:1px solid #25D366;}
  /* Compact three-across row: Edit / Download / Share on a receipt or
     prescription. Smaller than the standard .btn-row so three fit on one
     line without wrapping on a narrow phone. */
  .btn-row-3{display:flex; gap:8px; margin-top:10px;}
  .btn-row-3 .btn{flex:1; padding:9px 4px; font-size:12px; gap:4px;}
  .btn-row-3 .btn svg{width:14px; height:14px; flex-shrink:0;}
  .btn-danger{background:var(--danger-tint); color:var(--danger);}
  .btn-block{width:100%;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row .btn{flex:1;}

  .fab{
    position:fixed; bottom:86px; right:20px;
    background:radial-gradient(circle at 32% 28%, #B27F3E, var(--tincture) 60%, #7C531F 100%);
    color:#fff; border:1.5px solid rgba(255,255,255,0.35); width:56px; height:56px; border-radius:50%;
    font-size:26px; box-shadow:0 3px 4px rgba(21,43,43,.18), 0 6px 14px rgba(156,107,46,.35); z-index:25;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.12s ease, box-shadow 0.15s ease;
  }
  .fab:active{transform:scale(0.92); box-shadow:var(--el-2);}

  /* ---------------- LIQUID GLASS SYSTEM ---------------- */
  /* Three intensities, toggled via a class on <body> (see Settings ->
     Appearance). Falls back to solid surfaces automatically wherever
     backdrop-filter isn't supported, so it never breaks on older devices —
     it just quietly renders as a normal solid nav/sheet instead.
     The glass tint itself is the warm --card tone (251,248,239), not pure
     white — glass built on white looked like a leftover Material surface
     sitting on top of the new paper background instead of a part of it. */
  body.glass-subtle{
    --glass-blur:18px; --nav-glass-bg:rgba(251,248,239,0.78); --sheet-glass-bg:rgba(251,248,239,0.90);
    --overlay-glass-bg:rgba(21,43,43,0.38);
  }
  body.glass-strong{

  /* ---------------- DESKTOP / WIDE SCREENS ---------------- */

  /* ---------------- DARK MODE ----------------
     Not an inversion of the light palette — a proper dark surface design.
     Backgrounds are elevated dark neutrals (never pure black), text is warm
     off-white (never pure white), and every accent hue is brightened from
     its light-mode value because a colour that reads clearly on pale paper
     usually reads muddy on a dark surface at the same saturation/lightness.

  @media (prefers-color-scheme: dark){

      --tincture-tint:#332615;

      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);

      --el-2: 0 1px 2px rgba(0,0,0,0.42), 0 2px 6px 2px rgba(0,0,0,0.32);

       --card — this was the exact bug found earlier when the light palette
       first shipped ("modals still white"). Fixed here from day one instead
       of being discovered the same way twice. */
    body.glass-subtle{ --nav-glass-bg:rgba(28,42,38,0.80); --sheet-glass-bg:rgba(28,42,38,0.90); --overlay-glass-bg:rgba(0,0,0,0.55); }
    body.glass-strong{ --nav-glass-bg:rgba(28,42,38,0.62); --sheet-glass-bg:rgba(28,42,38,0.78); --overlay-glass-bg:rgba(0,0,0,0.45); }
    body.glass-off, body:not(.glass-subtle):not(.glass-strong){ --nav-glass-bg:#1C2A26; --sheet-glass-bg:#1C2A26; --overlay-glass-bg:rgba(0,0,0,0.6); }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      body{ --nav-glass-bg:#1C2A26 !important; --sheet-glass-bg:#1C2A26 !important; }

       (the receipt-preview area users screenshot/print, and the logo-upload

       white intentionally in dark mode too — the alternative is a receipt
       preview that doesn't look like the paper receipt it represents. */
  }

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<!-- Per-clinic Firebase configuration. Same-origin and precached in sw.js, per
     invariant 16. This is deliberately OUTSIDE the hashed module script below:
     it is the one file that differs between clinics, and keeping it out here is
     what lets index.html stay byte-identical (and its CSP hash stay valid) on
     every clinic's deployment. Do not inline these values back into the module
     script — hardening.py asserts that they are not there. -->
<script src="./clinic-config.js?v=1"></script>

<script type="module">
/* ---------------- FRAME GUARD (SEC-05) ----------------
   X-Frame-Options and CSP frame-ancestors are HTTP response headers. They are
   configured in firebase.json, but this app is hosted on GitHub Pages, which
   has no mechanism to serve them — and frame-ancestors is ignored inside a
   <meta> tag by every browser. So the clickjacking defence has to be done in
   script, which is host-independent and works today.

   This runs before any render, so a framed copy of the app never paints a
   usable UI to click on. Reading window.top !== window.self is safe
   cross-origin; reading top.location is not, hence the inner try. */
if (window.top !== window.self) {
  document.documentElement.textContent =
    'Clinic Chart cannot be opened inside another site. Open it directly.';
  try { window.top.location.replace(window.location.href); } catch (e) { /* cross-origin: the blanking above is the defence */ }
  throw new Error('framed: refusing to start');
}

/* ---------------- FIREBASE ---------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, collection, getDocs, deleteDoc,
  addDoc, updateDoc, query, orderBy, limit, startAfter, where, writeBatch, onSnapshot,
  runTransaction, increment, documentId, getCountFromServer
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

/* Supplied by clinic-config.js, loaded just above this script. Kept out of
   this block on purpose: this block is what the CSP hash covers, so anything
   that varies per clinic has to live outside it or every clinic needs its own
   re-stamped build. See the comment on the script tag in the markup.

   Fail loudly if it is missing. initializeApp(undefined) throws from deep
   inside the Firebase SDK with a message that tells a clinic nothing, and the
   symptom — a blank screen — is identical to the CSP failure this change
   exists to prevent. A named cause is the whole point. */
const firebaseConfig = window.__CLINIC_CONFIG;
if(!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.projectId){
  document.documentElement.textContent =
    'Clinic Chart is not set up for a clinic yet — clinic-config.js is missing, '
    + 'empty, or incomplete. Check that it was uploaded alongside index.html.';
  throw new Error('clinic-config.js missing or incomplete: cannot start');
}
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
// Persistent offline cache: lets the app keep reading/writing normally with
// no connectivity, using IndexedDB, and survives the browser being closed
// and reopened. multiTabManager lets it work correctly even if the same
// clinic is open in more than one tab on this same device.
let db;
try{
  db = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
}catch(e){
  console.error('Persistent cache unavailable, falling back to in-memory Firestore', e);
  db = getFirestore(fbApp);
}

// Legacy stores (pre-multi-tenant rewrite). Kept only so the one-time
// migration can read them; nothing new is ever written here.
const LEGACY_CLINIC_DOC = doc(db, "clinic", "main");
const LEGACY_SETTINGS_DOC = doc(db, "clinicMeta", "settings");
const LEGACY_patientsCol = collection(db, 'patients');
const LEGACY_visitsCol = collection(db, 'visits');
const LEGACY_rxCol = collection(db, 'prescriptions');
const LEGACY_receiptsCol = collection(db, 'receipts');

// Multi-tenant collections: every clinic's data lives under its own
// clinics/{clinicId} document, so one deployment can serve many clinics
// with each one's data fully isolated. These are functions (not constants)
// because state.clinicId isn't known until after the signed-in user's
// profile has been loaded.
function clinicDoc(){ return doc(db, 'clinics', state.clinicId); }
// Deliberately a SEPARATE document from the main clinic settings, with its
// own stricter security rule (super-admin-write-only). This is the actual
// fix for the "hide the input in the UI" gap — a document any clinic
// member can write to can never be truly admin-only, no matter what the
// interface shows or hides, since Security Rules (not the UI) are the
// real boundary. Anything genuinely admin-only belongs here, not on the
// shared clinic doc.
function adminConfigDoc(){ return doc(db, 'clinics', state.clinicId, 'adminConfig', 'settings'); }
function patientsCol(){ return collection(db, 'clinics', state.clinicId, 'patients'); }
function offlineSessionsCol(){ return collection(db, 'clinics', state.clinicId, 'offlineSessions'); }
/* Public booking (3.22.0). bookingRequests is the only collection in this app
   an unauthenticated person can write to — see firestore-security-rules.txt.
   appointments is staff-only and holds what was actually agreed. The two are
   kept apart on purpose: a request is something a stranger typed, an
   appointment is something the clinic committed to. */
function bookingRequestsCol(){ return collection(db, 'clinics', state.clinicId, 'bookingRequests'); }
function appointmentsCol(){ return collection(db, 'clinics', state.clinicId, 'appointments'); }
function slotLocksCol(){ return collection(db, 'clinics', state.clinicId, 'slotLocks'); }

/* One document per taken slot. The ID is derived from the date and time so
   that two people confirming the same slot aim at the SAME document — that
   collision is the whole mechanism. Colons are stripped because they are
   legal in Firestore IDs but awkward in URLs and logs.

   Returns '' for anything malformed rather than inventing an ID, so a booking
   with no slot cannot silently lock a document called '2026-09-05_'. */
function slotLockId(dateISO, slot){
  const d = String(dateISO||'').trim();
  const s = String(slot||'').trim().replace(/:/g,'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !/^\d{3,4}$/.test(s)) return '';
  return d + '_' + s.padStart(4,'0');
}

/* ================= OFFLINE MODE — Phase 1 =================
   Foundation only: persistence, prep flow, multi-device checkout
   awareness, offline/online detection, pending-change counting.
   NOT YET in this phase: conflict-safe sync. Right now, if two devices
   go offline on the same clinic and edit the same record, whichever
   syncs LAST silently wins (Firestore's default behavior) — that's
   exactly the risk Phase 2 (transaction-based conflict detection +
   the review UI) exists to close. Phase 1 makes the risk visible via
   the multi-device warning; it does not yet prevent it. */
function getDeviceId(){
  let id = localStorage.getItem('cc_device_id');
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try{ localStorage.setItem('cc_device_id', id); }catch(e){}
  }
  return id;
}
function getDeviceLabel(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad/.test(ua)) return 'iPhone/iPad';
  if(/Android/.test(ua)) return 'Android device';
  return 'This device';
}
// Look at the next reserved code WITHOUT consuming it — used by the online
// path's fallback, which must not burn a reserved code on every save.
function peekReservedCode(fieldName, prefix){
  const codes = state._offlineReservedCodes;
  if(!codes || !codes[fieldName]) return null;
  const block = codes[fieldName];
  if(block.nextSeq > block.endSeq) return null;
  return prefix + '-' + String(block.nextSeq).padStart(4,'0');
}
function getNextReservedCode(fieldName, prefix){
  const codes = state._offlineReservedCodes;
  if(!codes || !codes[fieldName]) return null;
  const block = codes[fieldName];
  if(block.nextSeq > block.endSeq) return null;
  const seq = block.nextSeq;
  block.nextSeq++;
  persistOfflineReservedCodes();
  return prefix + '-' + String(seq).padStart(4,'0');
}
function persistOfflineReservedCodes(){
  try{ localStorage.setItem('cc_offline_codes_'+state.clinicId, JSON.stringify(state._offlineReservedCodes)); }catch(e){}
}
function loadPersistedOfflineState(){
  try{
    const codes = localStorage.getItem('cc_offline_codes_'+state.clinicId);
    if(codes) state._offlineReservedCodes = JSON.parse(codes);
    const checkedOut = localStorage.getItem('cc_offline_checkedout_'+state.clinicId);
    state._offlineCheckedOut = checkedOut === '1';
    const pending = localStorage.getItem('cc_offline_pending_'+state.clinicId);
    state._offlinePendingCount = pending ? parseInt(pending,10)||0 : 0;
    const changes = localStorage.getItem('cc_offline_changes_'+state.clinicId);
    state._offlinePendingChanges = changes ? JSON.parse(changes) : [];
  }catch(e){ console.error('loading offline state failed', e); }
}
function bumpOfflinePendingCount(){
  if(!state._isOffline) return;
  state._offlinePendingCount = (state._offlinePendingCount||0) + 1;
  try{ localStorage.setItem('cc_offline_pending_'+state.clinicId, String(state._offlinePendingCount)); }catch(e){}
}
function updateOnlineStatus(){
  const wasOffline = state._isOffline;
  state._isOffline = !navigator.onLine;
  if(wasOffline !== state._isOffline) render();
}
function initOnlineOfflineDetection(){
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  state._isOffline = !navigator.onLine;
}
// Looks for OTHER devices currently checked out offline for this clinic —
// shown as a warning, never a hard block, since sometimes there's a good
// reason to proceed anyway (and Phase 1 can't prevent the risk, only
// surface it).
async function checkOtherActiveOfflineSessions(){
  try{
    const snap = await getDocs(offlineSessionsCol());
    const myId = getDeviceId();
    return snap.docs
      .map(d=>({id:d.id, ...d.data()}))
      .filter(s=>s.active && s.deviceId!==myId);
  }catch(e){ console.error('checking offline sessions failed', e); return []; }
}
async function prepareForOfflineDay(){
  const others = await checkOtherActiveOfflineSessions();
  if(others.length>0){
    state._offlineOtherSessions = others;
    openModal('offline-multi-device-warning');
    return;
  }
  await runPrepareForOfflineDay();
}
async function runPrepareForOfflineDay(){
  closeModal();
  openModal('offline-preparing');
  try{
    // 1a. Cache EVERY patient in the clinic — not just recently-active ones.
    // Patient records are small (~0.5KB each), so there's no real cost to
    // caching all of them, and skipping any patient here is exactly how a
    // duplicate gets created: doctor can't find someone who hasn't visited
    // in a while, so a "new" patient gets entered instead.
    const allSnap = await getDocs(patientsCol());
    const allPatients = allSnap.docs.map(d=>({id:d.id, ...d.data()}));
    cachePatients(allPatients);

    // 1b. Detailed visit/prescription/receipt HISTORY is where the real
    // bulk lives (especially lab report photos), so THIS stays selective —
    // recently-active patients only. A patient outside this window is
    // still findable and a new visit for them still works offline; their
    // older history just won't be visible until the next sync.
    const sixMonthsAgo = new Date(); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
    const cutoff = sixMonthsAgo.toISOString().slice(0,10);
    const recentPatients = allPatients.filter(p=>p.lastVisitDate && p.lastVisitDate>=cutoff);
    // THREE queries, not three-per-patient. The previous version issued
    // 3 sequential round-trips for every recently-active patient — 900 for a
    // 300-patient clinic, which is slow on a phone and eats into the free
    // tier's daily read allowance. `date` is already a single indexed field,
    // so one range query per collection warms exactly the same cache with no
    // composite index. Reads land in the local cache regardless of the query
    // shape, so per-patient reads still resolve offline afterwards.
    await Promise.all([
      getDocs(query(visitsCol(), where('date','>=',cutoff))),
      getDocs(query(rxCol(), where('date','>=',cutoff))),
      getDocs(query(receiptsCol(), where('date','>=',cutoff))),
    ]);
    // 1c. Explicitly refresh every master/reference list — Occupation,
    // City, Tags, medicine fields, receipt items, and visit templates.
    // These live on the clinic settings document, so they're technically
    // cached incidentally just from opening the app today — but "probably
    // already cached" isn't good enough for something the doctor will
    // actively rely on all day (typing a new patient's occupation, picking
    // a medicine name, applying a visit template). Fetch fresh, explicitly,
    // right before going offline — same standard as patients above.
    const freshClinicSnap = await getDoc(clinicDoc());
    if(freshClinicSnap.exists()){
      const freshData = freshClinicSnap.data();
      state.settings = {...state.settings, ...(freshData.settings||{})};
      state.tagsList = freshData.tagsList || [];
      state.departmentsList = freshData.departmentsList || [];
      state.icd10List = freshData.icd10List || [];
      state.occupationsList = freshData.occupationsList || [];
      state.citiesList = freshData.citiesList || [];
      state.medNamesList = freshData.medNamesList || [];
      state.dosagesList = freshData.dosagesList || [];
      state.frequenciesList = freshData.frequenciesList || [];
      state.durationsList = freshData.durationsList || [];
      state.instructionsList = freshData.instructionsList || [];
      state.receiptItemsList = freshData.receiptItemsList || [];
      state.visitTemplates = freshData.visitTemplates || [];
    }
    // 2. Reserve ID blocks so new records get real, final codes offline.
    const patientStart = await reserveSequenceBlock('nextPatientSeq', 30);
    const visitStart = await reserveSequenceBlock('nextVisitSeq', 60);
    const rxStart = await reserveSequenceBlock('nextRxSeq', 60);
    const receiptStart = await reserveSequenceBlock('nextReceiptSeq', 60);
    state._offlineReservedCodes = {
      nextPatientSeq: {nextSeq:patientStart, endSeq:patientStart+29},
      nextVisitSeq: {nextSeq:visitStart, endSeq:visitStart+59},
      nextRxSeq: {nextSeq:rxStart, endSeq:rxStart+59},
      nextReceiptSeq: {nextSeq:receiptStart, endSeq:receiptStart+59},
    };
    persistOfflineReservedCodes();
    // 3. Mark this device as checked out offline for this clinic, so
    // other devices see the warning if they also try to go offline today.
    await withTimeout(setDoc(doc(offlineSessionsCol(), getDeviceId()), {
      deviceId: getDeviceId(), deviceLabel: getDeviceLabel(), userEmail: currentUser?.email||'',
      checkedOutAt: new Date().toISOString(), active: true
    }), 15000, 'Checking out for offline');
    state._offlineCheckedOut = true;
    state._offlinePendingCount = 0;
    try{
      localStorage.setItem('cc_offline_checkedout_'+state.clinicId, '1');
      localStorage.setItem('cc_offline_pending_'+state.clinicId, '0');
    }catch(e){}
    closeModal();
    render();
    showToast(`Ready — all ${allPatients.length} patients + master lists cached (${recentPatients.length} with full recent history), IDs reserved for today`);
  }catch(e){
    console.error('prepare for offline day failed', e);
    closeModal();
    showToast('Could not prepare for offline day — check your connection and try again');
  }
}

// Only fields that carry real clinical meaning route a conflict to
// "doctor must review" — administrative fields (phone, address, city...)
// can be resolved by whoever's syncing, since no medical judgment is needed.
const PATIENT_CLINICAL_FIELDS = ['allergies'];
const VISIT_CLINICAL_FIELDS = ['chiefComplaint','diagnosis','notes','vitals'];
// Everything meaningful on a prescription is clinical — a silently
// overwritten dosage is a patient-safety problem, not a bookkeeping one.
const RX_CLINICAL_FIELDS = ['medicines','advice','followUp'];
// Receipts are financial, not clinical: a receptionist can safely resolve
// these without needing the doctor.
const RECEIPT_CLINICAL_FIELDS = [];
const CLINICAL_FIELDS_BY_ENTITY = {
  patient: PATIENT_CLINICAL_FIELDS,
  visit: VISIT_CLINICAL_FIELDS,
  prescription: RX_CLINICAL_FIELDS,
  receipt: RECEIPT_CLINICAL_FIELDS,
};
// Single source of truth for which collection an offline edit belongs to,
// so sync and conflict-resolution can never disagree about where to write.
function colForEntityType(entityType){
  if(entityType==='patient') return patientsCol();
  if(entityType==='visit') return visitsCol();
  if(entityType==='prescription') return rxCol();
  if(entityType==='receipt') return receiptsCol();
  return null;
}
// Which fields genuinely DIFFER between the queued edit and what's on the
// server. A save always submits the whole form, so "is this key present?" is
// meaningless — every patient edit carries `allergies`, every visit edit
// carries `notes`. Comparing values is what makes the doctor-only gate mean
// something: a city-only correction stays non-clinical and the receptionist
// can clear it themselves.
function changedFieldsBetween(localData, serverData){
  const out = [];
  Object.keys(localData||{}).forEach(k=>{
    const a = JSON.stringify(localData[k] === undefined ? null : localData[k]);
    const b = JSON.stringify((serverData||{})[k] === undefined ? null : (serverData||{})[k]);
    if(a !== b) out.push(k);
  });
  return out;
}
function classifyChangeSensitivity(entityType, changedFields){
  const fields = CLINICAL_FIELDS_BY_ENTITY[entityType] || [];
  return (changedFields||[]).some(k=>fields.includes(k)) ? 'clinical' : 'non-clinical';
}
// Firestore write/transaction promises resolve only on SERVER acknowledgement,
// and navigator.onLine cannot tell "wifi with no internet" from a real
// connection — so anything that must not hang the UI forever gets a deadline.
function withTimeout(promise, ms, label){
  let timer;
  return Promise.race([
    Promise.resolve(promise).finally(()=>clearTimeout(timer)),
    new Promise((_,rej)=>{ timer = setTimeout(()=>rej(Object.assign(new Error((label||'Operation')+' timed out'), {code:'timeout'})), ms); })
  ]);
}
function queueOfflineEdit(entityType, docId, data, baseVersion){
  if(!state._offlinePendingChanges) state._offlinePendingChanges = [];
  // COALESCE. A record edited several times during an offline day must produce
  // exactly ONE queue entry. Separate entries would all carry the same
  // baseVersion, so the first would apply (bumping _v on the server) and every
  // later one would then mismatch — a false conflict against the doctor's own
  // earlier edit. Merging keeps the latest values against the original base.
  const existing = state._offlinePendingChanges.find(c=>c.entityType===entityType && c.docId===docId);
  if(existing){
    existing.data = {...existing.data, ...data};
    existing.queuedAt = new Date().toISOString();
  } else {
    state._offlinePendingChanges.push({
      localId: 'pc_'+Date.now()+'_'+Math.random().toString(36).slice(2),
      entityType, docId, baseVersion, data, queuedAt: new Date().toISOString()
    });
  }
  persistOfflinePendingChanges();
}
function persistOfflinePendingChanges(){

/* Phase 2 sync: every pending offline EDIT (to an existing patient or
   visit — new records never conflict, see savePatient/saveVisit) is
   checked via transaction against the server's current version before
   being applied. A version mismatch means someone else changed that same
   record since this device went offline — instead of overwriting it, both
   versions are stored as a conflict for a human to resolve. Nothing is
   ever silently lost. */
async function endOfflineSession(){
  const pendingChanges = state._offlinePendingChanges || [];
  if(pendingChanges.length===0){
    await finishOfflineSessionCleanup();
    await refreshPendingConflictsCount();
    render();
    showToast('Synced — no pending edits to check');
    return;
  }
  showToast(`Syncing ${pendingChanges.length} change(s) — checking each against the server…`);
  let appliedCount = 0, conflictCount = 0, discardedCount = 0;
  const stillPending = [];
  for(const change of pendingChanges){
    try{
      const col = colForEntityType(change.entityType);
      if(!col){ console.error('unknown entityType in queue', change.entityType); continue; }
      // Deadline on every transaction: a half-open connection would otherwise
      // wedge the whole sync silently, with no way back for the user.
      const result = await withTimeout(runTransaction(db, async (tx)=>{
        const ref = doc(col, change.docId);
        const snap = await tx.get(ref);
        if(!snap.exists()) return {status:'missing'};
        const serverVersion = snap.data()._v || 0;
        if(serverVersion === change.baseVersion){
          tx.update(ref, {...change.data, _v: serverVersion+1});
          return {status:'applied'};
        }
        return {status:'conflict', serverData: snap.data()};
      }), 15000, 'Sync');
      if(result.status==='applied'){
        appliedCount++;
      } else if(result.status==='conflict'){
        const changedFields = changedFieldsBetween(change.data, result.serverData);
        if(changedFields.length===0){
          // The server already holds exactly these values (another device made
          // the same edit, or this one was partially applied). Nothing to
          // review — recording it would only train people to dismiss conflicts.
          appliedCount++;
        } else {
          conflictCount++;
          const sensitivity = classifyChangeSensitivity(change.entityType, changedFields);
          await withTimeout(addDoc(conflictsCol(), {
            entityType: change.entityType, docId: change.docId,
            localData: change.data, serverData: result.serverData,
            changedFields,
            sensitivity, deviceLabel: getDeviceLabel(), userEmail: currentUser?.email||'',
            queuedAt: change.queuedAt, detectedAt: new Date().toISOString(), resolved:false
          }), 15000, 'Recording conflict');
        }
      } else {
        // The record was deleted on another device while this edit sat queued.
        // There is nothing left to merge into — but say so plainly rather than
        // counting it as a "conflict" the doctor will go looking for and never find.
        discardedCount++;
        console.warn('offline edit discarded — record deleted server-side', change.entityType, change.docId);
      }
    }catch(e){
    console.error('sync change failed', e, {entityType: change.entityType, docId: change.docId});
      stillPending.push(change); // connection dropped mid-sync — keep queued, retry next time
    }
  }
  state._offlinePendingChanges = stillPending;
  persistOfflinePendingChanges();
  if(stillPending.length>0){
    render();
    showToast(`Synced ${appliedCount} — ${stillPending.length} couldn't be checked (connection dropped), will retry next sync`);
    return;
  }
  await finishOfflineSessionCleanup();
  await refreshPendingConflictsCount();
  render();
  showToast(`Synced — ${appliedCount} change(s) applied`
    + (conflictCount>0?`, ${conflictCount} conflict(s) need review`:'')
    + (discardedCount>0?`, ${discardedCount} edit(s) discarded (record deleted on another device)`:''));
}
async function finishOfflineSessionCleanup(){
  try{
    await withTimeout(updateDoc(doc(offlineSessionsCol(), getDeviceId()), {active:false, endedAt:new Date().toISOString()}), 15000, 'Ending offline session');
  }catch(e){ console.error('ending offline session failed', e); }
  state._offlineCheckedOut = false;
  state._offlinePendingCount = 0;
  state._offlineReservedCodes = null;
  state._offlinePendingChanges = [];
  try{
    localStorage.removeItem('cc_offline_checkedout_'+state.clinicId);
    localStorage.removeItem('cc_offline_pending_'+state.clinicId);
    localStorage.removeItem('cc_offline_codes_'+state.clinicId);
    localStorage.removeItem('cc_offline_changes_'+state.clinicId);
  }catch(e){}
}

async function resolveConflict(conflictId, keepWhich){
  const conflict = (state._syncConflictsList||[]).find(c=>c.id===conflictId);
  if(!conflict) return;
  if(conflict.sensitivity==='clinical' && !isDoctor()){
    showToast('Only the doctor can resolve this — it touches clinical fields');
    return;
  }
  showToast('Resolving…');
  try{
    const col = colForEntityType(conflict.entityType);
    if(!col){ showToast('Unknown record type — cannot resolve'); return; }
    const ref = doc(col, conflict.docId);
    if(keepWhich==='local'){
      await withTimeout(runTransaction(db, async (tx)=>{
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const currentVersion = snap.data()._v || 0;
        tx.update(ref, {...conflict.localData, _v: currentVersion+1});
      }), 15000, 'Resolving');
    }
    await withTimeout(updateDoc(doc(conflictsCol(), conflictId), {resolved:true, resolvedAt:new Date().toISOString(), resolvedKeep:keepWhich}), 15000, 'Resolving');
    state._syncConflictsList = (state._syncConflictsList||[]).filter(c=>c.id!==conflictId);
    render();
    await refreshPendingConflictsCount();
    showToast('Resolved');
  }catch(e){ console.error('resolve conflict failed', e); showToast('Failed to resolve — check your connection'); }
}

let voiceRecognition = null;
let voiceActiveFieldId = null;
// Dictation for a text field: tap the mic on Chief complaint/Diagnosis/Notes
// to append spoken text as it's recognized, instead of typing mid-consult.
// Native browser API (Chrome/Edge) — no library, and gracefully absent
// (button never renders) where the browser doesn't support it, e.g. Safari.
function toggleVoiceInput(fieldId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast('Voice input is not supported in this browser — try Chrome or Edge'); return; }
  if(voiceRecognition && voiceActiveFieldId===fieldId){ voiceRecognition.stop(); return; }
  if(voiceRecognition) voiceRecognition.stop();
  const input = document.getElementById(fieldId);
  if(!input) return;
  let baseText = input.value ? input.value.replace(/\s*$/,'') + ' ' : '';
  const recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-IN';
  recognition.onresult = (e)=>{
    let finalTranscript = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
    }
    if(finalTranscript){
      input.value = baseText + finalTranscript;
      baseText = input.value;
      input.dispatchEvent(new Event('input', {bubbles:true}));
    }
  };
  recognition.onerror = (e)=>{ if(e.error!=='no-speech' && e.error!=='aborted') showToast('Voice input error — try again'); };
  recognition.onend = ()=>{ voiceRecognition = null; voiceActiveFieldId = null; updateVoiceButtonStates(); };
  try{ recognition.start(); voiceRecognition = recognition; voiceActiveFieldId = fieldId; updateVoiceButtonStates(); }
  catch(e){ console.error('voice start failed', e); showToast('Could not start voice input'); }
}

        state.currentRole = null;
        state.clinicId = null;
        state.isSuperAdmin = false;
        state._noProfileError = true;
      }
    }
    state.homeClinicId = state.clinicId; // super admins can switch away from this; everyone else stays here
    state._profileLoadError = false;
  }catch(e){
    // FAIL CLOSED. Defaulting to "doctor" here used to hand a receptionist the
    // full clinical UI whenever the network hiccuped — every write would then
    // be rejected by the rules with no explanation. Better to say the session
    // didn't load and offer a retry.
    console.error('profile load failed', e);
    state.currentRole = null; state.clinicId = null; state.homeClinicId = null;
    state.isSuperAdmin = false; state._profileLoadError = true;
  }

// Ensures the one-time legacy migration only ever happens once, no matter
// how many different pre-existing accounts log in and hit this path. A
// marker document records which clinic received the migrated data; anyone
// after the first just gets pointed at that same clinic. Deliberately does
// NOT copy any data itself — the caller must update the signed-in user's
// own profile with this clinicId first (required for the security rules
// to authorize the copy), then call copyLegacyDataIntoClinic separately.
async function getOrCreateLegacyClinic(){
  const markerRef = doc(db, 'clinicMeta', 'migrationMarker');
  return await runTransaction(db, async (tx)=>{
    const markerSnap = await tx.get(markerRef);
    if(markerSnap.exists() && markerSnap.data().clinicId){
      return {clinicId: markerSnap.data().clinicId, isFirstMigration:false};
    }
    const clinicRef = doc(collection(db, 'clinics'));
    tx.set(clinicRef, {
      settings: state.settings, tagsList: [], createdAt: new Date().toISOString()
    });
    tx.set(markerRef, {clinicId: clinicRef.id, migratedAt: new Date().toISOString(), dataCopied:false});
    return {clinicId: clinicRef.id, isFirstMigration:true};
  });
}
// Copies old flat-collection data (settings + patients + visits +
// prescriptions + receipts) into the newly created clinic. Only ever
// called once, immediately after that clinic doc is first created.
async function copyLegacyDataIntoClinic(clinicId){
  const clinicRef = doc(db, 'clinics', clinicId);
  try{
    const legacySettingsSnap = await getDoc(LEGACY_SETTINGS_DOC);
    const legacyData = legacySettingsSnap.exists() ? legacySettingsSnap.data() : null;
    if(legacyData){
      await withTimeout(setDoc(clinicRef, {
        settings: legacyData.settings || state.settings,
        tagsList: legacyData.tagsList || []
      }, {merge:true}), 20000, 'Creating clinic');
    }
    const [pSnap, vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(LEGACY_patientsCol), getDocs(LEGACY_visitsCol),
      getDocs(LEGACY_rxCol), getDocs(LEGACY_receiptsCol)
    ]);
    if(!pSnap.empty || !vSnap.empty || !rxSnap.empty || !rcSnap.empty){
      showToast(`Migrating ${pSnap.size} existing patients into your clinic workspace…`);
      const allDocs = [];
      pSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'patients'), d.id), data:d.data()}));
      vSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'visits'), d.id), data:d.data()}));
      rxSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'prescriptions'), d.id), data:d.data()}));
      rcSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'receipts'), d.id), data:d.data()}));
      for(let i=0;i<allDocs.length;i+=400){
        const batch = writeBatch(db);
        allDocs.slice(i,i+400).forEach(({ref,data})=>batch.set(ref,data));
        await withTimeout(batch.commit(), 30000, 'Migration');
      }
      showToast('Migration complete');
    }
    await withTimeout(updateDoc(doc(db,'clinicMeta','migrationMarker'), {dataCopied:true}), 15000, 'Finishing migration');
  }catch(e){ console.error('clinic data copy failed', e); showToast('Clinic setup ran into a problem — your old data is untouched; contact support before continuing'); }
}

  state.medNamesList = []; state.dosagesList = []; state.frequenciesList = [];
  state.durationsList = []; state.instructionsList = []; state.receiptItemsList = [];
  state.paymentMethodsList = []; state.visitTemplates = [];
  // analytics
  state._analyticsVisits = null; state._analyticsReceipts = null;
  state._analyticsRangeFrom = null; state._analyticsRangeTo = null;
  if(revenueChartInstance){ revenueChartInstance.destroy(); revenueChartInstance = null; }
  if(vitalsChartInstance){ vitalsChartInstance.destroy(); vitalsChartInstance = null; }
  // tools
  state._attachmentsList = null; state._attachmentsSelectionMode = false; state._attachmentsSelectedIds = [];
  state._duplicateGroups = null; state._duplicateKeepChoice = {};

  // until they sync. Deleting them here would destroy real patient data, so

  const pending = (state._offlinePendingChanges||[]).length;

/* ---------------- STORAGE USAGE (estimate) ---------------- */
function estimateDocsBytes(docs){
  return docs.reduce((sum, d)=> sum + JSON.stringify(d).length, 0);
}
// Recomputes THIS clinic's estimated storage by reading all of its own
// documents and summing their JSON size. Costs real Firestore reads
// proportional to how much data exists, so this only runs on demand (a
// button in Settings) or after bulk operations — never automatically on
// every page load.
/* announce=true only when the user asked for this directly. It is also called
   as a background side effect after imports, erases and demo-data changes, and
   a notice from a side effect overwrites the notice the user was actually
   waiting to read — the import result was being clobbered by a storage figure
   nobody had asked for. */
async function recalculateMyClinicStorage(announce){
  showToast('Calculating storage usage — this may take a moment for a large clinic…');
  try{
    const [pSnap, vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(patientsCol()), getDocs(visitsCol()), getDocs(rxCol()), getDocs(receiptsCol())
    ]);
    const bytes = estimateDocsBytes(pSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(vSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(rxSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(rcSnap.docs.map(d=>d.data()));
    const docCount = pSnap.size + vSnap.size + rxSnap.size + rcSnap.size;
    const attachmentCount = vSnap.docs.reduce((s,d)=>s+((d.data().attachments||[]).length),0);
    // Same receipts fetch also gives us the Patients-tab summary card
    // numbers for free — no separate scan needed.
    let totalCashCollected = 0, totalUnpaid = 0;
    rcSnap.docs.forEach(d=>{
      const rc = d.data();
      getReceiptPayments(rc).forEach(p=>{ if((p.method||'')==='Cash') totalCashCollected += (parseFloat(p.amount)||0); });
      const paid = getReceiptAmountPaid(rc);
      totalUnpaid += Math.max((rc.total||0)-paid, 0);
    });
    const updatedAt = new Date().toISOString();
    await withTimeout(setDoc(clinicDoc(), {estimatedBytes:bytes, docCount, storageUpdatedAt:updatedAt, settings:{attachmentCount, totalCashCollected, totalUnpaid, financialsUpdatedAt:updatedAt}}, {merge:true}), 15000, 'Saving storage totals');
    await withTimeout(setDoc(doc(db,'clinicStats',state.clinicId), {estimatedBytes:bytes, docCount, updatedAt}, {merge:true}), 15000, 'Saving storage totals');
    state._myClinicBytes = bytes;
    state._myClinicDocCount = docCount;
    state.settings.attachmentCount = attachmentCount;
    state.settings.totalCashCollected = totalCashCollected;
    state.settings.totalUnpaid = totalUnpaid;
    state.settings.financialsUpdatedAt = updatedAt;
    render();
    await loadPlatformStorageUsage();
    if(announce){
      showNotice('Storage recalculated',
        `This clinic is using ${formatKB(bytes)} across ${compactCount(docCount)} record(s).`);
    }
  }catch(e){ console.error('storage calc failed', e); showToast('Could not calculate storage — check your connection'); }
}
// Reads every clinic's published byte count (not their patient data — just
// a number) and sums them for the "total across all clinics" figure shown
// on every screen's warning banner.
async function loadPlatformStorageUsage(){
  try{
    const snap = await getDocs(collection(db,'clinicStats'));
    let total = 0;
    snap.docs.forEach(d=>{ total += (d.data().estimatedBytes||0); });
    state._platformStorageBytes = total;
    state._platformStoragePercent = total / STORAGE_LIMIT_BYTES;
    const mine = snap.docs.find(d=>d.id===state.clinicId);
    if(mine){ state._myClinicBytes = mine.data().estimatedBytes||0; state._myClinicDocCount = mine.data().docCount||0; }
  }catch(e){ console.error('platform storage load failed', e); }
  render();
}
// Record counts reach five and six figures on an established clinic, where the
// exact digit is never what is being read — "142k records" answers the question
// and "142,318 records" makes the eye stop to parse it. Exact below 1,000,
// because at that size the precise number is both legible and worth having.
// Decimal places shrink as the magnitude grows so the string stays a roughly
// constant width: 3.48k, 12.5k, 142k, 1.25M.
function compactCount(n){
  n = Number(n);
  if(!isFinite(n) || n < 0) n = 0;
  if(n < 1000) return n.toLocaleString();
  const million = n >= 1000000;
  const scaled = n / (million ? 1000000 : 1000);
  const dp = scaled < 10 ? 2 : (scaled < 100 ? 1 : 0);
  return parseFloat(scaled.toFixed(dp)) + (million ? 'M' : 'k');
}
function formatBytes(bytes){
  if(!bytes) return '0 MB';
  const mb = bytes/(1024*1024);
  if(mb<1) return (bytes/1024).toFixed(0)+' KB';
  if(mb<1024) return mb.toFixed(1)+' MB';
  return (mb/1024).toFixed(2)+' GB';
}

async function loadPatientsPage(reset){

  if(!state._patientsHasMore) return;
  try{

    if(state._patientsCursor) constraints.splice(1, 0, startAfter(state._patientsCursor));
    const snap = await getDocs(query(patientsCol(), ...constraints));

    state._patientsCursor = docsArr.length ? docsArr[docsArr.length-1] : state._patientsCursor;

// A cached, bounded pool of patients used for both search and gender/city/tag
// filtering. Firestore itself only supports prefix matching natively (finds
// names STARTING WITH what you typed) — real "contains anywhere",
// case-insensitive search needs to happen in memory, so we pull a generous
// pool once and filter it locally on every keystroke (fast, no repeated
// network calls while typing).
/* The pool is now a bonus, not the mechanism.

   It exists so a small clinic keeps mid-word matching — typing "nit" finding
   "Sunita" — which the indexed queries cannot do. Above the threshold it is
   simply not loaded: downloading 10,000 records into a phone on every session
   was never going to work, and the indexed path already returns the complete
   answer without it.

   The threshold is above SEARCH_POOL_SIZE on purpose. Search must never get
   quietly worse the day a clinic crosses a line, so what varies with size is an
   extra convenience, never correctness. */
function poolIsWorthLoading(){
  const n = state._totalPatientCount;
  return typeof n !== 'number' || n <= SEARCH_POOL_SIZE;
}
async function ensureSearchPool(forceRefresh){
  if(!poolIsWorthLoading()){ state._searchPool = state._searchPool || []; return; }
  if(state._searchPool && !forceRefresh) return;
  try{
    const snap = await getDocs(query(patientsCol(), orderBy('nameLower'), limit(SEARCH_POOL_SIZE)));
    state._searchPool = snap.docs.map(d=>({id:d.id, ...d.data()}));
    cachePatients(state._searchPool);
  }catch(e){
    console.error('search pool load failed', e);
    showToast('Search failed to load — ' + (e.message||'check your connection').slice(0,80));
    state._searchPool = state._searchPool || [];
  }
}
/* ---------------- NAME SEARCH TOKENS ----------------
   Firestore has no full-text search and no "contains" operator. A range query
   on nameLower gives you "starts with the whole name", which finds Sunita Patil
   by typing "sun" but never by typing "patil" — and surname is how reception
   usually searches.

   So each patient stores the prefixes of every word in their name:
     "Sunita Patil" -> su,sun,suni,sunit,sunita,pa,pat,pati,patil
   and a search does array-contains on the typed text. Firestore indexes array
   fields automatically, so this needs no index configuration, and it costs a
   fixed number of reads whatever the clinic's size.

   Prefixes start at 2 characters (1 would match a large fraction of the clinic
   and return noise) and stop at 12 (nobody types more, and it bounds the array
   on long names). A two-word name produces roughly a dozen short strings. */
const NAME_TOKEN_MIN = 2, NAME_TOKEN_MAX = 12, NAME_TOKEN_CAP = 60;
function patientSearchTokens(name){
  // Apostrophes and full stops are removed, not treated as word breaks:
  // D'Souza and O'Neil are single names, and splitting them produces a
  // useless one-character token plus a fragment nobody types. Hyphens and
  // whitespace DO separate words, so Sharma-Verma is findable either way.
  const words = String(name||'').toLowerCase()
    .replace(/['\u2019.]/g, '')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .split(/\s+/).filter(Boolean);
  const out = new Set();
  for(const w of words){
    const end = Math.min(w.length, NAME_TOKEN_MAX);
    if(w.length < NAME_TOKEN_MIN){ out.add(w); continue; }
    for(let i=NAME_TOKEN_MIN;i<=end;i++) out.add(w.slice(0,i));
  }
  return Array.from(out).slice(0, NAME_TOKEN_CAP);
}
/* Called at the end of every operation that adds, removes or merges patients —
   demo data load and removal, erase-all, save, delete, merge, import, repair.
   That makes it the one honest place to refresh the total, which was previously
   fetched once when the clinic loaded and then never again.

   The symptom: an admin switched into a clinic with no patients (count 0),
   loaded demo data, and the header read "0 patients" above a full list until
   they changed tabs, because changing tabs was the only other thing that
   re-ran the count. */
function invalidateSearchPool(){ state._searchPool = null; refreshPatientCount(); }
/* Gender, city and tag are exact-value matches, so they belong in the query for
   the same reason the Records filters did: filtering a truncated pool returns a
   partial answer that looks complete. Firestore permits one array-contains per
   query, which is why multiple tags are narrowed locally after the fetch —
   noted in the UI rather than hidden. */
async function loadPatientsForFiltering(){
  state._patientsMode = 'filter';
  const tags = state._filterTags || [];
  const constraints = [];
  if(state._filterGender) constraints.push(where('gender','==',state._filterGender));
  if(state._filterCity) constraints.push(where('city','==',state._filterCity));
  if(tags.length) constraints.push(where('tags','array-contains',tags[0]));
  constraints.push(orderBy('nameLower'));
  constraints.push(limit(SEARCH_POOL_SIZE));
  try{
    const snap = await getDocs(query(patientsCol(), ...constraints));
    let list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    cachePatients(list);
    if(tags.length > 1){
      list = list.filter(p => tags.every(t => (p.tags||[]).includes(t)));
    }
    state.patients = list;
    state._patientsHasMore = false;
    refreshFilteredPatientCount();
  }catch(e){
    console.error('patient filter failed', e);
    const needsIndex = e && (e.code === 'failed-precondition' || /index/i.test(e.message||''));
    showToast(needsIndex
      ? 'This filter combination needs a database index — see the console for the one-click link'
      : 'Could not apply filters — check your connection');
    state.patients = [];
    state._patientsHasMore = false;
  }
}
async function refreshFilteredPatientCount(){
  state._filteredPatientCount = null;
  const tags = state._filterTags || [];
  const constraints = [];
  if(state._filterGender) constraints.push(where('gender','==',state._filterGender));
  if(state._filterCity) constraints.push(where('city','==',state._filterCity));
  if(tags.length) constraints.push(where('tags','array-contains',tags[0]));
  try{
    const snap = await getCountFromServer(query(patientsCol(), ...constraints));
    state._filteredPatientCount = snap.data().count;
    render();
  }catch(e){ console.error('filtered patient count failed', e && e.code, e && e.message); }
}
const SEARCH_HIT_LIMIT = 25;
/* Indexed queries first, always, at every clinic size — so no patient is ever
   unfindable. The local pool is then layered on top for the one thing indexes
   cannot do (mid-word matching), and only when the clinic is small enough for
   the pool to exist at all.

   Previously this searched the pool ONLY, which meant a clinic over
   SEARCH_POOL_SIZE patients could not find roughly everyone past the first
   thousand names alphabetically — and patient-code search, which the filters
   panel offers as the workaround, was scanning the same truncated pool and so
   failed for exactly the patients that needed it. */
async function searchPatientsRemote(qRaw){
  const q = qRaw.trim();
  if(!q){ await loadPatientsPage(true); render(); return; }
  state._patientsMode = 'search';
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');
  const merged = {};
  const add = d => { const p = {id:d.id, ...d.data()}; cachePatient(p); merged[p.id] = p; };

  const lookups = [];

  // Whole name, starts-with. Handles multi-word input like "asha ver", which
  // a single token can't.
  lookups.push(getDocs(query(patientsCol(),
    orderBy('nameLower'),
    where('nameLower','>=',qLower),
    where('nameLower','<',qLower + '\uf8ff'),
    limit(SEARCH_HIT_LIMIT))));

  // Any word, starts-with — this is what finds someone by surname.
  if(qLower.length >= NAME_TOKEN_MIN){
    lookups.push(getDocs(query(patientsCol(),
      where('nameTokens','array-contains', qLower.slice(0, NAME_TOKEN_MAX)),
      limit(SEARCH_HIT_LIMIT))));
  }

  // Patient code, exact. Codes are stored uppercase.
  lookups.push(getDocs(query(patientsCol(),
    where('patientCode','==', q.toUpperCase()), limit(5))));

  // A near-complete phone number, exact.
  if(digits.length >= 5){
    lookups.push(getDocs(query(patientsCol(),
      where('phoneNormalized','==',digits), limit(5))));
  }

  const results = await Promise.allSettled(lookups);
  let anyFailed = false;
  results.forEach(r=>{
    if(r.status === 'fulfilled') r.value.docs.forEach(add);
    else { anyFailed = true; console.error('patient search lookup failed', r.reason && r.reason.code); }
  });

  // Bonus pass for small clinics: mid-word matches the indexes can't express.
  if(poolIsWorthLoading()){
    await ensureSearchPool();
    (state._searchPool||[]).forEach(p=>{
      const nameHay = p.nameLower || (p.name||'').toLowerCase();
      const codeHay = (p.patientCode||'').toLowerCase();
      const phoneHay = p.phoneNormalized||'';
      if(nameHay.includes(qLower) || codeHay.includes(qLower)
         || (digits.length>=3 && phoneHay.includes(digits))) merged[p.id] = p;
    });
  }

  const list = Object.values(merged).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  state.patients = list;
  state._patientsHasMore = false;
  state._searchDegraded = anyFailed;
  render();
  if(anyFailed) showToast('Some search results may be missing — check your connection');
}
async function fetchPatientDirect(id){
  if(state._patientCache[id]) return state._patientCache[id];
  try{
    const snap = await getDoc(doc(patientsCol(), id));
    if(snap.exists()){ const p = {id:snap.id, ...snap.data()}; cachePatient(p); return p; }
  }catch(e){ console.error('patient fetch failed', e); }
  return null;
}

function triggerImport(){ document.getElementById('importFile').click(); }
function importData(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=> runExclusive('restore-backup', 'Restoring backup', async (progress)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.patients || !Array.isArray(parsed.patients)) throw new Error('bad format');
      showToast('Restoring backup — this may take a moment…');
      const allDocs = [];
      (parsed.patients||[]).forEach(p=>{ const {id,...rest}=p; allDocs.push({col:patientsCol(),id,data:rest}); });
      (parsed.visits||[]).forEach(v=>{ const {id,...rest}=v; allDocs.push({col:visitsCol(),id,data:rest}); });
      (parsed.prescriptions||[]).forEach(r=>{ const {id,...rest}=r; allDocs.push({col:rxCol(),id,data:rest}); });
      (parsed.receipts||[]).forEach(r=>{ const {id,...rest}=r; allDocs.push({col:receiptsCol(),id,data:rest}); });
      for(let i=0;i<allDocs.length;i+=400){
        const batch = writeBatch(db);
        allDocs.slice(i,i+400).forEach(({col,id,data})=>batch.set(doc(col,id), data));
        // REL-01: an unwrapped commit never rejects when the connection drops
        // mid-restore — Firestore just queues the write and the await hangs
        // forever, leaving "Restoring backup…" on screen with no way out.
        // Flagged as a write failure (not a parse failure) so the message below
        // can tell the truth about what happened.
        try{
          await withTimeout(batch.commit(), 30000, 'Backup restore');
        }catch(e){ e.__phase = 'write'; e.__done = i; throw e; }
      }
      if(parsed.settings) state.settings = {...state.settings, ...parsed.settings};
      if(parsed.tagsList) state.tagsList = parsed.tagsList;
      await saveSettingsDoc();
      await loadPatientsPage(true);
      render();
      invalidateSearchPool();
      invalidateRecordsSearchPool();
      recalculateMyClinicStorage();
      showToast('Backup restored');
    }catch(err){
      console.error('restore backup failed', err);
      // The write phase and the parse phase used to share one message, so a
      // dropped connection halfway through a restore told the user their
      // backup file was bad — while some records had in fact already been
      // written. Report partial restores as partial restores.
      if(err && err.__phase === 'write'){
        showNotice('Restore stopped partway through',
          `About ${err.__done} record(s) were already written. Check your connection and run the restore again — re-running is safe, it overwrites rather than duplicates.`, 'warn');
      } else {
        showToast('Could not read that backup file');
      }
    }
  });
  reader.readAsText(file);
  fileInput.value = '';
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'});
}
/* Toasts are for feedback on something you just did and can already see —
   "Saved", "PDF downloaded". They vanish, which is correct for those and wrong
   for anything else.

   A result you were not watching for needs showNotice(): it stays until it is
   dismissed. The case that prompted this was tapping "Recalculate storage",
   moving on to a visit, and never learning what the answer was — the toast
   came and went while the user was looking somewhere else.

   Rule of thumb: if the message carries a number worth reading, reports a
   partial or failed outcome, or arrives after a wait long enough to look away,
   it is a notice. Otherwise it is a toast. */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t){ console.warn('toast element missing:', msg); return; }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function showNotice(title, body, tone){

}
function renderNoticeModal(){

    </div>`;
}
// Safety net: a Firestore write that nobody attached a .catch() to would
// otherwise surface as an unhandled rejection — noisy, and on some browsers
// it can interrupt the surrounding flow. Offline this is routine (writes sit
// queued), so swallow quietly rather than alarming the doctor mid-consult.
// Offline/transient Firestore codes are routine here (writes sit queued) and
// are swallowed quietly. Anything else is a real defect and is logged as an
// error — blanket-suppressing everything hid genuine bugs, including
// permission failures the user needs to know about.
const QUIET_REJECTION_CODES = ['unavailable','deadline-exceeded','cancelled','aborted','timeout','failed-precondition'];
window.addEventListener('unhandledrejection', (e)=>{
  const code = e && e.reason && e.reason.code;
  const msg = (e && e.reason && (e.reason.message||String(e.reason))) || '';
  if(code && QUIET_REJECTION_CODES.includes(code)){
    console.warn('transient rejection (suppressed):', code);
    e.preventDefault();
    return;
  }
  console.error('unhandled promise rejection:', code || msg, e && e.reason);
  if(code === 'permission-denied'){
    showToast("Something couldn't be saved — you may not have permission for that.");
  }
  e.preventDefault(); // still prevented: an uncaught rejection can interrupt the surrounding flow
});
// Prevents double-submits: disables every button in the open sheet the
// instant an action starts, and shows a loading label on the one that was
// clicked. On success the modal usually closes anyway; on failure call
// unlockSheetButtons() to restore everything so the person can retry.
function lockSheetButtons(loadingLabel){
  const sheet = document.querySelector('.sheet');
  if(!sheet) return;
  const primary = sheet.querySelector('.btn-primary');
  const danger = sheet.querySelector('.btn-danger');
  sheet.querySelectorAll('button').forEach(b=>{ b.disabled = true; });
  if(primary && loadingLabel){ primary.dataset.origText = primary.textContent; primary.textContent = loadingLabel; }
}
function unlockSheetButtons(){
  const sheet = document.querySelector('.sheet');
  if(!sheet) return;
  sheet.querySelectorAll('button').forEach(b=>{
    b.disabled = false;
    if(b.dataset.origText){ b.textContent = b.dataset.origText; delete b.dataset.origText; }
  });
}
