async function addBookingHalfDay(){
  const d = (document.getElementById('bk_hdate')||{}).value || '';
  const st = (document.getElementById('bk_hstart')||{}).value || '';
  const en = (document.getElementById('bk_hend')||{}).value || '';
  const r  = (document.getElementById('bk_hreason')||{}).value || '';
  if(!d || !st || !en){ showToast('Date, start and end are all needed'); return; }
  if(en <= st){ showToast('End time must be after the start time'); return; }
  const cur = (state.bookingConfig && state.bookingConfig.halfDays) || [];
  const next = cur.filter(h=>h.date!==d)
    .concat([{date:d, start:st, end:en, reason:String(r).trim().slice(0,60)}])
    .sort((a,b)=>a.date.localeCompare(b.date));
  await updateBookingList('halfDays', next);
}
async function removeBookingHalfDay(date){
  const cur = (state.bookingConfig && state.bookingConfig.halfDays) || [];
  await updateBookingList('halfDays', cur.filter(h=>h.date!==date));
}
async function updateBookingList(field, next){
  if(!isDoctor()){ showToast('Only a doctor can change booking settings'); return; }
  try{
    await withTimeout(setDoc(publicConfigRef(), {[field]: next}, {merge:true}),
      15000, 'update booking '+field);
    state.bookingConfig = Object.assign({}, state.bookingConfig||{}, {[field]: next});
    render();
  }catch(e){
    console.error('updateBookingList failed', e && e.code, e && e.message);
    showToast('Could not save — check your connection');
  }
}

   =========================================================================
   Icons used to come from Google's Material Symbols web font, loaded from
   fonts.googleapis.com at runtime — a real external dependency: if that font
   ever failed to load (network blip, Google deprecating the family, a CSP
   change), every icon in the app silently degraded to plain unstyled words
   ("group", "settings", "tune"), which is a real failure mode users would
   actually see.

   Icons are now inlined SVG path data, sourced from Lucide (ISC-licensed:
   https://lucide.dev) at build time and pasted directly into this file.
   The text faces (Fraunces, Inter, JetBrains Mono) took the same route in
   3.24.0 and are now served from vendor/fonts/, so the claim below finally
   holds for the whole app rather than just the icons.

   There is no runtime dependency on Lucide, or on any external service, ever
   again — this app could not be affected by Lucide going end-of-life even in
   principle, because nothing here ever fetches it. The registry below is the
   entire icon set the app uses; ICON_FALLBACK is what renders if a name is
   ever requested that isn't in it (a typo, or a future icon nobody added
   yet), so a missing icon degrades to a small neutral mark instead of
   rendering nothing or throwing.
   ========================================================================= */

// Rendered when a requested icon name isn't in the registry above: a plain
// neutral dot, never blank, never an error. This is the actual "what if the
// library disappears" safeguard — a name that stops resolving degrades to
// this instead of breaking the layout or throwing mid-render.
const ICON_FALLBACK = 'CIRCLE:12,12,9|M12 8v4|M12 16h.01';
function iconPathMarkup(spec){
  return spec.split('|').map(seg=>{
    if(seg.startsWith('CIRCLE:')){
      const [cx,cy,r] = seg.slice(7).split(',');
      return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
    }
    if(seg.startsWith('ELLIPSE:')){
      const [cx,cy,rx,ry] = seg.slice(8).split(',');
      return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
    }
    if(seg.startsWith('RECT:')){
      const [x,y,w,h,rx] = seg.slice(5).split(',');
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
    }
    if(seg.startsWith('DOT:')){
      const [cx,cy] = seg.slice(4).split(',');
      return `<circle cx="${cx}" cy="${cy}" r=".5" fill="currentColor"/>`;
    }
    return `<path d="${seg}"/>`;
  }).join('');
}
// icon(name, opts) — the one call site every icon in the app goes through.
// opts: {size, filled, cls, style, color}
// `filled` mimics the old Material Symbols "fill" variant (used for the
// selected bottom-nav tab and a couple of solid-accent spots) by filling
// with currentColor at reduced opacity rather than a hard fill, since these
// are stroke-drawn icons, not the dual-style Material glyphs.
function icon(name, opts){
  opts = opts || {};
  const spec = ICONS[name];
  if(!spec && typeof console!=='undefined'){
    console.warn('icon(): unknown icon name "'+name+'" — rendering fallback mark. Add it to ICONS.');
  }
  const size = opts.size || 20;
  const cls = opts.cls ? ' '+opts.cls : '';
  const style = opts.style || '';
  const fillOpacity = opts.filled ? '0.16' : '0';
  return `<svg class="ico${cls}" viewBox="0 0 24 24" width="${size}" height="${size}" `
    + `style="stroke:${opts.color||'currentColor'};fill:${opts.color||'currentColor'};fill-opacity:${fillOpacity};stroke-width:${opts.strokeWidth||1.8};${style}" `
    + `stroke-linecap="round" stroke-linejoin="round">${iconPathMarkup(spec||ICON_FALLBACK)}</svg>`;
}

function saveVisitTemplate(idx){
  const name = document.getElementById('vt_name').value.trim();
  if(!name){ showToast('Template name is required'); return; }
  const t = {
    name,
    department: (document.getElementById('vt_dept')||{}).value || '',
    chiefComplaint: document.getElementById('vt_cc').value.trim(),
    diagnosis: document.getElementById('vt_dx').value.trim(),
    notes: document.getElementById('vt_notes').value.trim(),

      temp: document.getElementById('vt_temp').value.trim(),
      pulse: document.getElementById('vt_pulse').value.trim(),
      weight: document.getElementById('vt_weight').value.trim(),
    }
  };
  // Guard the index rather than trusting the caller. This used to be
  // `if(idx!==null && idx!==undefined)`, and the New-template button passed the
  // STRING 'null' — which is neither, so it took the edit branch and ran
  // state.visitTemplates['null'] = t. That sets a string property on the array
  // instead of appending: length stays 0, JSON.stringify drops it, and the
  // template vanished on save with a cheerful "Template saved" toast. The
  // picker in the visit form is gated on length > 0, so it never appeared and
  // the whole feature looked removed.
  // Number(null) is 0, not NaN — so a bare Number(idx) turned "no index" into
  // "index 0" and the second template overwrote the first. Empty values are
  // ruled out before converting. Number('null') is NaN, which the integer
  // check then rejects, so the original string-'null' input is also handled.
  const i = (idx === null || idx === undefined || idx === '') ? -1 : Number(idx);
  if(Number.isInteger(i) && i >= 0 && i < state.visitTemplates.length){
    state.visitTemplates[i] = t;
  } else {
    state.visitTemplates.push(t);
  }
  saveSettingsDoc();
  closeModal(); render();
  showToast('Template saved');
}

async function confirmAddFamilyLink(patientId){
  const otherId = state.modal.selectedFamilyId;
  if(!otherId){ showToast('Search and select a patient first'); return; }

  const p = getPatient(patientId);
  if(!p){ showToast('Could not load this patient — reopen their chart and try again'); return; }
  showToast('Linking…');
  try{
    const otherSnap = await getDoc(doc(patientsCol(), otherId));
    if(!otherSnap.exists()){ showToast('That patient could not be found'); return; }
    const otherData = otherSnap.data();
    const myLinks = (p.familyLinks||[]).filter(f=>f.patientId!==otherId);
    myLinks.push({patientId: otherId, name: otherData.name, relation});
    const theirLinks = (otherData.familyLinks||[]).filter(f=>f.patientId!==patientId);
    theirLinks.push({patientId, name: p.name, relation: REVERSE_RELATION[relation]||relation});
    fireWrite(updateDoc(doc(patientsCol(), patientId), {familyLinks: myLinks}), 'Family link');
    fireWrite(updateDoc(doc(patientsCol(), otherId), {familyLinks: theirLinks}), 'Family link');
    Object.assign(p, {familyLinks: myLinks});
    closeModal(); render();
    showToast(`Linked to ${otherData.name}`);
  }catch(e){ console.error('family link failed', e); showToast('Linking failed — check your connection'); }

async function unlinkFamilyMember(patientId, otherId){

  if(!p){ showToast('Could not load this patient — reopen their chart and try again'); return; }
  showToast('Removing link…');
  try{
    const otherSnap = await getDoc(doc(patientsCol(), otherId));
    const myLinks = (p.familyLinks||[]).filter(f=>f.patientId!==otherId);
    // fire-and-forget, exactly like confirmAddFamilyLink — an awaited write
    // never settles offline and would leave this stuck on "Removing link…".
    fireWrite(updateDoc(doc(patientsCol(), patientId), {familyLinks: myLinks}), 'Family link');

    if(otherSnap.exists()){

      fireWrite(updateDoc(doc(patientsCol(), otherId), {familyLinks: theirLinks}), 'Family link');

/* ---- Visit attachments (lab reports): compressed client-side, stored as
   base64 directly on the visit document — no Cloud Storage needed, which
   matters because Firebase now requires the paid Blaze plan for that.
   Trade-off: capped by Firestore's 1MB-per-document limit, so images are
   resized and compressed fairly aggressively before saving. ---- */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image decode failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function handleAttachmentUpload(input){
  const files = Array.from(input.files||[]).filter(f=>f.type.startsWith('image/'));
  if(files.length===0) return;
  if(!state.modal.attachments) state.modal.attachments = [];
  if(state.modal.attachments.length + files.length > MAX_VISIT_ATTACHMENTS){
    showToast(`Up to ${MAX_VISIT_ATTACHMENTS} attachments per visit — remove one first`);
    input.value = ''; return;
  }
  const limit = state.settings.attachmentLimit||0;
  if(limit>0 && (state.settings.attachmentCount||0) + files.length > limit){
    showToast(`This clinic's attachment limit (${limit}) would be exceeded — delete some old attachments under Settings → Manage attachments, or ask your admin to raise the limit.`);
    input.value = ''; return;
  }
  showToast(`Compressing ${files.length} image${files.length>1?'s':''}…`);
  const existingBytes = estimateDocBytes(state.modal.attachments||[]);
  for(const file of files){
    try{
      const dataUrl = await compressImageFile(file, 1400, 0.6);
      const candidate = {dataUrl, filename:file.name, uploadedAt:new Date().toISOString()};
      const projected = estimateDocBytes(state.modal.attachments||[]) + estimateDocBytes(candidate);
      if(projected > DOC_SIZE_SAFE_LIMIT - 50000){ // reserve room for the visit's own text fields
        showToast(`Can't add "${file.name}" — this visit would exceed the ${formatKB(DOC_SIZE_SAFE_LIMIT)} storage limit for a single visit. Remove a photo first, or add it to a separate visit.`);
        break;
      }
      state.modal.attachments.push(candidate);
    }catch(e){ console.error('attachment compress failed', e); showToast(`Couldn't process ${file.name}`); }
  }
  input.value = '';
  refreshAttachmentUI();
  showToast('Attachment(s) added — remember to Save visit');
}

/* Visits written before the Records attachment filter existed have no
   hasAttachments flag, so that filter silently returns none of them. Firestore
   cannot query "array is non-empty", which is the whole reason the flag exists,
   so the only way to find them is to read every visit once. */
async function backfillVisitAttachmentFlags(){
  try{
    const snap = await getDocs(visitsCol());
    const fixes = [];
    snap.docs.forEach(d=>{
      const v = d.data();
      const want = Array.isArray(v.attachments) && v.attachments.length > 0;
      if(v.hasAttachments !== want) fixes.push({ref:d.ref, data:{hasAttachments:want}});
    });
    for(let i=0;i<fixes.length;i+=400){
      const batch = writeBatch(db);
      fixes.slice(i,i+400).forEach(({ref,data})=>batch.update(ref,data));
      await withTimeout(batch.commit(), 20000, 'Visit flag repair');
    }
    if(fixes.length) invalidateRecordsSearchPool();
    return fixes.length;
  }catch(e){ console.error('visit flag backfill failed', e); return 0; }
}
async function repairPatientIndex(){
  return runExclusive('repair-index', 'Rebuilding search index', async (progress)=>{
    showToast('Checking patient records — this may take a moment…');
    try{
      // Deliberately no orderBy here: an orderBy('nameLower') query would
      // silently SKIP any document missing that field — exactly the ones we
      // need to find and fix. A plain collection fetch returns everyone.
      const snap = await getDocs(patientsCol());
      const fixes = [];
      snap.docs.forEach(d=>{
        const p = d.data();
        const wantNameLower = (p.name||'').toLowerCase();
        const wantPhoneNorm = normalizePhone(p.phone||'').replace(/\D/g,'');
        // nameTokens is what makes surname search work. Patients created before
        // it existed have none and are invisible to that query until repaired,
        // so this is the backfill as well as the repair.
        const wantTokens = patientSearchTokens(p.name||'');
        const tokensStale = !Array.isArray(p.nameTokens)
          || p.nameTokens.length !== wantTokens.length
          || wantTokens.some(t => !p.nameTokens.includes(t));
        if(p.nameLower !== wantNameLower || p.phoneNormalized !== wantPhoneNorm || tokensStale){
          fixes.push({ref:d.ref, data:{nameLower:wantNameLower, phoneNormalized:wantPhoneNorm, nameTokens:wantTokens}});
        }
      });
      // No early return when the patients are already clean. This repairs TWO
      // things — patient search fields and the visit attachment flag — and they
      // go stale independently. Bailing out on the patient count meant that once
      // patients were fixed, a second run to repair visits reported "everything
      // already looks correct" and did nothing.
      for(let i=0;i<fixes.length;i+=400){
        const batch = writeBatch(db);
        fixes.slice(i,i+400).forEach(({ref,data})=>batch.update(ref,data));
        await withTimeout(batch.commit(), 20000, 'Index repair');
      }
      if(fixes.length) invalidateSearchPool();
      const visitsFixed = await backfillVisitAttachmentFlags();
      if(fixes.length) await loadPatientsPage(true);
      render();
      if(!fixes.length && !visitsFixed){
        showNotice('Nothing to repair', 'Every patient and visit record already has the fields that search and filters rely on.');
        return;
      }
      const parts = [];
      if(fixes.length) parts.push(`${fixes.length} patient record(s)`);
      if(visitsFixed) parts.push(`${visitsFixed} visit(s)`);
      showNotice('Search index rebuilt', `Fixed ${parts.join(' and ')}. Try searching again.`);
    }catch(e){ console.error('repair patient index failed', e); showToast('Repair failed — ' + (e.message||'check your connection').slice(0,80)); }
  });
}
async function forceRetryMigration(){
  showToast('Checking migration status…');
  try{
    const legacyPatientsSnap = await getDocs(LEGACY_patientsCol);
    const markerSnap = await getDoc(doc(db,'clinicMeta','migrationMarker'));

    if(legacyPatientsSnap.empty && !markerSnap.exists()){
      showToast('No old data found to migrate, and no migration was ever attempted — nothing to do.');
      return;
    }
    if(!markerSnap.exists()){
      showToast(`Found ${legacyPatientsSnap.size} old patient(s) but no migration record — attempting a fresh copy into your current clinic…`);
      await copyLegacyDataIntoClinic(state.clinicId);
    } else {
      const marker = markerSnap.data();
      if(marker.clinicId !== state.clinicId){
        showToast(`Mismatch: your account's clinic (${state.clinicId}) differs from the migration record's clinic (${marker.clinicId}). This needs a manual look — don't guess further, tell your developer this exact message.`);
        return;
      }
      showToast(`Retrying copy of ${legacyPatientsSnap.size} old patient(s) into your clinic…`);
      await copyLegacyDataIntoClinic(state.clinicId);
    }
    // Reload everything fresh so the UI reflects whatever just got copied.
    const clinicSnap = await getDoc(clinicDoc());
    if(clinicSnap.exists()){
      const data = clinicSnap.data();
      state.settings = {...state.settings, ...(data.settings||{})};
      state.tagsList = data.tagsList || [];
    }
    await loadPatientsPage(true);
    render();
    showToast('Retry finished — check your patient list and Settings now. If still empty, tell me exactly what happened.');
  }catch(e){
    console.error('force retry migration failed', e);
    showToast('Retry failed with: ' + (e.code || e.message || 'unknown error') + ' — please copy this exact message and tell me.');
  }
}
async function eraseAllData(){
  return runExclusive('erase-all', 'Erasing all patient data', async (progress)=>{
    try{
      showToast('Erasing all patient data — this may take a moment…');
      const cols = [patientsCol(), visitsCol(), rxCol(), receiptsCol()];
      for(const col of cols){
        let snap = await getDocs(query(col, limit(400)));
        while(!snap.empty){
          const batch = writeBatch(db);
          snap.docs.forEach(d=>batch.delete(d.ref));
          await withTimeout(batch.commit(), 30000, 'Erase');
          snap = await getDocs(query(col, limit(400)));
        }
      }
      state.patients = []; state.visits = []; state.prescriptions = []; state.receipts = [];
      state.recordsVisits = [];
      state._patientCache = {};
      state.settings.nextPatientSeq = 1;
      await saveSettingsDoc();
      state.view = {tab:"patients", screen:"patients-list", patientId:null, visitId:null};
      closeModal(); render();
      invalidateSearchPool();
      invalidateRecordsSearchPool();
      recalculateMyClinicStorage();
      showNotice('All patient data erased', 'Every patient, visit, prescription and receipt in this clinic has been deleted. Staff accounts and settings were kept.', 'warn');
    }catch(e){ console.error('erase all failed', e); showToast('Erase failed partway through — check your connection and try again'); }
  });
}

      if(demoIds.length===0){ closeModal(); showToast('No demo data found'); return; }
      const chunks = [];
      for(let i=0;i<demoIds.length;i+=30) chunks.push(demoIds.slice(i,i+30));
      const allDeleteRefs = patientsSnap.docs.map(d=>d.ref);
      for(const chunk of chunks){
        const [vSnap, rxSnap, rcSnap] = await Promise.all([
          getDocs(query(visitsCol(), where('patientId','in',chunk))),
          getDocs(query(rxCol(), where('patientId','in',chunk))),
          getDocs(query(receiptsCol(), where('patientId','in',chunk)))
        ]);
        vSnap.docs.forEach(d=>allDeleteRefs.push(d.ref));
        rxSnap.docs.forEach(d=>allDeleteRefs.push(d.ref));
        rcSnap.docs.forEach(d=>allDeleteRefs.push(d.ref));
      }
      for(let i=0;i<allDeleteRefs.length;i+=400){
        const batch = writeBatch(db);

  const total = (state.modal.items||[]).reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
  const amountPaid = (state.modal.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const balance = total - amountPaid;
  const status = amountPaid<=0 ? 'unpaid' : (amountPaid>=total ? 'paid' : 'partial');
  const statusLabel = {paid:'Paid', partial:'Partial', unpaid:'Unpaid'}[status];
  const totalEl = document.querySelector('#itemsTotalLine span:last-child');
  if(totalEl) totalEl.textContent = '₹'+total;

// Backward-compatible readers: receipts saved before split-payment support
// only have a single paymentMode string, not a payments array — these
// treat that as a single full payment so old records still display and
// filter correctly without needing a data migration.
function getReceiptPayments(rc){
  if(rc.payments) return rc.payments;
  if(rc.paymentMode) return [{amount:rc.total, method:rc.paymentMode}];
  return [];
}
function getReceiptAmountPaid(rc){
  if(typeof rc.amountPaid==='number') return rc.amountPaid;
  return getReceiptPayments(rc).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
}
function getReceiptStatus(rc){
  if(rc.status) return rc.status;
  const paid = getReceiptAmountPaid(rc);
  if(paid<=0) return 'unpaid';
  if(paid>=rc.total) return 'paid';
  return 'partial';
}
function receiptStatusBadge(rc){
  const status = getReceiptStatus(rc);
  const label = {paid:'Paid', partial:'Partial', unpaid:'Unpaid'}[status];

    : 'background:var(--danger-tint);color:var(--danger);border:1px solid var(--danger)';
  return `<span class="badge" style="${style}">${label}</span>`;
}

   Occupation, but recorded on the VISIT and required, and stamped onto the
   receipt at save time so revenue can be grouped without joining back. ---- */
const UNASSIGNED_DEPT = 'Unassigned';
// Shared by every select-only master-list field (Department, ICD-10, and any
// future one): the input is typeable so a long list can be searched by text
// instead of scrolled, but whatever ends up in the box at save time must
// resolve to something that's actually in the list — free text that merely
// LOOKS like a match (typed "fever" while the dropdown shows three lines
// containing "fever") is not a selection. Case-insensitive, so a user who
// types a different case than what's stored still matches; the canonical
// stored casing is what gets saved, so casing stays consistent regardless of
// how it was typed.
function resolveMasterListValue(listName, typedValue){
  const t = (typedValue||'').trim();
  if(!t) return {ok:true, value:''};
  const hit = (state[listName]||[]).find(v=>v.toLowerCase()===t.toLowerCase());
  return hit ? {ok:true, value:hit} : {ok:false, value:t};
}

function pivotMethodColumns(){
  const list = (state.paymentMethodsList||[]).filter(Boolean);
  return list.length ? list : ['Cash','UPI','Card','Credit'];

// A stable colour per department for the stacked chart. Cycles through a
// palette that deliberately excludes red/teal — teal is the app's own brand
// colour (used for "selected" everywhere) and red already means "unpaid" /

/* ---- Height & BMI ----
   Weight has always been free text ("68 kg", "150 lb"), so BMI parses the
   leading number rather than demanding a clean field, converts pounds when
   the text says so, and returns null instead of guessing when it can't tell.
   A blank BMI is honest; a wrong one is a clinical hazard. */
function parseWeightKg(raw){
  const t = (raw||'').toString().trim();
  if(!t) return null;
  const n = parseFloat(t.replace(/,/g,''));
  if(isNaN(n) || n<=0) return null;
  return /lb|pound/i.test(t) ? n*0.45359237 : n;
}
function parseHeightCm(raw){
  const t = (raw||'').toString().trim();
  if(!t) return null;
  const n = parseFloat(t.replace(/,/g,''));
  if(isNaN(n) || n<=0) return null;
  if(/\bm\b/i.test(t) && n<3) return n*100; // "1.68 m"
  return n;
}
// A visit's height: whatever was recorded on the visit, otherwise the
// patient's last known height carried forward. Children outgrow a stored
// height quickly, which is why the visit value always wins once it exists.
function visitHeightFor(v, p){
  const own = v && v.vitals && v.vitals.height;
  if(own !== undefined && own !== null && own !== '') return own;
  const ph = p && p.heightCm;
  return (ph === undefined || ph === null || ph === '') ? '' : String(ph);
}
function computeBMI(heightRaw, weightRaw){
  const cm = parseHeightCm(heightRaw), kg = parseWeightKg(weightRaw);
  if(!cm || !kg) return null;
  const m = cm/100;
  if(m < 0.3 || m > 2.6) return null; // outside plausible human height — almost certainly a typo
  const bmi = kg/(m*m);
  if(!isFinite(bmi) || bmi<=0 || bmi>200) return null;
  return Math.round(bmi*10)/10;
}
function bmiCategory(bmi){
  if(bmi===null || bmi===undefined) return null;
  if(bmi < 18.5) return 'Underweight';
  if(bmi < 25) return 'Normal';
  if(bmi < 30) return 'Overweight';
  return 'Obese';
}
function bmiChipStyle(cat){
  if(cat==='Normal') return 'background:var(--teal-tint);color:var(--teal-dark)';
  if(cat==='Underweight' || cat==='Overweight') return 'background:var(--amber-tint);color:#8A5A00';
  if(cat==='Obese') return 'background:var(--danger-tint);color:var(--danger)';
  return '';
}
// Live readout while typing in the visit form.
function refreshBMIReadout(){
  const out = document.getElementById('v_bmi_out');
  if(!out) return;
  const h = (document.getElementById('v_height')||{}).value;
  const w = (document.getElementById('v_weight')||{}).value;
  const bmi = computeBMI(h, w);
  if(bmi===null){
    out.textContent = 'Enter height and weight to calculate';
    out.removeAttribute('style');
    out.setAttribute('style','font-size:11.5px;color:var(--ink-soft)');
    return;
  }
  const cat = bmiCategory(bmi);
  out.textContent = `BMI ${bmi} · ${cat}`;
  out.setAttribute('style', `font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;display:inline-block;${bmiChipStyle(cat)}`);
}

/* ---------------- SAVE HANDLERS ---------------- */
function normalizePhone(p){ return (p||"").replace(/[\s\-()]/g,''); }
// Age is never stored as a static number — it's always calculated live from
// date of birth so it stays correct as years pass, with an approximate-age
// fallback for patients whose exact DOB isn't known.
function calcAgeFromDob(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr+'T00:00:00');
  if(isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m<0 || (m===0 && today.getDate()<dob.getDate())) age--;
  return age>=0 ? age : null;
}
/* ---- Blood pressure classification, fully configurable in Settings.
   Categories follow standard AHA staging (same for all adults — not
   age/gender-varying, since that's not how clinical BP categories work).
   The age/gender numbers are a separate reference average shown for
   context, not used to change the color. ---- */
function parseBP(bpStr){
  if(!bpStr) return null;
  const m = /^(\d{2,3})\s*\/\s*(\d{2,3})/.exec(String(bpStr).trim());
  if(!m) return null;
  return {systolic: parseInt(m[1],10), diastolic: parseInt(m[2],10)};
}
function classifyBP(bpStr){
  const parsed = parseBP(bpStr);
  if(!parsed) return null;
  const t = state.settings.bpThresholds || {elevatedSystolic:120, elevatedDiastolic:80, stage1Systolic:130, stage1Diastolic:80, stage2Systolic:140, stage2Diastolic:90};
  const {systolic:s, diastolic:d} = parsed;
  if(s>=t.stage2Systolic || d>=t.stage2Diastolic) return 'stage2';
  if(s>=t.stage1Systolic || d>=t.stage1Diastolic) return 'stage1';
  if(s>=t.elevatedSystolic && d<t.elevatedDiastolic) return 'elevated';
  return 'normal';
}
function bpChipStyle(category){
  if(category==='stage2') return 'background:var(--danger-tint);color:var(--danger)';
  if(category==='stage1') return 'background:#FDE0C4;color:#9A4B0F';
  if(category==='elevated') return 'background:var(--amber-tint);color:var(--amber-ink)';
  return '';
}
function bpCategoryLabel(category){
  return {elevated:'Elevated', stage1:'Stage 1', stage2:'Stage 2'}[category] || '';
}
function getBPAverageForPatient(p){
  if(!p) return null;
  const age = calcAgeFromDob(p.dob) ?? (p.approxAge ? parseInt(p.approxAge,10) : null);
  if(age==null || isNaN(age) || (p.gender!=='Male' && p.gender!=='Female')) return null;
  const band = age<40 ? '18-39' : age<60 ? '40-59' : '60+';
  const table = state.settings.bpAverages;
  return table && table[band] ? table[band][p.gender] : null;
}
/* ---- Vitals trend chart (uses Chart.js loaded via CDN) ---- */
let vitalsChartInstance = null;
function getPatientVitalsSeries(patientId, metric){
  const visits = state.visits.filter(v=>v.patientId===patientId && v.vitals).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const points = [];
  visits.forEach(v=>{
    const vit = v.vitals;
    if(metric==='bp' && vit.bp){
      const parsed = parseBP(vit.bp);
      if(parsed) points.push({date:v.date, systolic:parsed.systolic, diastolic:parsed.diastolic, category:classifyBP(vit.bp)});
    } else if(metric==='weight' && vit.weight){
      const w = parseFloat(vit.weight);
      if(!isNaN(w)) points.push({date:v.date, value:w});
    } else if(metric==='pulse' && vit.pulse){
      const pu = parseFloat(vit.pulse);
      if(!isNaN(pu)) points.push({date:v.date, value:pu});
    } else if(metric==='bmi'){
      // Stored on visits saved from 3.5 onward; recomputed for older ones so
      // the trend doesn't start abruptly at the upgrade date.
      const stored = (vit.bmi!==''&&vit.bmi!==undefined&&vit.bmi!==null) ? Number(vit.bmi) : null;
      const val = (stored!==null && !isNaN(stored)) ? stored : computeBMI(vit.height, vit.weight);
      if(val!==null && !isNaN(val)) points.push({date:v.date, value:val});
    }
  });
  return points;
}
function drawVitalsChart(){
  if(!state.modal || state.modal.type!=='vitals-trend' || !window.Chart) return;
  const canvas = document.getElementById('vitalsCanvas');
  if(!canvas) return;
  if(vitalsChartInstance){ vitalsChartInstance.destroy(); vitalsChartInstance = null; }
  const patientId = state.modal.ctx.patientId;
  const metric = state._vitalsChartMetric || 'bp';
  const points = getPatientVitalsSeries(patientId, metric);
  if(points.length===0) return;
  const labels = points.map(p=>fmtDate(p.date).replace(/, \d{4}/,''));
  let datasets;
  if(metric==='bp'){

    datasets = [
      {label:'Systolic', data:points.map(p=>p.systolic), borderColor:'#2F6F6B', backgroundColor:'#2F6F6B',
        pointBackgroundColor:points.map(p=>catColors[p.category]), pointBorderColor:'#fff', pointBorderWidth:1.5, pointRadius:5, tension:0.3},
      {label:'Diastolic', data:points.map(p=>p.diastolic), borderColor:'#E8A33D', backgroundColor:'#E8A33D', pointRadius:4, tension:0.3}
    ];

/* ---- Analytics dashboard: revenue trend, payment methods, top diagnoses.
   Scoped to the last 6 months to keep the query fast and the chart readable. ---- */
let revenueChartInstance = null;
// The analytics query has no limit() — by design, because a report over a
// partial range is a wrong report, not a truncated one. But that means the
// read cost is the size of the range, and on Spark's 50,000 reads/day a
// twelve-month report at 100 visits/day is ~72,000 reads: it cannot complete,
// and it takes the rest of the clinic's day down with it when it tries.
//
// So count before loading. getCountFromServer bills roughly one read per
// thousand index entries matched, so the pre-flight costs ~2 reads instead of
// the ~72,000 it prevents. Refusing with the real number is more useful than
// a spinner that dies halfway: the user learns their range is too wide and
// what to do about it.
const ANALYTICS_DOC_CAP = 12000;
async function loadAnalyticsData(fromDate, toDate){
  const constraints = [];
  if(fromDate) constraints.push(where('date','>=',fromDate));
  if(toDate) constraints.push(where('date','<=',toDate));
  state._analyticsTooWide = null;
  try{
    const [rcCount, vCount] = await Promise.all([
      getCountFromServer(query(receiptsCol(), ...constraints)),
      getCountFromServer(query(visitsCol(), ...constraints))
    ]);
    const total = rcCount.data().count + vCount.data().count;
    if(total > ANALYTICS_DOC_CAP){
      state._analyticsTooWide = total;
      state._analyticsReceipts = [];
      state._analyticsVisits = [];
      state._analyticsRangeFrom = null;
      state._analyticsRangeTo = null;
      return;
    }
    const [rcSnap, vSnap] = await Promise.all([
      getDocs(query(receiptsCol(), ...constraints)),
      getDocs(query(visitsCol(), ...constraints))
    ]);
    state._analyticsReceipts = rcSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state._analyticsVisits = vSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state._analyticsRangeFrom = fromDate;
    state._analyticsRangeTo = toDate;
    // Drop any chips that no longer exist in the newly loaded range, so a
    // filter left over from a previous report can't silently hide everything.
    const available = analyticsDepartments();
    state._analyticsDepartments = (state._analyticsDepartments||[]).filter(d=>available.includes(d));
  }catch(e){ console.error('analytics load failed', e); showToast('Could not load analytics — check your connection'); }
}
function toggleAnalyticsDepartment(dept){
  const cur = (state._analyticsDepartments || []).slice();
  const i = cur.indexOf(dept);
  if(i>-1) cur.splice(i,1); else cur.push(dept);
  state._analyticsDepartments = cur;
  render();
}
function clearAnalyticsDepartments(){ state._analyticsDepartments = []; render(); }
async function loadAndRenderAnalytics(){
  const fromDate = document.getElementById('analyticsFrom')?.value || '';
  const toDate = document.getElementById('analyticsTo')?.value || '';
  if(!fromDate || !toDate){ showToast('Choose both a start and end date first'); return; }
  if(fromDate > toDate){ showToast('Start date must be before end date'); return; }
  showToast('Loading report…');
  await loadAnalyticsData(fromDate, toDate);
  render();
}
// Every department seen in the loaded range, from both visits and receipts,
// so the filter chips offer exactly what the data contains.
function analyticsDepartments(){
  const set = new Set();
  (state._analyticsVisits||[]).forEach(v=>set.add(departmentOfVisit(v)));
  const vMap = analyticsVisitMap();
  (state._analyticsReceipts||[]).forEach(r=>set.add(departmentOfReceipt(r, vMap)));
  const all = Array.from(set);
  const named = all.filter(d=>d!==UNASSIGNED_DEPT).sort((a,b)=>a.localeCompare(b));
  return all.includes(UNASSIGNED_DEPT) ? named.concat([UNASSIGNED_DEPT]) : named;
}
function analyticsVisitMap(){
  const map = {};
  (state._analyticsVisits||[]).forEach(v=>{ map[v.id] = v; });
  return map;
}
// An empty selection means "everything" rather than "nothing" — a report that
// silently goes blank when you clear the last chip reads as a broken screen.
function selectedDepartments(){
  const sel = state._analyticsDepartments || [];
  return sel.length ? sel : null;
}
function computeAnalytics(){
  const vMap = analyticsVisitMap();
  const sel = selectedDepartments();
  const receipts = (state._analyticsReceipts||[]).filter(r=>!sel || sel.includes(departmentOfReceipt(r, vMap)));
  const visits = (state._analyticsVisits||[]).filter(v=>!sel || sel.includes(departmentOfVisit(v)));
  const monthly = {};
  receipts.forEach(r=>{
    const month = r.date.slice(0,7);
    monthly[month] = (monthly[month]||0) + getReceiptAmountPaid(r);
  });
  const months = Object.keys(monthly).sort();
  const methodTotals = {};
  receipts.forEach(r=>{ getReceiptPayments(r).forEach(p=>{ methodTotals[p.method] = (methodTotals[p.method]||0) + (parseFloat(p.amount)||0); }); });
  const dxCounts = {};
  visits.forEach(v=>{
    const dx = (v.diagnosis||'').trim();
    if(!dx) return;
    const key = dx.toLowerCase();
    if(!dxCounts[key]) dxCounts[key] = {label:dx, count:0};
    dxCounts[key].count++;
  });
  const topDx = Object.values(dxCounts).sort((a,b)=>b.count-a.count).slice(0,8);
  const totalRevenue = Object.values(monthly).reduce((s,v)=>s+v,0);
  // Daily register: per-day payment-method breakdown, for cash reconciliation.
  const daily = {};
  receipts.forEach(r=>{
    if(!daily[r.date]) daily[r.date] = {methods:{}, total:0};
    getReceiptPayments(r).forEach(p=>{
      const amt = parseFloat(p.amount)||0;
      daily[r.date].methods[p.method] = (daily[r.date].methods[p.method]||0) + amt;
      daily[r.date].total += amt;
    });
  });
  const dailyRegister = Object.keys(daily).sort((a,b)=>b.localeCompare(a)).map(date=>({date, ...daily[date]}));
  // Department pivots. Built from the same filtered receipts as everything
  // else, so the slices always add up to the headline figure above them.
  const deptTotals = {};
  const deptMethodTotals = {};   // department -> method -> amount
  const dailyByDept = {};        // date -> department -> {methods, total}
  receipts.forEach(r=>{
    const dept = departmentOfReceipt(r, vMap);
    getReceiptPayments(r).forEach(p=>{
      const amt = parseFloat(p.amount)||0;
      deptTotals[dept] = (deptTotals[dept]||0) + amt;
      if(!deptMethodTotals[dept]) deptMethodTotals[dept] = {};
      deptMethodTotals[dept][p.method] = (deptMethodTotals[dept][p.method]||0) + amt;
      if(!dailyByDept[r.date]) dailyByDept[r.date] = {};
      if(!dailyByDept[r.date][dept]) dailyByDept[r.date][dept] = {methods:{}, total:0};
      dailyByDept[r.date][dept].methods[p.method] = (dailyByDept[r.date][dept].methods[p.method]||0) + amt;
      dailyByDept[r.date][dept].total += amt;
    });
  });
  const deptVisitCounts = {};
  visits.forEach(v=>{ const d = departmentOfVisit(v); deptVisitCounts[d] = (deptVisitCounts[d]||0)+1; });
  // Unpaid orders: every receipt still owed money, partial or fully unpaid.
  const unpaidOrders = receipts.filter(r=>getReceiptStatus(r)!=='paid');
  const unpaidTotal = unpaidOrders.reduce((s,r)=>s+Math.max((r.total||0)-getReceiptAmountPaid(r),0),0);

  // Column order for both pivots below: biggest earner first. Same list
  // either way — "the departments that showed up in this range", already
  // narrowed to the selection — so both tables use identical columns and
  // their grand totals always match each other and the KPI strip above.
  const pivotDepts = Object.keys(deptTotals).sort((a,b)=>deptTotals[b]-deptTotals[a]);

  // Register pivot: date rows, one method-block per department, each block
  // ending in that department's day-total, days with nothing skipped so a
  // long quiet stretch doesn't pad out the table.
  const methodCols = pivotMethodColumns();
  const registerDates = Object.keys(daily).filter(d=>daily[d].total>0).sort();
  const registerRows = registerDates.map(date=>({
    date,
    total: daily[date].total,
    byDept: pivotDepts.map(dept => ({
      dept,
      total: (dailyByDept[date]||{})[dept]?.total || 0,
      methods: methodCols.map(m => (dailyByDept[date]||{})[dept]?.methods[m] || 0)
    }))
  }));
  const registerFooter = pivotDepts.map(dept => ({
    dept,
    total: deptTotals[dept]||0,
    methods: methodCols.map(m => (deptMethodTotals[dept]||{})[m] || 0)
  }));

  // Method-by-department pivot: rows are the methods that were actually
  // used, columns are the same pivotDepts so it reconciles against the
  // register above.
  const usedMethods = Object.keys(methodTotals);
  const methodRows = usedMethods.map(method => ({
    method,
    total: methodTotals[method]||0,
    byDept: pivotDepts.map(dept => (deptMethodTotals[dept]||{})[method] || 0)
  }));
  const methodFooter = pivotDepts.map(dept => deptTotals[dept]||0);

  // Monthly chart, stacked by department — same pivotDepts and colours as
  // the tables, computed from amountPaid (not the ledger `total`) so a
  // partially-paid receipt shows only what's actually in hand, matching the
  // KPI strip above it.
  const monthlyByDept = {}; // month -> dept -> amount
  receipts.forEach(r=>{
    const month = r.date.slice(0,7);
    const dept = departmentOfReceipt(r, vMap);
    if(!monthlyByDept[month]) monthlyByDept[month] = {};
    monthlyByDept[month][dept] = (monthlyByDept[month][dept]||0) + getReceiptAmountPaid(r);
  });

  return {months, monthly, methodTotals, topDx, totalRevenue, dailyRegister, unpaidOrders, unpaidTotal,
          deptTotals, deptMethodTotals, dailyByDept, deptVisitCounts,
          pivotDepts, registerRows, registerFooter, methodRows, methodFooter, monthlyByDept, methodCols};
}

/* ---- Duplicate patient finder: groups patients by exact (normalized)
   name match, lets the doctor pick which record to keep, then reassigns
   every visit/prescription/receipt from the others to it before deleting
   them. Known limitation: family links pointing at a merged-away duplicate
   aren't automatically repointed — rare enough (both features are new) that
   it's not worth the extra complexity yet. ---- */
async function findDuplicatePatients(){
  showToast('Scanning for potential duplicates…');
  try{
    const snap = await getDocs(patientsCol());
    const all = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const groups = {};
    all.forEach(p=>{
      const key = (p.name||'').toLowerCase().trim().replace(/\s+/g,' ');
      if(!key) return;
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    state._duplicateGroups = Object.values(groups).filter(g=>g.length>1);
    state._duplicateKeepChoice = {};
    render();
  }catch(e){ console.error('duplicate scan failed', e); showToast('Scan failed — check your connection'); }
}
function goToDuplicateFinder(){
  state.view = {tab:'settings', screen:'duplicate-finder', patientId:null, visitId:null};
  state._duplicateGroups = null;
  render();
}
function setDuplicateKeepIndex(gi, pi){
  if(!state._duplicateKeepChoice) state._duplicateKeepChoice = {};
  state._duplicateKeepChoice[gi] = pi;
}
async function mergeDuplicateGroup(gi){
  if(blockDeleteWhileOffline('duplicate patients')) return;
  const group = state._duplicateGroups[gi];
  const keepIdx = (state._duplicateKeepChoice && state._duplicateKeepChoice[gi]) || 0;
  const keep = group[keepIdx];
  const others = group.filter((_,i)=>i!==keepIdx);
  showToast('Merging — this may take a moment…');
  try{
    for(const dup of others){
      const [vSnap, rxSnap, rcSnap] = await Promise.all([
        getDocs(query(visitsCol(), where('patientId','==',dup.id))),
        getDocs(query(rxCol(), where('patientId','==',dup.id))),
        getDocs(query(receiptsCol(), where('patientId','==',dup.id)))
      ]);
      const denorm = {patientId:keep.id, patientName:keep.name, patientNameLower:(keep.name||'').toLowerCase(), patientCode:keep.patientCode||'', patientPhone:normalizePhone(keep.phone||'').replace(/\D/g,'')};
      const allRefs = [...vSnap.docs, ...rxSnap.docs, ...rcSnap.docs];
      for(let i=0;i<allRefs.length;i+=400){
        const batch = writeBatch(db);
        allRefs.slice(i,i+400).forEach(d=>batch.update(d.ref, denorm));
        if(i+400>=allRefs.length) batch.delete(doc(patientsCol(), dup.id));
        await withTimeout(batch.commit(), 20000, 'Merge');
      }
      if(allRefs.length===0){
        await withTimeout(deleteDoc(doc(patientsCol(), dup.id)), 20000, 'Merge');
      }
    }
    state._duplicateGroups = state._duplicateGroups.filter((_,i)=>i!==gi);
    invalidateSearchPool();
    await loadPatientsPage(true);
    render();
    showToast(`Merged ${others.length} duplicate(s) into ${keep.name}`);
  }catch(e){ console.error('merge failed', e); showToast('Merge failed partway through — check your connection and try again'); }
}
function renderDuplicateFinder(){
  const groups = state._duplicateGroups;
  if(groups===undefined || groups===null){
    return `<div class="empty-state"><div class="eb">🔍</div><h3>Find duplicate patients</h3><p>Scans every patient for matching names.</p></div>
      <button class="btn btn-primary btn-block" data-h-click="${_h((event,el)=>{ findDuplicatePatients() })}">Scan now</button>`;
  }
  if(groups.length===0){
    return `<div class="empty-state"><div class="eb">✓</div><h3>No duplicates found</h3><p>No two patients currently share the exact same name.</p></div>
      <button class="btn btn-outline btn-block" data-h-click="${_h((event,el)=>{ findDuplicatePatients() })}">Scan again</button>`;
  }
  return groups.map((g,gi)=>`
    <div class="card" style="margin-bottom:14px">
      <div class="name" style="margin-bottom:8px">${escapeHtml(g[0].name)} <span style="font-weight:400;font-size:12px;color:var(--ink-soft)">(${g.length} matches)</span></div>
      ${g.map((p,pi)=>`
        <label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--line)">
          <input type="radio" name="dupKeep${gi}" value="${pi}" ${((state._duplicateKeepChoice&&state._duplicateKeepChoice[gi])||0)===pi?'checked':''} data-h-change="${_h((event,el)=>{ setDuplicateKeepIndex((gi),(pi)) })}">
          <div style="flex:1">
            <div style="font-size:13.5px">${escapeHtml(p.patientCode||'no ID')} · ${escapeHtml(p.phone||'no phone')}${p.city?' · '+escapeHtml(p.city):''}</div>
          </div>
        </label>
      `).join("")}
      <div style="font-size:11px;color:var(--ink-soft);margin-top:8px">Selected record is kept; the other(s) will have their visit history moved over, then be deleted.</div>
      <button class="btn btn-danger btn-block" style="margin-top:8px" data-h-click="${_h((event,el)=>{ mergeDuplicateGroup((gi)) })}">Merge into selected</button>
    </div>
  `).join("") + `<button class="btn btn-outline btn-block" data-h-click="${_h((event,el)=>{ findDuplicatePatients() })}">Scan again</button>`;
}

async function deleteSelectedAttachments(){
  if(blockDeleteWhileOffline('lab report photos')) return;
  const keys = state._attachmentsSelectedIds||[];
  if(keys.length===0) return;
  // Group selected "visitId::index" keys by visit, so each affected visit
  // only loses the specific photos that were selected — not its whole set.
  const byVisit = {};
  keys.forEach(key=>{
    const [visitId, idxStr] = key.split('::');
    if(!byVisit[visitId]) byVisit[visitId] = [];
    byVisit[visitId].push(parseInt(idxStr,10));
  });
  const visitIds = Object.keys(byVisit);
  showToast('Removing selected attachment(s)…');
  try{
    const batchUpdates = [];
    let removedCount = 0;
    visitIds.forEach(visitId=>{
      const v = state._attachmentsList.find(x=>x.id===visitId);
      if(!v) return;
      const indicesToRemove = new Set(byVisit[visitId]);
      const newAttachments = v.attachments.filter((_,idx)=>!indicesToRemove.has(idx));
      removedCount += (v.attachments.length - newAttachments.length);
      batchUpdates.push({ref: doc(visitsCol(), visitId), newAttachments});
      v.attachments = newAttachments; // keep local list in sync immediately
    });
    for(let i=0;i<batchUpdates.length;i+=400){
      const batch = writeBatch(db);
      batchUpdates.slice(i,i+400).forEach(u=>batch.update(u.ref, {attachments:u.newAttachments, hasAttachments:u.newAttachments.length>0}));
      await withTimeout(batch.commit(), 20000, 'Deleting attachments');
    }
    // Sync any cached visit objects elsewhere in the app (e.g. if this visit is also open in a patient's chart)
    visitIds.forEach(visitId=>{
      const cached = getVisit(visitId);
      const updated = state._attachmentsList.find(x=>x.id===visitId);
      if(cached && updated) cached.attachments = updated.attachments;
    });
    // Drop visits that now have zero attachments from this list entirely
    state._attachmentsList = state._attachmentsList.filter(v=>v.attachments.length>0);
    state.settings.attachmentCount = Math.max(0,(state.settings.attachmentCount||0) - removedCount);
    await withTimeout(setDoc(clinicDoc(), {settings:{attachmentCount:state.settings.attachmentCount}}, {merge:true}), 20000, 'Deleting attachments');
    state._attachmentsSelectionMode = false;
    state._attachmentsSelectedIds = [];
    render();
    showToast(`Removed ${removedCount} attachment(s)`);
  }catch(e){ console.error('delete attachments failed', e); showToast('Delete failed partway through — check your connection and try again'); }
}

// Minimal but correct CSV parser: handles quoted fields (including escaped
// "" quotes and embedded commas/newlines inside quotes), which a naive
// split(',') would break on for addresses etc.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field!=='' || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}

async function handlePatientImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const text = await file.text();
  const rows = parseCSV(text);
  if(rows.length<2){ showToast('That file has no data rows'); return; }
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  function findCol(key){
    const aliases = PATIENT_IMPORT_HEADER_ALIASES[key];
    for(let i=0;i<headers.length;i++){ if(aliases.includes(headers[i])) return i; }
    return -1;
  }
  const cols = {};
  Object.keys(PATIENT_IMPORT_HEADER_ALIASES).forEach(k=>{ cols[k] = findCol(k); });
  if(cols.name===-1 || cols.phone===-1){
    showToast('CSV must have at least a Name and Phone column — check the template');
    return;
  }
  const dataRows = rows.slice(1).filter(r=>r.some(v=>v.trim()!==''));
  const parsed = dataRows.map(r=>({
    name: (r[cols.name]||'').trim(),
    phone: (r[cols.phone]||'').trim(),
    dob: cols.dob!==-1 ? (r[cols.dob]||'').trim() : '',
    approxAge: cols.approxAge!==-1 ? (r[cols.approxAge]||'').trim() : '',
    gender: cols.gender!==-1 ? (r[cols.gender]||'').trim() : '',
    city: cols.city!==-1 ? (r[cols.city]||'').trim() : '',
    occupation: cols.occupation!==-1 ? (r[cols.occupation]||'').trim() : '',
    maritalStatus: cols.maritalStatus!==-1 ? (r[cols.maritalStatus]||'').trim() : '',
    bloodGroup: cols.bloodGroup!==-1 ? (r[cols.bloodGroup]||'').trim() : '',
    allergies: cols.allergies!==-1 ? (r[cols.allergies]||'').trim() : '',
    address: cols.address!==-1 ? (r[cols.address]||'').trim() : '',
  }));
  const valid = parsed.filter(p=>p.name && p.phone);
  const invalidCount = parsed.length - valid.length;
  state._patientImportRows = valid;
  state._patientImportInvalidCount = invalidCount;
  state._patientImportDuplicates = null; // checked on confirm, not preview, to avoid a slow scan just for viewing
  render();
}

async function confirmPatientImport(){
  const rows = state._patientImportRows;
  if(!rows || rows.length===0) return;
  return runExclusive('import-patients', `Importing ${rows.length} patient(s)`, async (progress)=>{
  try{
    // Fetch every existing phone number once, rather than one query per row.
    const existingSnap = await getDocs(patientsCol());
    const existingPhones = new Set(existingSnap.docs.map(d=>(d.data().phoneNormalized||'')).filter(Boolean));
    const seenInFile = new Set();
    const toImport = [];
    let skipped = 0;
    rows.forEach(r=>{
      const normalized = normalizePhone(r.phone).replace(/\D/g,'');
      if(!normalized || existingPhones.has(normalized) || seenInFile.has(normalized)){ skipped++; return; }
      seenInFile.add(normalized);
      toImport.push({...r, phoneNormalized: normalized});
    });
    if(toImport.length===0){
      showToast('Nothing to import — every row matched an existing patient by phone number');
      cancelPatientImport(); render();
      return;
    }
    const startSeq = await reservePatientCodeBlock(toImport.length);
    const batchDocs = toImport.map((r, idx)=>{
      const patientCode = 'PT-' + String(startSeq+idx).padStart(4,'0');
      // A CSV is the easiest way to get 10,000-character junk into the
      // database, so imported rows get the same caps as typed ones.
      const cName = clampField(r.name, 'name');
      return {ref: doc(patientsCol()), data: {
        patientCode, createdAt: todayISO(), name: cName, nameLower: cName.toLowerCase(),
        nameTokens: patientSearchTokens(cName),
        dob: r.dob, approxAge: r.approxAge, gender: r.gender,
        phone: clampField(r.phone, 'phone'), phoneNormalized: r.phoneNormalized,
        maritalStatus: r.maritalStatus, occupation: clampField(r.occupation, 'occupation'),
        bloodGroup: r.bloodGroup,
        city: clampField(r.city, 'city'), tags: [],
        allergies: clampField(r.allergies, 'allergies'),
        address: clampField(r.address, 'address'), lastVisitDate: null, _v: 1
      }};
    });
    let written = 0;
    for(let i=0;i<batchDocs.length;i+=400){
      const batch = writeBatch(db);
      batchDocs.slice(i,i+400).forEach(({ref,data})=>batch.set(ref,data));
      await withTimeout(batch.commit(), 30000, 'Import');
      written = Math.min(i+400, batchDocs.length);
      progress(written, batchDocs.length);
    }
    let listsChanged = false;
    toImport.forEach(r=>{
      if(addToReusableListIfNew('occupationsList', r.occupation)) listsChanged = true;
      if(addToReusableListIfNew('citiesList', r.city)) listsChanged = true;
    });
    if(listsChanged) await saveSettingsDoc();
    cancelPatientImport();
    await loadPatientsPage(true);
    render();
    invalidateSearchPool();
    recalculateMyClinicStorage();
    showNotice('Import finished',
      `${toImport.length.toLocaleString()} patient(s) imported.`
      + (skipped>0 ? ` ${skipped.toLocaleString()} row(s) were skipped because the phone number already existed or was missing.` : ''));
  }catch(e){
    console.error('patient import failed', e);
    // Say how far it got. "Failed" on its own invites a fresh import of the
    // whole file; knowing 3,100 landed makes it obvious that re-running is a
    // resume, not a duplicate — which it is, because rows are skipped by phone
    // number.
    const done = (state._busy && state._busy.done) || 0;
    showToast(done
      ? `Import stopped after about ${done.toLocaleString()} patient(s) — run it again to finish. Rows already imported will be skipped.`
      : 'Import failed — check your connection and try again');
    if(done) showNotice('Import stopped partway through',
      `About ${done.toLocaleString()} patient(s) were imported before it stopped. Run the same file again to finish — rows already imported are skipped automatically.`, 'warn');
  }
  });
}
// Same atomic pattern as patient codes, generalized for visits/prescriptions/
// receipts — each gets its own independent counter field in settings.
async function nextSequenceCode(fieldName, prefix){
  if(state._isOffline){
    const code = getNextReservedCode(fieldName, prefix);
    if(code) return code;
    throw new Error('OFFLINE_NO_RESERVED_CODES');
  }
  // navigator.onLine only reports whether a network interface exists — a
  // wifi connection with no actual internet still reads as "online", and
  // runTransaction would then hang indefinitely, freezing the save. Race it
  // against a timeout and fall back to a reserved code if we have one.
  const hasReserve = !!peekReservedCode(fieldName, prefix);
  try{
    return await Promise.race([
      _serverSequenceCode(fieldName, prefix),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('SEQ_TIMEOUT')), 8000))
    ]);
  }catch(e){
    // only now consume a reserved code — never on the happy path
    if(hasReserve) return getNextReservedCode(fieldName, prefix);
    throw e;
  }
}
async function _serverSequenceCode(fieldName, prefix){
  const seq = await runTransaction(db, async (tx)=>{
    const snap = await tx.get(clinicDoc());
    const data = snap.exists() ? snap.data() : {};
    const currentSeq = (data.settings && data.settings[fieldName]) || 1;
    const newSettings = {...(data.settings||state.settings), [fieldName]: currentSeq+1};
    tx.set(clinicDoc(), {...data, settings:newSettings}, {merge:true});
    return currentSeq;
  });
  state.settings[fieldName] = seq+1;
  return prefix + '-' + String(seq).padStart(4,'0');
}
// Shared dedup helper for every reusable typeahead list (occupations,
// cities, tags, medicine fields). Case-insensitive on purpose — "Paracetamol"
// and "paracetamol" should never end up as two separate list entries.
function addToReusableListIfNew(listName, val){
  if(!val) return false;
  if(!state[listName]) state[listName] = [];
  const exists = state[listName].some(v=>v.toLowerCase()===val.toLowerCase());
  if(!exists){ state[listName].push(val); return true; }
  return false;
}

const MASTER_LIST_FIELD_MAP = {

  citiesList: {label:'Cities', kind:'patient-field', field:'city'},
  tagsList: {label:'Tags', kind:'patient-array', field:'tags'},
  medNamesList: {label:'Medicine Names', kind:'rx-nested', subField:'name'},
  dosagesList: {label:'Dosages', kind:'rx-nested', subField:'dosage'},
  frequenciesList: {label:'Frequencies', kind:'rx-nested', subField:'frequency'},
  durationsList: {label:'Durations', kind:'rx-nested', subField:'duration'},
  instructionsList: {label:'Instructions', kind:'rx-nested', subField:'instructions'},
  receiptItemsList: {label:'Receipt Items', kind:'receipt-nested', arrayField:'items', subField:'desc'},
  paymentMethodsList: {label:'Payment Methods', kind:'receipt-nested', arrayField:'payments', subField:'method'},
  departmentsList: {label:'Departments', kind:'visit-field', field:'department'},

  icd10List: {label:'ICD-10 Codes', kind:'visit-field-only', field:'icd10'},

async function renameMasterListEntry(listName, oldValue, newValue){
  newValue = (newValue||'').trim();
  if(!newValue || newValue===oldValue){ closeModal(); return; }
  // Two entries that only differ by case are effectively the same value to
  // every typeahead in the app (which already matches case-insensitively),
  // so letting a rename create one silently produces a list with duplicate
  // options and no way to tell them apart when picking.
  const dup = (state[listName]||[]).some(v => v.toLowerCase()===newValue.toLowerCase() && v!==oldValue);
  if(dup){
    showToast(`"${newValue}" already exists in this list — pick a different name or edit the existing entry instead`);
    return;
  }
  const meta = MASTER_LIST_FIELD_MAP[listName];
  showToast('Updating everywhere this is used — this may take a moment…');
  try{
    let updatedCount = 0;
    if(meta.kind==='patient-field'){
      const snap = await getDocs(query(patientsCol(), where(meta.field,'==',oldValue)));
      for(let i=0;i<snap.docs.length;i+=400){
        const batch = writeBatch(db);
        snap.docs.slice(i,i+400).forEach(d=>batch.update(d.ref, {[meta.field]: newValue}));
        await withTimeout(batch.commit(), 20000, 'Rename');
      }
      updatedCount = snap.docs.length;
    } else if(meta.kind==='patient-array'){
      const snap = await getDocs(query(patientsCol(), where(meta.field,'array-contains',oldValue)));
      for(const d of snap.docs){
        const arr = (d.data()[meta.field]||[]).map(v=>v===oldValue?newValue:v);
        await withTimeout(updateDoc(d.ref, {[meta.field]: arr}), 20000, 'Rename');
      }
      updatedCount = snap.docs.length;
    } else if(meta.kind==='rx-nested'){
      const snap = await getDocs(rxCol());
      for(const d of snap.docs){
        const meds = d.data().medicines||[];
        let changed = false;
        const newMeds = meds.map(m=>{
          if((m[meta.subField]||'')===oldValue){ changed=true; return {...m, [meta.subField]:newValue}; }
          return m;
        });
        if(changed){ await withTimeout(updateDoc(d.ref, {medicines:newMeds}), 20000, 'Rename'); updatedCount++; }
      }
    } else if(meta.kind==='visit-field'){
      // Department lives on the visit AND is stamped onto the receipt at save
      // time (so revenue can be grouped without joining back to visits), so a
      // rename has to reach both or the analytics would split one department
      // across two names.
      const [vSnap, rSnap] = await Promise.all([
        getDocs(query(visitsCol(), where(meta.field,'==',oldValue))),
        getDocs(query(receiptsCol(), where(meta.field,'==',oldValue)))
      ]);
      const allDocs = vSnap.docs.concat(rSnap.docs);
      for(let i=0;i<allDocs.length;i+=400){
        const batch = writeBatch(db);
        allDocs.slice(i,i+400).forEach(d=>batch.update(d.ref, {[meta.field]: newValue}));
        await withTimeout(batch.commit(), 20000, 'Rename');
      }
      updatedCount = allDocs.length;
    } else if(meta.kind==='visit-field-only'){
      // Same as visit-field, but reaches only the visits collection — this
      // dimension was never stamped onto receipts, so there's nothing there
      // to keep in sync.
      const snap = await getDocs(query(visitsCol(), where(meta.field,'==',oldValue)));
      for(let i=0;i<snap.docs.length;i+=400){
        const batch = writeBatch(db);
        snap.docs.slice(i,i+400).forEach(d=>batch.update(d.ref, {[meta.field]: newValue}));
        await withTimeout(batch.commit(), 20000, 'Rename');
      }
      updatedCount = snap.docs.length;
    } else if(meta.kind==='receipt-nested'){
      const snap = await getDocs(receiptsCol());
      for(const d of snap.docs){
        const items = d.data()[meta.arrayField]||[];
        let changed = false;
        const newItems = items.map(it=>{
          if((it[meta.subField]||'')===oldValue){ changed=true; return {...it, [meta.subField]:newValue}; }
          return it;
        });
        if(changed){ await withTimeout(updateDoc(d.ref, {[meta.arrayField]:newItems}), 20000, 'Rename'); updatedCount++; }
      }
    }
    const idx = state[listName].indexOf(oldValue);
    if(idx!==-1) state[listName].splice(idx,1);
    if(!state[listName].some(v=>v.toLowerCase()===newValue.toLowerCase())) state[listName].push(newValue);
    await saveSettingsDoc();
    state._masterListEditingValue = null;
    render();
    showToast(`Renamed — updated ${updatedCount} existing record(s)`);
  }catch(e){ console.error('rename master list entry failed', e); showToast('Update failed partway through — check your connection and try again'); }
}
function deleteMasterListEntry(listName, value){

function importMasterListEntries(listName){
  const raw = document.getElementById('importListTextarea').value;
  // One entry per line when the paste has line breaks — ICD-10 descriptions
  // and plenty of other real values ("Fever, unspecified") contain commas,
  // and splitting on comma would chop those in half. Comma-splitting only
  // kicks in for a single-line paste (e.g. "Cash, UPI, Card"), which is the
  // one case where someone is actually using the comma as a separator.
  const hasLineBreaks = /\n/.test(raw.trim());
  const values = (hasLineBreaks ? raw.split(/\n/) : raw.split(/[\n,]/)).map(v=>v.trim()).filter(Boolean);

  values.forEach(v=>{ if(addToReusableListIfNew(listName, v)) added++; });

async function savePatient(id){
  const name = clampField(document.getElementById('f_name').value.trim(), 'name');
  const phone = clampField(document.getElementById('f_phone').value.trim(), 'phone');
  const errEl = document.getElementById('phoneError');
  errEl.textContent = "";
  if(!name){ showToast('Name is required'); return; }
  const saveKey = 'patient:' + (id||'new');
  if(!beginSave(saveKey)) return; // already saving — ignore the duplicate call
  const saveBtn = document.querySelector('.sheet .btn-primary');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  try{
    const normPhone = phone ? normalizePhone(phone).replace(/\D/g,'') : '';
    if(normPhone){
      const dupSnap = await getDocs(query(patientsCol(), where('phoneNormalized','==',normPhone), limit(2)));
      const duplicate = dupSnap.docs.find(d=>d.id!==id);
      if(duplicate){
        errEl.textContent = `This number is already used by ${duplicate.data().name}.`;
        if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
        endSave(saveKey);
        return;
      }
    }
    const occupationVal = clampField(document.getElementById('f_occupation').value.trim(), 'occupation');
    const cityVal = clampField(document.getElementById('f_city').value.trim(), 'city');
    let listsChanged = false;
    if(addToReusableListIfNew('occupationsList', occupationVal)) listsChanged = true;
    if(addToReusableListIfNew('citiesList', cityVal)) listsChanged = true;
    if(listsChanged) saveSettingsDoc();
    const tags = (state.modal.selectedTags||[]).slice();
    const data = {
      name, nameLower: name.toLowerCase(),
      nameTokens: patientSearchTokens(name),
      dob: document.getElementById('f_dob').value,
      approxAge: document.getElementById('f_approxAge').value,
      gender: document.getElementById('f_gender').value,
      maritalStatus: document.getElementById('f_marital').value,
      occupation: occupationVal,
      phone, phoneNormalized: normPhone,
      bloodGroup: document.getElementById('f_bg').value,
      city: cityVal,
      tags,
      heightCm: parseHeightCm(document.getElementById('f_height').value) || null,
      allergies: clampField(document.getElementById('f_all').value.trim(), 'allergies'),
      address: clampField(document.getElementById('f_addr').value.trim(), 'address'),
    };
    if(id){
      if(state._isOffline){
        const cached = getPatient(id);
        const baseVersion = (cached||{})._v || 0;
        queueOfflineEdit('patient', id, data, baseVersion);
        if(cached) Object.assign(cached, data);
        const idx = state.patients.findIndex(p=>p.id===id);
        if(idx>-1) state.patients[idx] = {...state.patients[idx], ...data};
      } else {
        fireWrite(updateDoc(doc(patientsCol(), id), {...data, _v: increment(1)}), 'Patient');
        // Mirror the server's increment locally. Nothing re-reads this record
        // during the session (there are no snapshot listeners), so without
        // this the cached _v stays behind and the NEXT offline edit queues a
        // stale baseVersion that always false-conflicts on sync.
        const cached = getPatient(id);
        const nextV = ((cached||{})._v || 0) + 1;
        if(cached) Object.assign(cached, data, {_v: nextV});
        const idx = state.patients.findIndex(p=>p.id===id);
        if(idx>-1) state.patients[idx] = {...state.patients[idx], ...data, _v: nextV};
      }
    } else {
      const patientCode = await nextPatientCode();
      const newDocData = {...data, patientCode, createdAt:todayISO(), lastVisitDate:null, _v:1};
      const ref = doc(patientsCol());
      fireWrite(setDoc(ref, newDocData), 'Patient');
      const p = {id:ref.id, ...newDocData};
      cachePatient(p);
      state.patients.unshift(p);
      state.view.patientId = p.id;
    }
    closeModal();
    if(!id){ state.view.screen='patient-detail'; render(); } else { render(); }
    invalidateSearchPool();
    bumpOfflinePendingCount();
    showToast('Patient saved');
  }catch(e){
    console.error('save patient failed', e);
    showToast('Save failed — check your connection');
    if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
  }finally{
    endSave(saveKey);
  }
}
// Deletes are the one operation the conflict engine cannot make safe offline:
// they cascade to linked records and there is no version to compare on a
// document that no longer exists, so an offline delete would silently destroy
// whatever another device edited in the meantime. Refuse rather than lose data.
function blockDeleteWhileOffline(what){
  if(!state._isOffline) return false;
  showToast(`Deleting ${what} needs a connection — it also removes linked records, and offline it can't be checked against other devices. Try again once you're back online.`);
  return true;
}
async function deletePatient(id){
  if(blockDeleteWhileOffline('a patient')) return;
  lockSheetButtons('Deleting…');
  try{
    const [vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(query(visitsCol(), where('patientId','==',id))),
      getDocs(query(rxCol(), where('patientId','==',id))),
      getDocs(query(receiptsCol(), where('patientId','==',id)))
    ]);
    const batch = writeBatch(db);
    vSnap.docs.forEach(d=>batch.delete(d.ref));
    rxSnap.docs.forEach(d=>batch.delete(d.ref));
    rcSnap.docs.forEach(d=>batch.delete(d.ref));
    batch.delete(doc(patientsCol(), id));
    fireWrite(batch.commit(), 'Patient deletion');
    delete state._patientCache[id];
    state.patients = state.patients.filter(p=>p.id!==id);
    state.visits = []; state.prescriptions = []; state.receipts = [];
    closeModal();
    state.view = {tab:'patients',screen:'patients-list',patientId:null,visitId:null};
    render();
    invalidateSearchPool();
    showToast('Patient deleted');
  }catch(e){ console.error('delete patient failed', e); showToast('Delete failed — check your connection'); unlockSheetButtons(); }
}
async function recomputePatientLastVisit(patientId){
  const dates = state.visits.filter(v=>v.patientId===patientId).map(v=>v.date).filter(Boolean).sort();
  const last = dates.length ? dates[dates.length-1] : null;
  fireWrite(updateDoc(doc(patientsCol(), patientId), {lastVisitDate:last}), 'Last-visit date');
  const cached = getPatient(patientId);
  if(cached) cached.lastVisitDate = last;
  const idx = state.patients.findIndex(p=>p.id===patientId);
  if(idx>-1) state.patients[idx] = {...state.patients[idx], lastVisitDate:last};
}
/* When a booked patient actually turns up, the visit that gets created is
   attached to the appointment that brought them. The appointment keeps the
   promise; the visit records what happened. Linking them is what makes a
   no-show countable: confirmed, date passed, visitId still empty. */
async function attachVisitToAppointment(appointmentId, visitId, patientId){
  if(!appointmentId || !visitId) return;
  try{
    await withTimeout(updateDoc(doc(appointmentsCol(), appointmentId),
      { visitId, patientId: patientId || '', status:'Arrived',
        arrivedAt: new Date().toISOString() }),
      15000, 'attach visit to appointment');
  }catch(e){
    // A failure here must not lose the visit — the clinical record is the
    // thing that matters and it is already saved. The link is reporting.
    console.error('attachVisitToAppointment failed', e && e.code);
  }
}

  }

async function saveVisit(patientId, editId){
  const p = getPatient(patientId) || {};
  const oldAttachmentCount = editId ? ((getVisit(editId)||{}).attachments||[]).length : 0;
  const newAttachmentCount = (state.modal.attachments || []).length;
  const deptTyped = clampField(document.getElementById('v_dept').value.trim(), 'department');
  const deptMatch = resolveMasterListValue('departmentsList', deptTyped);
  if(!deptTyped){
    showToast('Pick a department before saving — every visit needs one for the revenue reports');
    const deptInput = document.getElementById('v_dept');
    if(deptInput) deptInput.focus();
    return;
  }
  if(!deptMatch.ok){
    showToast(`"${deptTyped}" isn't a department in the list — clear this field or pick one of the suggestions`);
    const deptInput = document.getElementById('v_dept');
    if(deptInput){ deptInput.focus(); onDepartmentInput(deptTyped); }
    return;
  }
  const department = deptMatch.value;
  const icd10Typed = clampField((document.getElementById('v_icd10')||{}).value.trim(), 'icd10');
  const icd10Match = resolveMasterListValue('icd10List', icd10Typed);
  if(!icd10Match.ok){
    showToast(`"${icd10Typed}" isn't a code in the list — clear this field or pick one of the suggestions`);
    const icdInput = document.getElementById('v_icd10');
    if(icdInput){ icdInput.focus(); onIcd10Input(icd10Typed); }
    return;
  }
  const icd10 = icd10Match.value;
  const heightRaw = (document.getElementById('v_height')||{}).value || '';
  const heightCm = parseHeightCm(heightRaw);
  const weightRaw = document.getElementById('v_weight').value.trim();
  const bmi = computeBMI(heightRaw, weightRaw);
  const data = {
    date: document.getElementById('v_date').value || todayISO(),
    department,
    chiefComplaint: clampField(document.getElementById('v_cc').value.trim(), 'chiefComplaint'),
    diagnosis: clampField(document.getElementById('v_dx').value.trim(), 'diagnosis'),
    icd10, // may be '' — this field is entirely optional, unlike department
    notes: clampField(document.getElementById('v_notes').value.trim(), 'notes'),
    vitals:{
      bp: clampField(document.getElementById('v_bp').value.trim(), 'bp'),
      temp: clampField(document.getElementById('v_temp').value.trim(), 'temp'),
      pulse: clampField(document.getElementById('v_pulse').value.trim(), 'pulse'),
      weight: clampField(weightRaw, 'weight'),
      height: heightCm ? String(heightCm) : '',
      bmi: bmi === null ? '' : bmi,
    },
    attachments: state.modal.attachments || [],
    // Firestore cannot ask "is this array non-empty", so the Records filter
    // needs a plain boolean it can match on. Written from the array every time
    // the array is written, so the two cannot drift.
    hasAttachments: (state.modal.attachments || []).length > 0,
    patientName: p.name||'', patientNameLower: (p.name||'').toLowerCase(),
    patientCode: p.patientCode||'', patientPhone: normalizePhone(p.phone||'').replace(/\D/g,'')
  };
  // Refuse oversized visits BEFORE touching the network, with a message that
  // says what's actually wrong and reassures that nothing has been lost.
  const sizeProblem = checkVisitDocSize(data);
  if(sizeProblem){ showToast(sizeProblem); return; }
  const _k = 'visit:'+(editId||'new');
  if(!beginSave(_k)) return;
  lockSheetButtons('Saving…');
  try{
    if(editId){
      if(state._isOffline){
        const baseVersion = (getVisit(editId)||{})._v || 0;
        queueOfflineEdit('visit', editId, data, baseVersion);
        patchVisitEverywhere(editId, data);
      } else {
        fireWrite(updateDoc(doc(visitsCol(), editId), {...data, _v: increment(1)}), 'Visit');
        const _cur = getVisit(editId) || {};
        patchVisitEverywhere(editId, {...data, _v: (_cur._v||0)+1});
      }
    } else {
      const visitCode = await nextSequenceCode('nextVisitSeq', 'V');
      const newData = {patientId, visitCode, createdAt:todayISO(), _v:1, ...data};
      const ref = doc(visitsCol());
      fireWrite(setDoc(ref, newData), 'Visit');
      const v = {id:ref.id, ...newData};
      state.visits.push(v);
      state.view.visitId = v.id;
    }
    if(newAttachmentCount!==oldAttachmentCount){
      state.settings.attachmentCount = Math.max(0,(state.settings.attachmentCount||0) + (newAttachmentCount-oldAttachmentCount));
      setDoc(clinicDoc(), {settings:{attachmentCount:state.settings.attachmentCount}}, {merge:true}).catch(e=>console.error('attachment count sync failed', e));
    }
    // The height measured at a visit is the newest one we have, so the
    // patient's record follows it — otherwise a growing child's stored height
    // would go stale and every future BMI would be quietly wrong.
    if(heightCm && Number(p.heightCm||0) !== heightCm){
      fireWrite(updateDoc(doc(patientsCol(), patientId), {heightCm}), 'Patient height');
      const cachedP = getPatient(patientId);
      if(cachedP) cachedP.heightCm = heightCm;
      const pi = state.patients.findIndex(x=>x.id===patientId);
      if(pi>-1) state.patients[pi] = {...state.patients[pi], heightCm};
    }
    recomputePatientLastVisit(patientId);
    closeModal();
    if(!editId){ state.view.screen='visit-detail'; }
    render();
    bumpOfflinePendingCount();
    showToast('Visit saved');
  }catch(e){ console.error('save visit failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
  finally{ endSave(_k); }
}

async function saveReceipt(visitId, existingId){
  const items = state.modal.items
    .filter(i=>i.desc.trim() && i.amount!=="")
    .map(i=>({...i, desc: clampField(i.desc.trim(), 'itemDesc')}));
  if(items.length===0){ showToast('Add at least one item'); return; }
  let listsChanged = false;
  items.forEach(it=>{ if(addToReusableListIfNew('receiptItemsList', it.desc.trim())) listsChanged = true; });
  if(listsChanged) saveSettingsDoc();
  const total = items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const payments = (state.modal.payments||[]).filter(p=>p.amount!=="" && parseFloat(p.amount)>0);
  const amountPaid = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const status = amountPaid<=0 ? 'unpaid' : (amountPaid>=total ? 'paid' : 'partial');
  const v = getVisit(visitId);
  if(!v){ showToast('Could not load this visit — reopen it and try again'); return; }
  const p = getPatient(v.patientId) || {};
  const data = {
    visitId, visitCode: v.visitCode||'', patientId: v.patientId, date: v.date, items, total,
    // Stamped from the visit so revenue can be grouped by department without
    // loading every visit in the range first.
    department: v.department || '',
    payments, amountPaid, status,
    patientName: p.name||'', patientNameLower: (p.name||'').toLowerCase(),
    patientCode: p.patientCode||'', patientPhone: normalizePhone(p.phone||'').replace(/\D/g,'')
  };
  const _k = 'receipt:'+(existingId||visitId);
  if(!beginSave(_k)) return;
  lockSheetButtons('Saving…');
  try{
    let receiptCode;
    if(existingId){
      const existing = state.receipts.find(r=>r.id===existingId) || {};
      receiptCode = existing.receiptCode;
      if(state._isOffline){
        queueOfflineEdit('receipt', existingId, data, existing._v || 0);
        Object.assign(existing, data);
      } else {
        fireWrite(updateDoc(doc(receiptsCol(), existingId), {...data, _v: increment(1)}), 'Receipt');
        Object.assign(existing, data, {_v: (existing._v||0)+1});
      }
    } else {
      receiptCode = await nextSequenceCode('nextReceiptSeq', 'RC');
      const ref = doc(receiptsCol());
      fireWrite(setDoc(ref, {...data, receiptCode, _v:1}), 'Receipt');
      state.receipts.push({id:ref.id, ...data, receiptCode, _v:1});
    }
    const visitSync = {hasReceipt:true, receiptCode, receiptStatus:status, receiptTotal:total, receiptAmountPaid:amountPaid};
    fireWrite(updateDoc(doc(visitsCol(), visitId), visitSync), 'Visit link');
    patchVisitEverywhere(visitId, visitSync);
    bumpOfflinePendingCount();
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Receipt saved');
  }catch(e){ console.error('save receipt failed', e); showToast('Save failed — check your connection'); unlockSheetButtons(); }
  finally{ endSave(_k); }
}
