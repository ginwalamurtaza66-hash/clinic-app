/* ---------------- PATIENT ID CARD SCANNER ----------------
   The printed ID card carries a QR of the patient's code (P-0001). Until now
   nothing could read one, so the QR was decoration — you had to read the code
   off the card and type it into search.

   Two decoders, deliberately:
     - BarcodeDetector is native, hardware-accelerated and costs nothing to
       ship. It exists in Chrome on Android, which is what the clinic uses.
     - jsQR is the fallback for everything else — desktop Chrome on Linux and
       Windows do NOT have BarcodeDetector, and neither does any iOS browser.
       It is vendored and precached so scanning still works offline.

   Everything stays on the device. No frame is uploaded anywhere. */
let _scanStream = null, _scanRAF = null, _scanDetector = null, _scanBusy = false;

function scannerSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

async function openScanner(){
  if(!scannerSupported()){
    showToast('This device has no camera the app can use — search by name or code instead');
    return;
  }
  state.modal = {type:'scan-card', status:'starting', error:''};
  render();
  try{
    _scanStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: 'environment'}}, audio: false
    });
  }catch(e){
    // Distinguish "you said no" from "there is no camera": the first is
    // recoverable by the user, the second is not, and telling someone to
    // check permissions they already granted wastes their time.
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    console.error('camera open failed', e && e.name);
    state.modal = {type:'scan-card', status:'error',
      error: denied
        ? 'Camera access was blocked. Allow camera for this site in your browser settings, then try again.'
        : 'No camera available on this device. Search by name or patient code instead.'};
    render();
    return;
  }
  // getUserMedia can take a second or two on a cold camera, and the modal can
  // be dismissed while we wait. The stream then arrives with nowhere to go —
  // stopScanner() has already run and found nothing to stop, so without this
  // check the camera stays live forever.
  if(!state.modal || state.modal.type !== 'scan-card'){
    _scanStream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
    _scanStream = null;
    return;
  }
  state.modal.status = 'scanning';
  render();
  const video = document.getElementById('scanVideo');
  if(!video){ stopScanner(); return; }
  video.srcObject = _scanStream;
  video.setAttribute('playsinline','');   // iOS refuses to inline-play without this
  try{ await video.play(); }catch(e){ /* autoplay policy — the loop below still reads frames */ }

  if(window.BarcodeDetector){
    try{ _scanDetector = new window.BarcodeDetector({formats:['qr_code']}); }
    catch(e){ _scanDetector = null; }
  }
  _scanBusy = false;
  _scanRAF = requestAnimationFrame(scanTick);
}

async function scanTick(){
  const video = document.getElementById('scanVideo');
  if(!video || !_scanStream){ return; }
  if(!_scanBusy && video.readyState >= 2 && video.videoWidth > 0){
    _scanBusy = true;
    let text = null;
    try{
      if(_scanDetector){
        const found = await _scanDetector.detect(video);
        if(found && found.length) text = found[0].rawValue;
      } else if(window.jsQR){
        const c = document.getElementById('scanCanvas');
        const w = video.videoWidth, h = video.videoHeight;
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', {willReadFrequently:true});
        ctx.drawImage(video, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        const res = window.jsQR(img.data, w, h, {inversionAttempts:'dontInvert'});
        if(res && res.data) text = res.data;
      }
    }catch(e){ /* a bad frame is normal; keep scanning */ }
    _scanBusy = false;
    if(text){ onScanResult(String(text).trim()); return; }
  }
  _scanRAF = requestAnimationFrame(scanTick);
}

function stopScanner(){
  if(_scanRAF){ cancelAnimationFrame(_scanRAF); _scanRAF = null; }
  if(_scanStream){ _scanStream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); _scanStream = null; }
  _scanDetector = null; _scanBusy = false;
}

function closeScanner(){
  stopScanner();
  state.modal = null;
  render();
}

async function onScanResult(code){
  stopScanner();
  state.modal = {type:'scan-card', status:'looking-up', error:''};
  render();
  const p = await findPatientByCode(code);
  if(!p){
    state.modal = {type:'scan-card', status:'error',
      error: `No patient found for code ${code}. This card may belong to another clinic, or the patient may have been deleted.`};
    render();
    return;
  }
  state.modal = null;
  openPatient(p.id);
}

async function findPatientByCode(code){
  const wanted = String(code).trim().toLowerCase();
  if(!wanted) return null;
  // Cache first, so a scan resolves instantly and works offline for any
  // patient already loaded — which, after Prepare for Offline Day, is all
  // of them.
  const cached = Object.values(state._patientCache||{})
    .find(p => (p.patientCode||'').toLowerCase() === wanted);
  if(cached) return cached;
  try{
    await ensureSearchPool();
    const pooled = (state._searchPool||[])
      .find(p => (p.patientCode||'').toLowerCase() === wanted);
    if(pooled){ cachePatient(pooled); return pooled; }
  }catch(e){ console.error('scan pool lookup failed', e); }
  try{
    const snap = await withTimeout(
      getDocs(query(patientsCol(), where('patientCode','==',String(code).trim()), limit(1))),
      15000, 'Looking up card');
    if(!snap.empty){
      const d = snap.docs[0];
      const p = {id:d.id, ...d.data()};
      cachePatient(p);
      return p;
    }
  }catch(e){ console.error('scan code lookup failed', e); }
  return null;
}

function generateQRDataURL(text){
  return new Promise((resolve)=>{
    if(!window.QRCode){ resolve(null); return; }
    const container = document.createElement('div');
    container.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(container);
    try{
      new QRCode(container, {text, width:220, height:220, correctLevel: QRCode.CorrectLevel.M});
    }catch(e){ console.error('QR generation failed', e); document.body.removeChild(container); resolve(null); return; }
    setTimeout(()=>{
      const canvas = container.querySelector('canvas');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
      document.body.removeChild(container);
      resolve(dataUrl);
    }, 150);
  });
}

// Consolidated multi-visit outstanding-balance report, built from whatever
// visits the doctor selected in the Records tab. Shared via the native
// share sheet (WhatsApp, Mail, or anything else installed) with the PDF
// already attached where that's supported, falling back to a plain
// download otherwise.
async function generatePendingReport(){
  const ids = state._recordsSelectedIds||[];
  if(ids.length===0){ showToast('Select at least one visit first'); return; }
  const visits = state.recordsVisits.filter(v=>ids.includes(v.id));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = letterheadBlock(doc, 18);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(21,43,43);
  doc.text('Outstanding Payments Report', 15, y); y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,98);
  doc.text(`Generated: ${fmtDate(todayISO())} · ${visits.length} visit(s)`, 15, y); y += 9;
  doc.setTextColor(21,43,43);
  doc.setDrawColor(224,230,226); doc.line(15,y,195,y); y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Patient', 15, y); doc.text('Visit', 95, y); doc.text('Date', 130, y); doc.text('Balance', 195, y, {align:'right'});
  y += 5; doc.setFont('helvetica','normal');
  doc.line(15,y,195,y); y += 6;
  let total = 0;
  visits.sort((a,b)=>a.date.localeCompare(b.date)).forEach(v=>{
    const balance = Math.max((v.receiptTotal||0)-(v.receiptAmountPaid||0),0);
    total += balance;
    doc.setFontSize(9.5);
    doc.text(`${v.patientName||'—'} ${v.patientCode?'('+v.patientCode+')':''}`, 15, y);
    doc.text(v.visitCode||'—', 95, y);
    doc.text(fmtDate(v.date).replace(/, \d{4}/,''), 130, y);
    doc.text(`Rs. ${balance}`, 195, y, {align:'right'});
    y += 7;
    if(y>270){ doc.addPage(); y=20; }
  });
  doc.line(15,y,195,y); y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
  doc.text('TOTAL OUTSTANDING', 15, y); doc.text(`Rs. ${total}`, 195, y, {align:'right'});

  const filename = `Outstanding_Report_${todayISO()}.pdf`;
  const blob = doc.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  const shareText = `Outstanding payments report — ${visits.length} visit(s), total Rs. ${total}`;
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename, text:shareText});

/* ---------------- UTIL ---------------- */
// Chrome's HTML preload scanner reads the raw bytes of the page, including the
// text inside this inline module, and eagerly fetches anything shaped like an
// image tag with a source attribute — which meant three 404s for literal
// template placeholders on every cold load. Building the attribute through
// this helper keeps that shape out of the source text entirely.
// (Note: do not write that tag out literally anywhere in this file, not even
// in a comment — the scanner does not know it is reading a comment.)
function imgSrc(url){ return 'src="' + escapeAttr(url) + '"'; }
function escapeHtml(s){ if(s===undefined||s===null) return ""; return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
// For values interpolated INSIDE a JS string literal that itself sits inside
// an HTML attribute, e.g.  data-h-click="${_h((event,el)=>{ doThing((...)) })}".
// escapeHtml alone is NOT enough there: it turns ' into &#39;, and the HTML
// parser decodes that back into a real quote BEFORE the JS is parsed — so the
// value breaks out of the string and executes. (Verified exploitable.)
// This makes the text a valid JS string literal first, then HTML-escapes it,
// so it survives entity-decoding still safely quoted. Also fixes the plain
// functional bug where a patient legitimately named O'Brien broke the page.
function escapeJsAttr(s){
  if(s===undefined||s===null) return "";
  return escapeHtml(String(s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r?\n/g,'\\n'));
}
/* ---------- CSP-safe event delegation ----------
   Inline on*="…" attributes force CSP to allow 'unsafe-inline', and they
   also require user data to be escaped into a JS string (the AUD-001 XSS).
   Instead, every handler is registered as a real closure here and the
   element just carries its index in data-h-<type>. Nothing is ever parsed
   from a string, so there is no eval, no 'unsafe-inline' requirement, and
   no way for record data to become executable code — the closure captures
   live values directly. */
let _hReg = [];
function _h(fn){ _hReg.push(fn); return _hReg.length - 1; }
function _hReset(){ _hReg = []; }
['click','change','input','keydown','mousedown','focus','blur'].forEach(type=>{
  // capture:true — focus/blur do not bubble, and it keeps ordering consistent
  document.addEventListener(type, (event)=>{
    const t = event.target;
    if(!t || typeof t.closest !== 'function') return;
    const el = t.closest('[data-h-'+type+']');
    if(!el) return;
    // Nothing is clickable while a bulk operation runs. Disabling one button
    // is not enough: a second import can be started from a different screen,
    // and the overlay can be tapped through on some browsers. This is the one
    // place every interaction passes through, so it is the only place the
    // guard cannot be forgotten.
    if(state._busy && type !== 'focus' && type !== 'blur'){
      event.preventDefault(); event.stopPropagation();
      return;
    }
    const fn = _hReg[+el.getAttribute('data-h-'+type)];
    if(typeof fn === 'function'){
      try{ fn(event, el); }
      catch(err){ console.error('handler failed', type, err); }
    }
  }, true);
});
// Guard against duplicate records from double-taps, slow networks, or any
// path that doesn't go through a real button click. Disabling the button
// alone is not enough — it only stops a literal second click.
// Firestore hard-limits a document to 1,048,576 bytes. Lab-report photos are
// stored inline as base64 on the visit, so a visit with several attachments
// can genuinely exceed it — at which point the write throws and the doctor
// previously saw only "Save failed — check your connection", which is both
// wrong and dangerous (they retry, fail again, and can lose the whole visit's
// notes). We check before writing and say exactly what's wrong.
const FIRESTORE_DOC_LIMIT = 1048576;
const DOC_SIZE_SAFE_LIMIT = 900000; // headroom for Firestore's own overhead/indexes
function estimateDocBytes(obj){
  try{ return new Blob([JSON.stringify(obj)]).size; }
  catch(e){ return JSON.stringify(obj).length; }
}
function formatKB(bytes){ return Math.round(bytes/1024) + ' KB'; }
// Returns null if safe, or a human-readable reason if the visit is too big.
function checkVisitDocSize(data){
  const bytes = estimateDocBytes(data);
  if(bytes <= DOC_SIZE_SAFE_LIMIT) return null;
  const attachCount = (data.attachments||[]).length;
  const attachBytes = estimateDocBytes(data.attachments||[]);
  return `This visit is ${formatKB(bytes)} — too large to save (limit is about ${formatKB(DOC_SIZE_SAFE_LIMIT)}).`
    + (attachCount ? ` The ${attachCount} lab report photo(s) account for ${formatKB(attachBytes)}. Remove one or two photos and save again — your notes are still here.` : '');
}
const _saveInFlight = new Set();
// Firestore write promises resolve only when the SERVER acknowledges them.
// Offline they never resolve at all — so `await addDoc(...)` leaves the UI
// stuck on "Saving…" forever even though the write is already safely in the
// local cache and will sync on reconnect. (That's why the record appeared
// after a reload.) We fire-and-forget instead: local state updates
// immediately, which is also what makes offline feel instant, and genuine
// failures surface as a toast rather than a frozen screen.
function fireWrite(promise, what){
  Promise.resolve(promise).catch(e=>{
    console.error('deferred write failed', what, e && e.code);
    const msg = (e && e.code==='permission-denied')
      ? `${what} couldn't be saved — you may not have permission.`
      : `${what} couldn't reach the server yet — it will sync when you reconnect.`;
    showToast(msg);
  });
}
function beginSave(key){
  if(_saveInFlight.has(key)) return false;
  _saveInFlight.add(key);
  return true;
}
function endSave(key){ _saveInFlight.delete(key); }
// Caps on free-text fields. Firestore allows ~1MB per document, but nothing
// clinical needs thousands of characters in a name, and unbounded input is
// how a single record silently bloats storage or breaks layout.
const FIELD_MAX = { name:120, phone:30, city:80, occupation:80, address:400,
  allergies:500, chiefComplaint:500, diagnosis:500, notes:5000, advice:2000,
  medName:200, dosage:100, frequency:100, duration:100, instructions:300, itemDesc:200,
  bp:20, temp:12, pulse:12, weight:12, height:8, department:80, icd10:140 };
function clampField(v, key){
  const max = FIELD_MAX[key] || 500;
  const s = (v===undefined||v===null) ? '' : String(v);
  return s.length > max ? s.slice(0, max) : s;
}
// Lightweight, safe markdown renderer for AI output: escapes everything
// first (so nothing the AI returns can inject real HTML), then converts a
// small set of markdown patterns to formatting tags on top of the already-
// escaped text.
function mdToHtml(text){
  let safe = escapeHtml(text||'');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  safe = safe.replace(/(^|[\s(])\*(?!\s)(.+?)(?<!\s)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  const lines = safe.split('\n');
  let html = '', listType = null;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*•]\s+(.*)/);
    const numbered = raw.match(/^\s*\d+[\.\)]\s+(.*)/);
    if(bullet){
      if(listType!=='ul'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ul style="margin:4px 0 4px 18px;padding:0">'; listType='ul'; }
      html += `<li style="margin-bottom:2px">${bullet[1]}</li>`;
    } else if(numbered){
      if(listType!=='ol'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ol style="margin:4px 0 4px 18px;padding:0">'; listType='ol'; }
      html += `<li style="margin-bottom:2px">${numbered[1]}</li>`;
    } else {
      if(listType){ html += listType==='ul'?'</ul>':'</ol>'; listType=null; }
      html += raw.trim()==='' ? '<div style="height:6px"></div>' : `<div style="margin:2px 0">${raw}</div>`;
    }
  }
  if(listType) html += listType==='ul'?'</ul>':'</ol>';
  return html;
}

function armExitGuard(){
  history.pushState({guard:true}, '', location.href);

}
function onPopState(){
  if(!exitGuardActive) return; // user already chose to exit — let this one through
  history.pushState({guard:true}, '', location.href); // re-arm the trap
  if(state.modal && state.modal.type !== 'confirm-exit'){
    closeModal(); // back closes an open form/sheet first, like a normal app
    return;
  }
  if(state.view.screen==='visit-detail' || state.view.screen==='patient-detail'){
    goBack(); // back steps up through the app's own navigation first
    return;
  }
  if(state.view.tab!=='patients'){

    return;
  }
  openModal('confirm-exit');
}
