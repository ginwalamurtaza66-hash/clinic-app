<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Clinic Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F3F5F2;
    --card:#FFFFFF;
    --ink:#152B2B;
    --ink-soft:#5C6E6C;
    --line:#E0E6E2;
    --teal:#2F6F6B;
    --teal-dark:#1E4A47;
    --teal-tint:#E6EEEC;
    --amber:#E8A33D;
    --amber-tint:#FBF0DC;
    --danger:#C1443C;
    --danger-tint:#FBE9E7;
    --radius:14px;
    --shadow: 0 1px 2px rgba(21,43,43,0.06), 0 4px 14px rgba(21,43,43,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
  .app-shell{display:flex; flex-direction:column; min-height:100vh;}
  .app-content{display:flex; flex-direction:column; flex:1; min-width:0; order:1;}

  /* Top bar */
  .topbar{
    padding:18px 18px 14px;
    background:linear-gradient(180deg, var(--teal-dark), var(--teal));
    color:#fff;
    position:sticky; top:0; z-index:20;
  }
  .topbar .clinic-name{font-size:20px; font-weight:600; letter-spacing:0.2px;}
  .topbar .doctor-name{font-size:12.5px; opacity:0.85; margin-top:2px;}
  .topbar-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .icon-btn{
    background:rgba(255,255,255,0.14); border:none; border-radius:10px;
    width:36px;height:36px; display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:16px;
  }
  .search-wrap{margin-top:12px;}
  .search-wrap input{
    width:100%; border:none; border-radius:10px; padding:10px 12px;
    font-size:14px; background:rgba(255,255,255,0.16); color:#fff;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,0.75);}

  main{flex:1; padding:14px 14px 90px; overflow-y:auto;}

  /* Cards */
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px; margin-bottom:10px; border:1px solid var(--line);
  }
  .patient-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .patient-card .name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px;}
  .patient-card .meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .chev{color:var(--ink-soft); font-size:18px;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .eb{font-size:34px; margin-bottom:10px;}
  .empty-state h3{margin:0 0 6px; color:var(--ink); font-size:17px;}
  .empty-state p{font-size:13.5px; margin:0;}

  /* Vitals strip (signature element) */
  .chart-tab{
    display:flex; background:var(--card); border-radius:var(--radius);
    border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px;
  }
  .chart-tab .seg{flex:1; padding:11px 8px; text-align:center; border-right:1px solid var(--line); position:relative;}
  .chart-tab .seg:last-child{border-right:none;}
  .chart-tab .seg::after{
    content:""; position:absolute; bottom:0; left:20%; right:20%; height:3px;
    background:var(--amber); border-radius:3px 3px 0 0;
  }
  .chart-tab .seg .v{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .chart-tab .seg .l{font-size:10px; letter-spacing:0.4px; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft);
    font-weight:600; margin:18px 0 8px 2px;
  }
  .section-label:first-child{margin-top:2px;}

  .visit-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .visit-row .date{font-weight:600; font-size:14px;}
  .visit-row .cc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .badges{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .badge{
    font-size:11px; padding:3px 9px; border-radius:100px; font-weight:500;
  }
  .badge.rx{background:var(--teal-tint); color:var(--teal-dark);}
  .badge.receipt{background:var(--amber-tint); color:#8A5A0F;}

  /* Buttons */
  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-secondary{background:var(--teal-tint); color:var(--teal-dark);}
  .btn-amber{background:var(--amber); color:#3D2B05;}
  .btn-outline{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--danger-tint); color:var(--danger);}
  .btn-block{width:100%;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row .btn{flex:1;}

  .fab{
    position:fixed; bottom:86px; right:20px;
    background:var(--teal); color:#fff; border:none; width:54px; height:54px; border-radius:50%;
    font-size:26px; box-shadow:0 6px 18px rgba(47,111,107,0.4); z-index:25;
  }

  /* Bottom nav (becomes a left sidebar at desktop widths) */
  .bottomnav{
    position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:20; width:100%; order:2; flex-shrink:0;
  }
  .navbtn{
    flex:1; border:none; background:none; padding:10px 4px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--ink-soft); font-size:10.5px; font-weight:600; border-radius:8px;
    position:relative;
  }
  .navbtn .ic{font-size:19px;}
  .navbtn.active{color:var(--teal);}
  .navbtn.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:26px; height:3px; background:var(--teal); border-radius:0 0 3px 3px;
  }

  /* Modal / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(21,43,43,0.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:#fff; width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    animation:slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 12px;}
  .sheet h2{margin:0 0 14px; font-size:19px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:14.5px;
    background:#FAFBFA; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .med-row{
    border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#FAFBFA; position:relative;
  }
  .med-row .rm{
    position:absolute; top:8px; right:8px; background:var(--danger-tint); color:var(--danger);
    border:none; border-radius:6px; width:22px; height:22px; font-size:13px; line-height:1;
  }
  .item-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:8px;}
  .item-row .field{margin-bottom:0;}
  .close-x{
    position:absolute; top:14px; right:14px; background:var(--teal-tint); color:var(--teal-dark);
    border:none; border-radius:8px; width:30px; height:30px; font-size:15px;
  }
  .total-line{
    display:flex; justify-content:space-between; align-items:center; padding:10px 2px 2px;
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; border-top:1px dashed var(--line); margin-top:6px;
  }
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0;
    transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}
  .subtle-link{background:none;border:none;color:var(--teal);font-weight:600;font-size:13px;padding:6px 0;}

  /* ---------------- DESKTOP / WIDE SCREENS ---------------- */
  @media (min-width:900px){
    body{background:#E9EDEA;}
    #app{max-width:1100px; box-shadow:0 0 0 1px var(--line); min-height:100vh;}
    .app-shell{flex-direction:row;}
    .app-content{order:2; min-height:100vh;}

    .bottomnav{
      order:1; flex-direction:column; width:220px; flex-shrink:0;
      height:100vh; position:sticky; top:0; align-self:flex-start;
      border-top:none; border-right:1px solid var(--line);
      justify-content:flex-start; padding:16px 0; gap:2px;
    }
    .navbtn{
      flex:none; flex-direction:row; justify-content:flex-start; gap:10px;
      padding:12px 18px; margin:1px 10px; border-radius:10px; font-size:13.5px; text-align:left;
    }
    .navbtn .ic{font-size:18px;}
    .navbtn.active{background:var(--teal-tint);}
    .navbtn.active::before{
      top:50%; left:-10px; transform:translateY(-50%);
      width:3px; height:60%; border-radius:0 3px 3px 0;
    }

    .topbar{padding:22px 32px 16px;}
    .topbar .clinic-name{font-size:22px;}
    .search-wrap{max-width:420px;}

    main{padding:24px 32px 60px; max-width:820px; margin:0 auto; width:100%;}

    .fab{right:36px; bottom:36px;}

    .overlay{align-items:center;}
    .sheet{border-radius:20px; max-width:560px; max-height:88vh;}

    .card{padding:16px 18px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script type="module">
/* ---------------- FIREBASE ---------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc,
  addDoc, updateDoc, query, orderBy, limit, startAfter, where, writeBatch,
  runTransaction, increment, documentId
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPPuX3w5G_Rey-4r4g4o637nq781N_Zhw",
  authDomain: "saifee-homeopathic.firebaseapp.com",
  projectId: "saifee-homeopathic",
  storageBucket: "saifee-homeopathic.firebasestorage.app",
  messagingSenderId: "241727266755",
  appId: "1:241727266755:web:1af9923f790cb4cc04a776"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

// Legacy stores (pre-multi-tenant rewrite). Kept only so the one-time
// migration can read them; nothing new is ever written here.
const LEGACY_CLINIC_DOC = doc(db, "clinic", "main");
const LEGACY_SETTINGS_DOC = doc(db, "clinicMeta", "settings");
const LEGACY_patientsCol = collection(db, 'patients');
const LEGACY_visitsCol = collection(db, 'visits');
const LEGACY_rxCol = collection(db, 'prescriptions');
const LEGACY_receiptsCol = collection(db, 'receipts');

// Multi-tenant collections: every clinic's data lives under its own
// clinics/{clinicId} document, so one deployment can serve many clinics
// with each one's data fully isolated. These are functions (not constants)
// because state.clinicId isn't known until after the signed-in user's
// profile has been loaded.
function clinicDoc(){ return doc(db, 'clinics', state.clinicId); }
function patientsCol(){ return collection(db, 'clinics', state.clinicId, 'patients'); }
function visitsCol(){ return collection(db, 'clinics', state.clinicId, 'visits'); }
function rxCol(){ return collection(db, 'clinics', state.clinicId, 'prescriptions'); }
function receiptsCol(){ return collection(db, 'clinics', state.clinicId, 'receipts'); }
const PATIENTS_PAGE_SIZE = 40;
const RECORDS_PAGE_SIZE = 30;
const SEARCH_POOL_SIZE = 1000; // bounded pool for client-side substring search + gender/city/tag filtering

// Storage estimate: Firestore's Spark (free) plan caps the WHOLE project at
// 1 GiB, shared across every clinic. There's no client-accessible API for
// the real, authoritative usage number (that needs a backend with Google
// Cloud billing access) — this is a client-side ESTIMATE based on document
// sizes, refreshed on demand rather than continuously, to avoid burning
// through the read quota just to measure the storage quota. Update this if
// the project is ever upgraded to Blaze (pay-as-you-go), which lifts the
// hard cap.
const STORAGE_LIMIT_BYTES = 1024 * 1024 * 1024; // 1 GiB
const STORAGE_WARNING_THRESHOLD = 0.85;

// Query design note: every query below deliberately uses only single-field
// where/orderBy combinations (or a range + orderBy on the SAME field), which
// Firestore can always serve with its automatic single-field indexes. That
// means this app needs zero manual "create a composite index" steps in the
// Firebase console — a real source of silent breakage otherwise.

// Secondary app instance: lets us create new staff logins without signing
// the current (admin) session out, since createUserWithEmailAndPassword
// signs in as the newly created user on whichever auth instance it runs on.
const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = getAuth(secondaryApp);

let currentUser = null;
let authReady = false;

onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  authReady = true;
  if(user){
    await loadMyProfile();
    await loadState();
  } else {
    loaded = false;
    state.currentRole = null;
    render();
  }
});

async function loadMyProfile(){
  try{
    const ref = doc(db, "users", currentUser.uid);
    const snap = await getDoc(ref);
    if(snap.exists()){
      const data = snap.data();
      state.currentRole = data.role || "doctor";
      state.isSuperAdmin = !!data.isSuperAdmin;
      if(data.role === 'platform_admin'){
        // A pure oversight login: no clinic of its own, ever. Lands on the
        // Admin Home screen instead of any clinic's data until it
        // explicitly enters one via the switcher.
        state.clinicId = null;
        state.homeClinicId = null;
        return;
      }
      if(data.clinicId){
        state.clinicId = data.clinicId;
        // Recovery: if an earlier attempt created this clinic but the data
        // copy into it failed partway (e.g. the ordering bug this fixes),
        // retry it now that the profile's clinicId is already correctly set.
        try{
          const markerSnap = await getDoc(doc(db,'clinicMeta','migrationMarker'));
          if(markerSnap.exists() && markerSnap.data().clinicId===data.clinicId && markerSnap.data().dataCopied===false){
            showToast('Finishing an earlier interrupted setup — copying your existing data…');
            await copyLegacyDataIntoClinic(data.clinicId);
          }
        }catch(e){ console.error('migration recovery check failed', e); }
      } else {
        // A profile from before multi-tenant support existed. The FIRST
        // person to hit this (in practice, whoever logs in first) does the
        // real migration and becomes super admin; anyone else who logs in
        // without a clinicId (e.g. staff added before this update) just
        // joins that same already-migrated clinic instead of triggering a
        // second, duplicate migration.
        showToast('Setting up your clinic workspace…');
        const {clinicId, isFirstMigration} = await getOrCreateLegacyClinic();
        const grantSuperAdmin = isFirstMigration || !!data.isSuperAdmin;
        // Update the profile BEFORE copying any data: the security rules
        // check this profile's clinicId to authorize writes into the
        // clinic's subcollections, so the copy would be silently rejected
        // if it ran first.
        await updateDoc(ref, {clinicId, isSuperAdmin: grantSuperAdmin});
        state.clinicId = clinicId;
        state.isSuperAdmin = grantSuperAdmin;
        state.currentRole = data.role || "doctor";
        if(isFirstMigration) await copyLegacyDataIntoClinic(clinicId);
      }
    } else {
      // Nobody has ever logged in on this Firebase project before: bootstrap
      // a brand-new, empty clinic for them.
      const {clinicId, isFirstMigration} = await getOrCreateLegacyClinic();
      await setDoc(ref, {
        name: currentUser.email.split('@')[0],
        email: currentUser.email,
        role: "doctor",
        clinicId,
        isSuperAdmin: true,
        createdAt: new Date().toISOString()
      });
      state.currentRole = "doctor";
      state.clinicId = clinicId;
      state.isSuperAdmin = true;
      if(isFirstMigration) await copyLegacyDataIntoClinic(clinicId);
    }
    state.homeClinicId = state.clinicId; // super admins can switch away from this; everyone else stays here
  }catch(e){ console.error('profile load failed', e); state.currentRole = "doctor"; }
}
// Ensures the one-time legacy migration only ever happens once, no matter
// how many different pre-existing accounts log in and hit this path. A
// marker document records which clinic received the migrated data; anyone
// after the first just gets pointed at that same clinic. Deliberately does
// NOT copy any data itself — the caller must update the signed-in user's
// own profile with this clinicId first (required for the security rules
// to authorize the copy), then call copyLegacyDataIntoClinic separately.
async function getOrCreateLegacyClinic(){
  const markerRef = doc(db, 'clinicMeta', 'migrationMarker');
  return await runTransaction(db, async (tx)=>{
    const markerSnap = await tx.get(markerRef);
    if(markerSnap.exists() && markerSnap.data().clinicId){
      return {clinicId: markerSnap.data().clinicId, isFirstMigration:false};
    }
    const clinicRef = doc(collection(db, 'clinics'));
    tx.set(clinicRef, {
      settings: state.settings, tagsList: [], createdAt: new Date().toISOString()
    });
    tx.set(markerRef, {clinicId: clinicRef.id, migratedAt: new Date().toISOString(), dataCopied:false});
    return {clinicId: clinicRef.id, isFirstMigration:true};
  });
}
// Copies old flat-collection data (settings + patients + visits +
// prescriptions + receipts) into the newly created clinic. Only ever
// called once, immediately after that clinic doc is first created.
async function copyLegacyDataIntoClinic(clinicId){
  const clinicRef = doc(db, 'clinics', clinicId);
  try{
    const legacySettingsSnap = await getDoc(LEGACY_SETTINGS_DOC);
    const legacyData = legacySettingsSnap.exists() ? legacySettingsSnap.data() : null;
    if(legacyData){
      await setDoc(clinicRef, {
        settings: legacyData.settings || state.settings,
        tagsList: legacyData.tagsList || []
      }, {merge:true});
    }
    const [pSnap, vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(LEGACY_patientsCol), getDocs(LEGACY_visitsCol),
      getDocs(LEGACY_rxCol), getDocs(LEGACY_receiptsCol)
    ]);
    if(!pSnap.empty || !vSnap.empty || !rxSnap.empty || !rcSnap.empty){
      showToast(`Migrating ${pSnap.size} existing patients into your clinic workspace…`);
      const allDocs = [];
      pSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'patients'), d.id), data:d.data()}));
      vSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'visits'), d.id), data:d.data()}));
      rxSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'prescriptions'), d.id), data:d.data()}));
      rcSnap.docs.forEach(d=>allDocs.push({ref:doc(collection(clinicRef,'receipts'), d.id), data:d.data()}));
      for(let i=0;i<allDocs.length;i+=400){
        const batch = writeBatch(db);
        allDocs.slice(i,i+400).forEach(({ref,data})=>batch.set(ref,data));
        await batch.commit();
      }
      showToast('Migration complete');
    }
    await updateDoc(doc(db,'clinicMeta','migrationMarker'), {dataCopied:true});
  }catch(e){ console.error('clinic data copy failed', e); showToast('Clinic setup ran into a problem — your old data is untouched; contact support before continuing'); }
}
async function loadStaffList(){
  try{
    const snap = await getDocs(query(collection(db, "users"), where('clinicId','==',state.clinicId)));
    state.staffList = snap.docs.map(d=>({uid:d.id, ...d.data()}));
  }catch(e){ console.error('staff list failed', e); state.staffList = []; }
}
async function addStaff(){
  const name = document.getElementById('st_name').value.trim();
  const email = document.getElementById('st_email').value.trim();
  const pass = document.getElementById('st_pass').value;
  const role = document.getElementById('st_role').value;
  const errEl = document.getElementById('staffError');
  errEl.textContent = "";
  if(!name || !email || pass.length<6){
    errEl.textContent = "Fill in name, email, and a password of at least 6 characters.";
    return;
  }
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    await setDoc(doc(db, "users", cred.user.uid), {
      name, email, role, clinicId: state.clinicId, createdAt: new Date().toISOString()
    });
    await signOut(secondaryAuth);
    await loadStaffList();
    closeModal();
    render();
    showToast('Staff member added');
  }catch(e){
    errEl.textContent = e.code==='auth/email-already-in-use' ? "That email is already registered." : "Couldn't create that login — try again.";
  }
}
async function removeStaffProfile(uid){
  if(uid===currentUser.uid){ showToast("You can't remove your own access here"); return; }
  await deleteDoc(doc(db,"users",uid));
  await loadStaffList();
  render();
  showToast('Removed from staff list — their login still exists in Firebase until deleted there too');
}
function isDoctor(){ return state.currentRole === 'doctor'; }
async function createClinic(){
  const clinicName = document.getElementById('nc_clinicName').value.trim();
  const docName = document.getElementById('nc_docName').value.trim();
  const email = document.getElementById('nc_email').value.trim();
  const pass = document.getElementById('nc_pass').value;
  const errEl = document.getElementById('createClinicError');
  errEl.textContent = "";
  if(!clinicName || !docName || !email || pass.length<6){
    errEl.textContent = "Fill in all fields with a password of at least 6 characters.";
    return;
  }
  try{

  settings:{clinicName:"My Clinic", doctorName:"Dr. Jane Doe", qualification:"MBBS, MD", regNo:"", phone:"", address:"", nextPatientSeq:1, logoDataUrl:"", geminiApiKey:""},
  tagsList:[],

  _myClinicBytes:0, _myClinicDocCount:0, _platformStorageBytes:0, _platformStoragePercent:0,
  _patientCache:{}
};
let loaded = false;

function cachePatients(list){ list.forEach(p=>{ state._patientCache[p.id]=p; }); }
function cachePatient(p){ if(p) state._patientCache[p.id]=p; }

async function loadState(){
  if(!state.clinicId){

    // load. Admin Home screen handles its own data (the clinic list).

  }

/* ---------------- STORAGE USAGE (estimate) ---------------- */
function estimateDocsBytes(docs){
  return docs.reduce((sum, d)=> sum + JSON.stringify(d).length, 0);
}
// Recomputes THIS clinic's estimated storage by reading all of its own
// documents and summing their JSON size. Costs real Firestore reads
// proportional to how much data exists, so this only runs on demand (a
// button in Settings) or after bulk operations — never automatically on
// every page load.
async function recalculateMyClinicStorage(){
  showToast('Calculating storage usage — this may take a moment for a large clinic…');
  try{
    const [pSnap, vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(patientsCol()), getDocs(visitsCol()), getDocs(rxCol()), getDocs(receiptsCol())
    ]);
    const bytes = estimateDocsBytes(pSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(vSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(rxSnap.docs.map(d=>d.data()))
      + estimateDocsBytes(rcSnap.docs.map(d=>d.data()));
    const docCount = pSnap.size + vSnap.size + rxSnap.size + rcSnap.size;
    const updatedAt = new Date().toISOString();
    await setDoc(clinicDoc(), {estimatedBytes:bytes, docCount, storageUpdatedAt:updatedAt}, {merge:true});
    await setDoc(doc(db,'clinicStats',state.clinicId), {estimatedBytes:bytes, docCount, updatedAt}, {merge:true});
    state._myClinicBytes = bytes;
    state._myClinicDocCount = docCount;
    render();
    await loadPlatformStorageUsage();
    showToast('Storage usage updated');
  }catch(e){ console.error('storage calc failed', e); showToast('Could not calculate storage — check your connection'); }
}
// Reads every clinic's published byte count (not their patient data — just
// a number) and sums them for the "total across all clinics" figure shown
// on every screen's warning banner.
async function loadPlatformStorageUsage(){
  try{
    const snap = await getDocs(collection(db,'clinicStats'));
    let total = 0;
    snap.docs.forEach(d=>{ total += (d.data().estimatedBytes||0); });
    state._platformStorageBytes = total;
    state._platformStoragePercent = total / STORAGE_LIMIT_BYTES;
    const mine = snap.docs.find(d=>d.id===state.clinicId);
    if(mine){ state._myClinicBytes = mine.data().estimatedBytes||0; state._myClinicDocCount = mine.data().docCount||0; }
  }catch(e){ console.error('platform storage load failed', e); }
  render();
}
function formatBytes(bytes){
  if(!bytes) return '0 MB';
  const mb = bytes/(1024*1024);
  if(mb<1) return (bytes/1024).toFixed(0)+' KB';
  if(mb<1024) return mb.toFixed(1)+' MB';
  return (mb/1024).toFixed(2)+' GB';
}
async function saveSettingsDoc(){
  try{
    await setDoc(clinicDoc(), {

/* ---------------- PATIENTS: paginated loading & search ---------------- */
async function loadPatientsPage(reset){
  if(reset){ state.patients = []; state._patientsCursor = null; state._patientsHasMore = true; state._patientsMode = 'browse'; }
  if(!state._patientsHasMore) return;
  try{
    const constraints = [orderBy('nameLower'), limit(PATIENTS_PAGE_SIZE)];
    if(state._patientsCursor) constraints.splice(1, 0, startAfter(state._patientsCursor));
    const snap = await getDocs(query(patientsCol(), ...constraints));
    const docsArr = snap.docs;
    const newPatients = docsArr.map(d=>({id:d.id, ...d.data()}));
    cachePatients(newPatients);
    state.patients = reset ? newPatients : state.patients.concat(newPatients);
    state._patientsCursor = docsArr.length ? docsArr[docsArr.length-1] : state._patientsCursor;
    state._patientsHasMore = docsArr.length === PATIENTS_PAGE_SIZE;
  }catch(e){ console.error('patients load failed', e); showToast('Could not load patients'); }
}
async function loadMorePatients(){
  await loadPatientsPage(false);
  render();
}
// A cached, bounded pool of patients used for both search and gender/city/tag
// filtering. Firestore itself only supports prefix matching natively (finds
// names STARTING WITH what you typed) — real "contains anywhere",
// case-insensitive search needs to happen in memory, so we pull a generous
// pool once and filter it locally on every keystroke (fast, no repeated
// network calls while typing).
async function ensureSearchPool(forceRefresh){
  if(state._searchPool && !forceRefresh) return;
  try{
    const snap = await getDocs(query(patientsCol(), orderBy('nameLower'), limit(SEARCH_POOL_SIZE)));
    state._searchPool = snap.docs.map(d=>({id:d.id, ...d.data()}));
    cachePatients(state._searchPool);
  }catch(e){
    console.error('search pool load failed', e);
    showToast('Search failed to load — ' + (e.message||'check your connection').slice(0,80));
    state._searchPool = state._searchPool || [];
  }
}
function invalidateSearchPool(){ state._searchPool = null; }
async function loadPatientsForFiltering(){
  await ensureSearchPool();
  state.patients = state._searchPool.slice();
  state._patientsHasMore = false;
  state._patientsMode = 'filter';
}
async function searchPatientsRemote(qRaw){
  const q = qRaw.trim();
  if(!q){ await loadPatientsPage(true); render(); return; }
  state._patientsMode = 'search';
  await ensureSearchPool();
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');
  const merged = {};
  state._searchPool.forEach(p=>{
    const nameHay = p.nameLower || (p.name||'').toLowerCase();
    const codeHay = (p.patientCode||'').toLowerCase();
    if(nameHay.includes(qLower) || codeHay.includes(qLower)) merged[p.id] = p;
  });
  if(digits.length>=5){
    // A near-complete phone number: do an exact, unbounded lookup so it
    // works even for a patient outside the cached search pool.
    try{
      const snap = await getDocs(query(patientsCol(), where('phoneNormalized','==',digits), limit(5)));
      snap.docs.forEach(d=>{ const p = {id:d.id, ...d.data()}; cachePatient(p); merged[p.id] = p; });
    }catch(e){ console.error('phone lookup failed', e); }
  } else if(digits.length>=3){
    state._searchPool.forEach(p=>{ if((p.phoneNormalized||'').includes(digits)) merged[p.id] = p; });
  }
  const list = Object.values(merged).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  state.patients = list;
  state._patientsHasMore = false;
  render();
}
async function fetchPatientDirect(id){
  if(state._patientCache[id]) return state._patientCache[id];
  try{
    const snap = await getDoc(doc(patientsCol(), id));
    if(snap.exists()){ const p = {id:snap.id, ...snap.data()}; cachePatient(p); return p; }
  }catch(e){ console.error('patient fetch failed', e); }
  return null;
}

function triggerImport(){ document.getElementById('importFile').click(); }
function importData(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.patients || !Array.isArray(parsed.patients)) throw new Error('bad format');
      showToast('Restoring backup — this may take a moment…');
      const allDocs = [];
      (parsed.patients||[]).forEach(p=>{ const {id,...rest}=p; allDocs.push({col:patientsCol(),id,data:rest}); });
      (parsed.visits||[]).forEach(v=>{ const {id,...rest}=v; allDocs.push({col:visitsCol(),id,data:rest}); });
      (parsed.prescriptions||[]).forEach(r=>{ const {id,...rest}=r; allDocs.push({col:rxCol(),id,data:rest}); });
      (parsed.receipts||[]).forEach(r=>{ const {id,...rest}=r; allDocs.push({col:receiptsCol(),id,data:rest}); });
      for(let i=0;i<allDocs.length;i+=400){
        const batch = writeBatch(db);
        allDocs.slice(i,i+400).forEach(({col,id,data})=>batch.set(doc(col,id), data));
        await batch.commit();
      }
      if(parsed.settings) state.settings = {...state.settings, ...parsed.settings};
      if(parsed.tagsList) state.tagsList = parsed.tagsList;
      await saveSettingsDoc();
      await loadPatientsPage(true);
      render();
      invalidateSearchPool();
      invalidateRecordsSearchPool();
      recalculateMyClinicStorage();
      showToast('Backup restored');
    }catch(err){ console.error(err); showToast('Could not read that backup file'); }
  };
  reader.readAsText(file);
  fileInput.value = '';
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- DERIVED HELPERS ---------------- */
function getPatient(id){ return state._patientCache[id]; }
function getVisit(id){ return state.visits.find(v=>v.id===id); }
function visitsForPatient(pid){ return state.visits.filter(v=>v.patientId===pid).sort((a,b)=>b.date.localeCompare(a.date)); }
function rxForVisit(vid){ return state.prescriptions.find(r=>r.visitId===vid); }
function receiptForVisit(vid){ return state.receipts.find(r=>r.visitId===vid); }
function lastVisitDate(pid){
  const vs = visitsForPatient(pid);
  return vs.length ? vs[0].date : (getPatient(pid)?.lastVisitDate || null);
}
function age(dobOrAge){ return dobOrAge; }

  let body = "";
  if(state.view.screen==="patients-list") body = renderFilterPanel() + renderPatientsList();
  else if(state.view.screen==="patient-detail") body = renderPatientDetail();
  else if(state.view.screen==="visit-detail") body = renderVisitDetail();
  else if(state.view.screen==="records") body = renderRecords();
  else if(state.view.screen==="settings") body = renderSettings();
  else if(state.view.screen==="staff") body = renderStaff();
  else if(state.view.screen==="ai-chat") body = renderAIChat();

  app.innerHTML = `
    <div class="app-shell">
      ${renderBottomNav()}
      <div class="app-content">
        ${renderTopbar()}
        ${renderStorageBanner()}
        ${renderClinicSwitchBanner()}
        <main>${body}</main>
      </div>

    ${renderFab()}
    ${state.modal ? renderModal() : ""}
  `;
  attachModalHandlers();
}

function renderStorageBanner(){

  return `<div style="background:var(--danger);color:#fff;padding:10px 16px;font-size:12.5px;text-align:center;line-height:1.4">
    ⚠ Shared database storage is at <b>${pct}%</b> of the 1 GB free limit. New records may soon fail to save — contact your administrator about upgrading.
  </div>`;
}
function renderClinicSwitchBanner(){
  if(!state.isSuperAdmin || !state.clinicId) return '';
  if(state.homeClinicId && state.clinicId===state.homeClinicId) return '';
  const clinic = (state._allClinics||[]).find(c=>c.id===state.clinicId);
  const isPureAdmin = !state.homeClinicId;
  return `<div style="background:var(--amber);color:#3D2B05;padding:10px 16px;font-size:12.5px;text-align:center;line-height:1.4;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap">
    <span>🔀 ${isPureAdmin?'Admin viewing':'Viewing'} <b>${escapeHtml(clinic?.name||'this clinic')}</b>${isPureAdmin?'':' — not your home clinic'}.</span>
    <button onclick="${isPureAdmin?'exitToAdminHome()':'returnToMyClinic()'}" style="background:#3D2B05;color:#fff;border:none;border-radius:100px;padding:4px 12px;font-size:11.5px;font-weight:600">${isPureAdmin?'Exit to admin home':'Return to my clinic'}</button>
  </div>`;
}
function renderTopbar(){
  let title = state.settings.clinicName, sub = state.settings.doctorName;
  let showSearch = state.view.screen==="patients-list";
  let showBack = state.view.screen==="patient-detail" || state.view.screen==="visit-detail";
  if(state.view.screen==="patient-detail"){ title = getPatient(state.view.patientId)?.name || "Patient"; sub = "Patient chart"; }
  if(state.view.screen==="visit-detail"){ title = "Visit — " + fmtDate(getVisit(state.view.visitId)?.date); sub = getPatient(getVisit(state.view.visitId)?.patientId)?.name || ""; }
  if(state.view.screen==="records"){ title = "Records"; sub = "Prescriptions & receipts"; }

  if(state.view.screen==="staff"){ title = "Staff"; sub = "Who has access"; }
  if(state.view.screen==="ai-chat"){ title = "AI Assistant"; sub = "Decision support — always verify"; }
  return `
    <div class="topbar">
      <div class="topbar-row">
        <div>
          ${showBack ? `<button class="icon-btn" style="margin-bottom:8px" onclick="goBack()">←</button>` : ""}

function goBack(){

function goTab(tab, screen){
  state.view = {tab, screen, patientId:null, visitId:null};
  if(tab==='staff'){
    state._staffLoading = true;
    loadStaffList().then(()=>{ state._staffLoading=false; render(); });
  }
  if(tab==='records'){
    state._recordsLoading = true;
    loadRecordsPage(true).then(()=>{ state._recordsLoading=false; render(); });
  }
  if(tab==='patients'){
    state._search = "";

    loadPatientsPage(true).then(()=>{ state._patientsLoading=false; render(); });

function onSearch(v){
  state._search = v;
  clearTimeout(window._searchDebounce);
  window._searchDebounce = setTimeout(()=>{ searchPatientsRemote(v); }, 300);
}
function toggleFilters(){ state._filtersOpen = !state._filtersOpen; render(); }
function anyFilterActive(){ return !!(state._filterGender || state._filterCity || (state._filterTags&&state._filterTags.length)); }
async function refreshPatientPool(){
  if(state._search && state._search.trim()){ await searchPatientsRemote(state._search); return; }
  if(anyFilterActive()){ await loadPatientsForFiltering(); render(); return; }
  await loadPatientsPage(true); render();
}
function setGenderFilter(v){ state._filterGender = v; refreshPatientPool(); }
function setCityFilter(v){ state._filterCity = v; refreshPatientPool(); }
function toggleTagFilter(tag){
  state._filterTags = state._filterTags || [];
  const i = state._filterTags.indexOf(tag);
  if(i===-1) state._filterTags.push(tag); else state._filterTags.splice(i,1);
  refreshPatientPool();
}
function clearFilters(){ state._filterGender=""; state._filterCity=""; state._filterTags=[]; state._search=""; refreshPatientPool(); }
function renderListOnly(){

function allCities(){ return [...new Set(state.patients.map(p=>p.city).filter(Boolean))].sort(); }
function allTags(){ return (state.tagsList||[]).slice().sort(); }

function renderPatientsList(){

async function openPatient(id){
  state.view = {tab:"patients", screen:"patient-detail", patientId:id, visitId:null};

    const [vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(query(visitsCol(), where('patientId','==',id))),
      getDocs(query(rxCol(), where('patientId','==',id))),
      getDocs(query(receiptsCol(), where('patientId','==',id)))

    state.receipts = rcSnap.docs.map(d=>({id:d.id, ...d.data()}));

  render();
}

async function loadMoreRecordsClick(btn){ btn.textContent='Loading…'; btn.disabled=true; await loadMoreRecords(); }
async function loadRecordsPage(reset){
  if(reset){
    state.recordsRx = []; state.recordsReceipts = [];
    state._recordsCursorRx = null; state._recordsCursorReceipts = null;
    state._recordsHasMoreRx = true; state._recordsHasMoreReceipts = true;
  }
  const type = state._recordsType || 'all';
  const from = state._recordsDateFrom, to = state._recordsDateTo;
  const wantRx = type==='all' || type==='rx';
  const wantReceipt = type==='all' || type==='receipt';
  const perColSize = type==='all' ? Math.ceil(RECORDS_PAGE_SIZE/2) : RECORDS_PAGE_SIZE;
  async function fetchPage(col, cursor, hasMore){
    if(!hasMore) return {items:[], cursor, hasMore:false};
    const constraints = [];
    if(from) constraints.push(where('date','>=',from));
    if(to) constraints.push(where('date','<=',to));
    constraints.push(orderBy('date','desc'));
    if(cursor) constraints.push(startAfter(cursor));
    constraints.push(limit(perColSize));
    const snap = await getDocs(query(col, ...constraints));
    return {items: snap.docs.map(d=>({id:d.id, ...d.data()})), cursor: snap.docs.length?snap.docs[snap.docs.length-1]:cursor, hasMore: snap.docs.length===perColSize};
  }
  try{
    if(wantRx){
      const r = await fetchPage(rxCol(), state._recordsCursorRx, state._recordsHasMoreRx);
      state.recordsRx = reset ? r.items : state.recordsRx.concat(r.items);
      state._recordsCursorRx = r.cursor; state._recordsHasMoreRx = r.hasMore;
    }
    if(wantReceipt){
      const r = await fetchPage(receiptsCol(), state._recordsCursorReceipts, state._recordsHasMoreReceipts);
      state.recordsReceipts = reset ? r.items : state.recordsReceipts.concat(r.items);
      state._recordsCursorReceipts = r.cursor; state._recordsHasMoreReceipts = r.hasMore;
    }
  }catch(e){ console.error('records load failed', e); showToast('Could not load records'); }
}
async function loadMoreRecords(){ await loadRecordsPage(false); render(); }
async function ensureRecordsSearchPool(){
  if(state._recordsSearchPool) return;
  try{
    const [rxSnap, rcSnap] = await Promise.all([
      getDocs(query(rxCol(), orderBy('date','desc'), limit(SEARCH_POOL_SIZE))),
      getDocs(query(receiptsCol(), orderBy('date','desc'), limit(SEARCH_POOL_SIZE)))
    ]);
    state._recordsSearchPool = {
      rx: rxSnap.docs.map(d=>({id:d.id, ...d.data()})),
      receipt: rcSnap.docs.map(d=>({id:d.id, ...d.data()}))
    };
  }catch(e){ console.error('records search pool load failed', e); showToast('Search failed to load — ' + (e.message||'check your connection').slice(0,80)); state._recordsSearchPool = {rx:[],receipt:[]}; }
}
function invalidateRecordsSearchPool(){ state._recordsSearchPool = null; }
async function searchRecordsRemote(qRaw){
  const q = qRaw.trim();
  if(!q){ await loadRecordsPage(true); render(); return; }
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');
  const type = state._recordsType || 'all';
  const wantRx = type==='all' || type==='rx';
  const wantReceipt = type==='all' || type==='receipt';
  await ensureRecordsSearchPool();
  function matches(r){
    const nameHay = r.patientNameLower || (r.patientName||'').toLowerCase();
    const codeHay = (r.patientCode||'').toLowerCase();
    const phoneHay = r.patientPhone||'';
    return nameHay.includes(qLower) || codeHay.includes(qLower) || (digits.length>=3 && phoneHay.includes(digits));
  }
  state.recordsRx = wantRx ? state._recordsSearchPool.rx.filter(matches).sort((a,b)=>b.date.localeCompare(a.date)) : [];
  state.recordsReceipts = wantReceipt ? state._recordsSearchPool.receipt.filter(matches).sort((a,b)=>b.date.localeCompare(a.date)) : [];
  state._recordsHasMoreRx = false; state._recordsHasMoreReceipts = false;
  render();
}
function setRecordsTypeFilter(type){ state._recordsType = type; if(state._recordsSearch){ searchRecordsRemote(state._recordsSearch); } else { loadRecordsPage(true).then(render); } }
function onRecordsSearch(v){
  state._recordsSearch = v;
  if(v.trim()){ state._recordsDateFrom=""; state._recordsDateTo=""; }
  clearTimeout(window._recordsSearchDebounce);
  window._recordsSearchDebounce = setTimeout(()=>{ searchRecordsRemote(v); }, 300);
}

/* ---- AI Assistant (Gemini) ---- */
const AI_SYSTEM_PROMPT = `You are a clinical decision-support assistant helping a licensed doctor review their own patient's records inside their clinic's private records app. You are NOT diagnosing a patient and your output is NOT a prescription — you are a second pair of eyes for the doctor's own judgment.
Rules you must follow:
- Be concise and clinically literal. Use plain language a doctor can scan quickly.
- When asked to summarize, note patterns across visits (recurring complaints, possible chronic conditions) based only on what's in the records given to you.
- When asked about possible diagnoses or medications, give general, textbook-level possibilities and common medication classes (not exact doses) framed as "considerations to evaluate," never as a final answer. Always state that the doctor must confirm with their own clinical judgment, exam, and any necessary tests.
- Never invent facts not present in the given patient history — if information is missing, say so.
- Keep responses under ~200 words unless the doctor asks for more detail.`;

// Google deprecates/rotates free-tier model names fairly often, sometimes
// earlier than their own announced dates. Rather than hardcode one name
// that can break again, try a short list of current candidates in order
// and fall back automatically if one isn't available for this key/region.
const GEMINI_MODEL_CANDIDATES = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-3.1-flash-lite'];

async function callGeminiAPI(history){
  const key = state.settings.geminiApiKey;
  if(!key) throw new Error('NO_KEY');
  const contents = history.map(m=>({role: m.role==='user'?'user':'model', parts:[{text:m.text}]}));
  let lastErr;
  for(const model of GEMINI_MODEL_CANDIDATES){
    let res;
    try{
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body: JSON.stringify({
          systemInstruction:{parts:[{text:AI_SYSTEM_PROMPT}]},
          contents
        })
      });
    }catch(networkErr){
      throw new Error(`NETWORK_ERROR: ${networkErr.message}`);
    }
    if(res.status===404){
      lastErr = new Error(`API_ERROR: 404 model "${model}" not available for this key`);
      continue; // try the next candidate model
    }
    if(!res.ok){
      const errText = await res.text().catch(()=> '');
      throw new Error(`API_ERROR: ${res.status} ${errText.slice(0,200)}`);
    }
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
    if(!text) throw new Error('EMPTY_RESPONSE');
    return text;
  }
  throw lastErr || new Error('ALL_MODELS_UNAVAILABLE');
}
function buildPatientContext(p){
  if(!p) return null;
  const visits = visitsForPatient(p.id);
  const lines = visits.map(v=>{
    const rx = rxForVisit(v.id);
    const meds = rx && rx.medicines.length ? rx.medicines.map(m=>`${m.name} (${m.dosage||'—'}, ${m.frequency||'—'}, ${m.duration||'—'})`).join('; ') : 'none recorded';
    const vit = v.vitals||{};
    return `- ${fmtDate(v.date)} — complaint: ${v.chiefComplaint||'—'}; diagnosis: ${v.diagnosis||'—'}; notes: ${v.notes||'—'}; vitals: BP ${vit.bp||'—'}, Temp ${vit.temp||'—'}, Pulse ${vit.pulse||'—'}, Weight ${vit.weight||'—'}; medicines prescribed: ${meds}`;
  }).join('\n');
  return `PATIENT RECORD (from clinic database — treat as ground truth, do not assume anything beyond this):
Name: ${p.name} | Age: ${p.age||'—'} | Gender: ${p.gender||'—'} | Blood group: ${p.bloodGroup||'—'} | Known allergies: ${p.allergies||'none noted'}
Visit history, most recent first (${visits.length} total):
${lines || 'No visits recorded yet.'}`;
}

// Fetches a patient's visits/prescriptions on demand for AI context when
// they weren't opened via the normal patient-detail screen first.
async function ensurePatientRecordsLoaded(id){
  if(state._aiLoadedPatientId===id) return;
  try{
    const [vSnap, rxSnap] = await Promise.all([
      getDocs(query(visitsCol(), where('patientId','==',id))),
      getDocs(query(rxCol(), where('patientId','==',id)))
    ]);
    state.visits = vSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.prescriptions = rxSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state._aiLoadedPatientId = id;
  }catch(e){ console.error('AI patient records load failed', e); }
}
function describeAIError(e){
  if(e.message==='NO_KEY') return "No AI key set up yet — add one in Settings → AI Assistant.";
  const msg = e.message || String(e);
  if(msg.startsWith('NETWORK_ERROR')) return "Couldn't reach the AI service — check your internet connection and try again.\n\nDetails: " + msg;
  if(msg==='ALL_MODELS_UNAVAILABLE' || msg.includes('API_ERROR: 404')) return "None of the current AI models are available for this key. Try generating a fresh key at aistudio.google.com/apikey — Google rotates model availability fairly often.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 400')) return "The AI service rejected the request (likely an invalid or malformed API key). Double-check the key in Settings.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 403')) return "The AI service refused this key (permission denied — it may be restricted or disabled). Try generating a new key at aistudio.google.com/apikey.\n\nDetails: " + msg;
  if(msg.includes('API_ERROR: 429')) return "Free tier limit reached for the moment — wait a minute and try again.\n\nDetails: " + msg;
  return "Sorry, that request failed.\n\nDetails: " + msg;
}
async function sendAIMessage(){
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if(!text || state._aiLoading) return;
  state._aiChat = state._aiChat || [];
  state._aiChat.push({role:'user', text});
  input.value = '';
  state._aiLoading = true;
  document.getElementById('aiChatLog').innerHTML = renderAIChatLog();
  try{
    const p = state._aiPatientId ? getPatient(state._aiPatientId) : null;
    const ctx = buildPatientContext(p);
    const history = [];
    if(ctx) history.push({role:'user', text: ctx + "\n\n(Acknowledge briefly that you have this patient's record, then wait for my question.)"}, {role:'model', text:`Got it — I have ${p.name}'s visit history. What would you like to know?`});
    history.push(...state._aiChat);
    const reply = await callGeminiAPI(history);
    state._aiChat.push({role:'model', text:reply});
  }catch(e){
    state._aiChat.push({role:'model', text: describeAIError(e)});
    console.error('AI chat error', e);
  }
  state._aiLoading = false;
  document.getElementById('aiChatLog').innerHTML = renderAIChatLog();
}

/* ---- WhatsApp sharing ---- */
function findRxRecord(rxId){ return state.prescriptions.find(r=>r.id===rxId) || state.recordsRx.find(r=>r.id===rxId); }
function findReceiptRecord(id){ return state.receipts.find(r=>r.id===id) || state.recordsReceipts.find(r=>r.id===id); }
async function resolvePatientForRecord(rec){
  let p = getPatient(rec.patientId);
  if(!p) p = await fetchPatientDirect(rec.patientId);
  if(!p) p = {name:rec.patientName||'Unknown patient', patientCode:rec.patientCode||'', phone:rec.patientPhone||''};
  return p;
}
async function shareOnWhatsApp(type, id){
  const rec = type==='rx' ? findRxRecord(id) : findReceiptRecord(id);
  if(!rec){ showToast('Record not found'); return; }
  const p = await resolvePatientForRecord(rec);
  const label = type==='rx' ? 'prescription' : 'receipt';
  const clinic = state.settings.clinicName || 'the clinic';
  const filename = type==='rx'
    ? `Prescription_${(p.name||'patient').replace(/\s+/g,'_')}_${rec.date}.pdf`
    : `Receipt_${(p.name||'patient').replace(/\s+/g,'_')}_${rec.date}.pdf`;
  const doc = type==='rx' ? buildPrescriptionDoc(rec, p) : buildReceiptDoc(rec, p);
  const blob = doc.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  const shareText = `Sharing your ${label} from ${clinic}.`;

  // Best path: native share sheet with the PDF already attached — the person
  // picks WhatsApp (or anything else) and the file is there, no manual step.
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename, text:shareText});
      return;
    }catch(err){
      if(err && err.name==='AbortError') return; // they backed out of the share sheet — don't fall back
    }
  }
  // Fallback (mostly desktop browsers, which can't attach files to WhatsApp
  // Web via a link — that's a WhatsApp platform limit, not something a
  // website can work around): open the chat and download the PDF so it's
  // one tap to attach manually.
  const digits = normalizePhone(p.phone).replace(/\D/g,'');
  const msg = encodeURIComponent(`${shareText} The PDF just downloaded to this device — please attach it here.`);
  if(digits) window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
  else showToast('No phone number on file for this patient');
  doc.save(filename);
}

function handleLogoUpload(input){
  const file = input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 240;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.settings.logoDataUrl = canvas.toDataURL('image/png');
      saveSettingsDoc(); render(); showToast('Logo updated');
    };
    img.onerror = ()=> showToast("Couldn't read that image");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function repairPatientIndex(){
  showToast('Checking patient records — this may take a moment…');
  try{
    // Deliberately no orderBy here: an orderBy('nameLower') query would
    // silently SKIP any document missing that field — exactly the ones we
    // need to find and fix. A plain collection fetch returns everyone.
    const snap = await getDocs(patientsCol());
    const fixes = [];
    snap.docs.forEach(d=>{
      const p = d.data();
      const wantNameLower = (p.name||'').toLowerCase();
      const wantPhoneNorm = normalizePhone(p.phone||'').replace(/\D/g,'');
      if(p.nameLower !== wantNameLower || p.phoneNormalized !== wantPhoneNorm){
        fixes.push({ref:d.ref, data:{nameLower:wantNameLower, phoneNormalized:wantPhoneNorm}});
      }
    });
    if(fixes.length===0){ showToast('Everything already looks correct — no repair needed'); return; }
    for(let i=0;i<fixes.length;i+=400){
      const batch = writeBatch(db);
      fixes.slice(i,i+400).forEach(({ref,data})=>batch.update(ref,data));
      await batch.commit();
    }
    invalidateSearchPool();
    await loadPatientsPage(true);
    render();
    showToast(`Fixed ${fixes.length} patient record(s) — try searching again`);
  }catch(e){ console.error('repair patient index failed', e); showToast('Repair failed — ' + (e.message||'check your connection').slice(0,80)); }
}
async function forceRetryMigration(){
  showToast('Checking migration status…');
  try{
    const legacyPatientsSnap = await getDocs(LEGACY_patientsCol);
    const markerSnap = await getDoc(doc(db,'clinicMeta','migrationMarker'));

    if(legacyPatientsSnap.empty && !markerSnap.exists()){
      showToast('No old data found to migrate, and no migration was ever attempted — nothing to do.');
      return;
    }
    if(!markerSnap.exists()){
      showToast(`Found ${legacyPatientsSnap.size} old patient(s) but no migration record — attempting a fresh copy into your current clinic…`);
      await copyLegacyDataIntoClinic(state.clinicId);
    } else {
      const marker = markerSnap.data();
      if(marker.clinicId !== state.clinicId){
        showToast(`Mismatch: your account's clinic (${state.clinicId}) differs from the migration record's clinic (${marker.clinicId}). This needs a manual look — don't guess further, tell your developer this exact message.`);
        return;
      }
      showToast(`Retrying copy of ${legacyPatientsSnap.size} old patient(s) into your clinic…`);
      await copyLegacyDataIntoClinic(state.clinicId);
    }
    // Reload everything fresh so the UI reflects whatever just got copied.
    const clinicSnap = await getDoc(clinicDoc());
    if(clinicSnap.exists()){
      const data = clinicSnap.data();
      state.settings = {...state.settings, ...(data.settings||{})};
      state.tagsList = data.tagsList || [];
    }
    await loadPatientsPage(true);
    render();
    showToast('Retry finished — check your patient list and Settings now. If still empty, tell me exactly what happened.');
  }catch(e){
    console.error('force retry migration failed', e);
    showToast('Retry failed with: ' + (e.code || e.message || 'unknown error') + ' — please copy this exact message and tell me.');
  }
}
async function eraseAllData(){
  try{
    showToast('Erasing all patient data — this may take a moment…');
    const cols = [patientsCol(), visitsCol(), rxCol(), receiptsCol()];
    for(const col of cols){
      let snap = await getDocs(query(col, limit(400)));
      while(!snap.empty){
        const batch = writeBatch(db);
        snap.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();
        snap = await getDocs(query(col, limit(400)));
      }
    }
    state.patients = []; state.visits = []; state.prescriptions = []; state.receipts = [];
    state.recordsRx = []; state.recordsReceipts = [];
    state._patientCache = {};
    state.settings.nextPatientSeq = 1;
    await saveSettingsDoc();
    state.view = {tab:"patients", screen:"patients-list", patientId:null, visitId:null};
    closeModal(); render();
    invalidateSearchPool();
    invalidateRecordsSearchPool();
    recalculateMyClinicStorage();
    showToast('All patient data erased');
  }catch(e){ console.error('erase all failed', e); showToast('Erase failed partway through — check your connection and try again'); }
}

function toggleModalTag(tag){
  const sel = state.modal.selectedTags;
  const i = sel.indexOf(tag);

}
function renderTagChips(){
  const filter = (state.modal.tagFilter||'').toLowerCase().trim();
  const selected = state.modal.selectedTags;
  const available = state.tagsList.filter(t=>!selected.includes(t));
  if(state.tagsList.length===0) return `<span style="font-size:12.5px;color:var(--ink-soft)">No tags yet — add one below</span>`;
  if(available.length===0) return `<span style="font-size:12.5px;color:var(--ink-soft)">All tags selected</span>`;
  const list = filter ? available.filter(t=>t.toLowerCase().includes(filter)) : available;
  if(list.length===0) return `<span style="font-size:12.5px;color:var(--ink-soft)">No tags match "${escapeHtml(state.modal.tagFilter)}"</span>`;
  return list.map(t=>`<button class="badge receipt" style="border:none" onclick="toggleModalTag('${escapeAttr(t)}')">+ ${escapeHtml(t)}</button>`).join("");
}

/* ---------------- SAVE HANDLERS ---------------- */
function normalizePhone(p){ return (p||"").replace(/[\s\-()]/g,''); }
async function nextPatientCode(){
  const seq = await runTransaction(db, async (tx)=>{
    const snap = await tx.get(clinicDoc());
    const data = snap.exists() ? snap.data() : {};
    const currentSeq = (data.settings && data.settings.nextPatientSeq) || 1;
    const newSettings = {...(data.settings||state.settings), nextPatientSeq: currentSeq+1};
    tx.set(clinicDoc(), {...data, settings:newSettings}, {merge:true});
    return currentSeq;
  });
  state.settings.nextPatientSeq = seq+1;
  return 'PT-' + String(seq).padStart(4,'0');
}
async function savePatient(id){
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const errEl = document.getElementById('phoneError');
  errEl.textContent = "";
  if(!name){ showToast('Name is required'); return; }
  if(!phone){ errEl.textContent = "Phone number is required."; return; }
  const saveBtn = document.querySelector('.sheet .btn-primary');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  try{
    const normPhone = normalizePhone(phone).replace(/\D/g,'');
    const dupSnap = await getDocs(query(patientsCol(), where('phoneNormalized','==',normPhone), limit(2)));
    const duplicate = dupSnap.docs.find(d=>d.id!==id);
    if(duplicate){
      errEl.textContent = `This number is already used by ${duplicate.data().name}.`;
      if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
      return;
    }
    const tags = (state.modal.selectedTags||[]).slice();
    const data = {
      name, nameLower: name.toLowerCase(),
      age: document.getElementById('f_age').value,
      gender: document.getElementById('f_gender').value,
      phone, phoneNormalized: normPhone,
      bloodGroup: document.getElementById('f_bg').value,
      city: document.getElementById('f_city').value.trim(),
      tags,
      allergies: document.getElementById('f_all').value.trim(),
      address: document.getElementById('f_addr').value.trim(),
    };
    if(id){
      await updateDoc(doc(patientsCol(), id), data);
      const cached = getPatient(id);
      if(cached) Object.assign(cached, data);
      const idx = state.patients.findIndex(p=>p.id===id);
      if(idx>-1) state.patients[idx] = {...state.patients[idx], ...data};
    } else {
      const patientCode = await nextPatientCode();
      const newDocData = {...data, patientCode, createdAt:todayISO(), lastVisitDate:null};
      const ref = await addDoc(patientsCol(), newDocData);
      const p = {id:ref.id, ...newDocData};
      cachePatient(p);
      state.patients.unshift(p);
      state.view.patientId = p.id;
    }
    closeModal();
    if(!id){ state.view.screen='patient-detail'; render(); } else { render(); }
    invalidateSearchPool();
    showToast('Patient saved');
  }catch(e){
    console.error('save patient failed', e);
    showToast('Save failed — check your connection');
    if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save patient'; }
  }
}
async function deletePatient(id){
  try{
    const [vSnap, rxSnap, rcSnap] = await Promise.all([
      getDocs(query(visitsCol(), where('patientId','==',id))),
      getDocs(query(rxCol(), where('patientId','==',id))),
      getDocs(query(receiptsCol(), where('patientId','==',id)))
    ]);
    const batch = writeBatch(db);
    vSnap.docs.forEach(d=>batch.delete(d.ref));
    rxSnap.docs.forEach(d=>batch.delete(d.ref));
    rcSnap.docs.forEach(d=>batch.delete(d.ref));
    batch.delete(doc(patientsCol(), id));
    await batch.commit();
    delete state._patientCache[id];
    state.patients = state.patients.filter(p=>p.id!==id);
    state.visits = []; state.prescriptions = []; state.receipts = [];
    closeModal();
    state.view = {tab:'patients',screen:'patients-list',patientId:null,visitId:null};
    render();
    invalidateSearchPool();
    showToast('Patient deleted');
  }catch(e){ console.error('delete patient failed', e); showToast('Delete failed — check your connection'); }
}
async function recomputePatientLastVisit(patientId){
  const dates = state.visits.filter(v=>v.patientId===patientId).map(v=>v.date).filter(Boolean).sort();
  const last = dates.length ? dates[dates.length-1] : null;
  try{ await updateDoc(doc(patientsCol(), patientId), {lastVisitDate:last}); }catch(e){ console.error('lastVisitDate update failed', e); }
  const cached = getPatient(patientId);
  if(cached) cached.lastVisitDate = last;
  const idx = state.patients.findIndex(p=>p.id===patientId);
  if(idx>-1) state.patients[idx] = {...state.patients[idx], lastVisitDate:last};
}

    state.receipts = state.receipts.filter(r=>r.id!==id);
    closeModal(); render(); invalidateRecordsSearchPool(); showToast('Receipt deleted');
  }catch(e){ console.error('delete receipt failed', e); showToast('Delete failed — check your connection'); }
}

/* ---------------- PDF GENERATION ---------------- */
function letterheadBlock(doc, y){
  const s = state.settings;
  let textX = 15;
  if(s.logoDataUrl){
    try{
      const fmt = s.logoDataUrl.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
      doc.addImage(s.logoDataUrl, fmt, 15, y-11, 16, 16);
      textX = 35;
    }catch(e){ console.error('logo render failed', e); }
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(30,74,71);
  doc.text(s.clinicName||"Clinic", textX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,100,98);
  let line2 = [s.doctorName, s.qualification].filter(Boolean).join(" · ");
  if(line2) doc.text(line2, textX, y+6);
  let line3 = [s.regNo? "Reg. No: "+s.regNo : "", s.phone].filter(Boolean).join("   |   ");
  if(line3) doc.text(line3, textX, y+11.5);
  if(s.address) doc.text(s.address, textX, y+17);
  doc.setDrawColor(47,111,107); doc.setLineWidth(0.8);
  doc.line(15, y+22, 195, y+22);
  return y+30;
}
function buildPrescriptionDoc(rx, p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = letterheadBlock(doc, 18);
  doc.setFontSize(11); doc.setTextColor(21,43,43); doc.setFont('helvetica','bold');
  doc.text(`Patient: ${p.name}`, 15, y);
  doc.setFont('helvetica','normal');
  doc.text(`Age/Sex: ${p.age||'—'} / ${p.gender||'—'}`, 130, y);
  y += 6;
  doc.text(`Patient ID: ${p.patientCode||'—'}`, 15, y);
  y += 6;
  doc.text(`Date: ${fmtDate(rx.date)}`, 15, y);
  y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Rx', 15, y);
  y += 8;
  doc.setFontSize(11);
  rx.medicines.forEach((m,i)=>{
    doc.setFont('helvetica','bold');
    doc.text(`${i+1}. ${m.name}`, 18, y);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.text(`${m.dosage||''}  ·  ${m.frequency||''}  ·  ${m.duration||''}${m.instructions? '  ·  '+m.instructions:''}`, 22, y+5);
    doc.setFontSize(11);
    y += 12;
    if(y>270){ doc.addPage(); y=20; }
  });
  if(rx.advice){
    y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text('Advice:', 15, y);
    doc.setFont('helvetica','normal');
    const split = doc.splitTextToSize(rx.advice, 175);
    doc.text(split, 15, y+5); y += 5 + split.length*5;
  }
  if(rx.followUp){
    y += 4; doc.setFont('helvetica','bold'); doc.text('Follow-up: ', 15, y);
    doc.setFont('helvetica','normal'); doc.text(fmtDate(rx.followUp), 38, y);
  }
  doc.setFontSize(9); doc.setTextColor(140,150,148);
  doc.text('Generated via clinic app — not valid without doctor signature.', 15, 285);
  return doc;
}
function buildReceiptDoc(rc, p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = letterheadBlock(doc, 18);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(21,43,43);
  doc.text('Payment Receipt', 15, y); y+=9;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Patient: ${p.name}`, 15, y);
  doc.text(`Date: ${fmtDate(rc.date)}`, 130, y);
  y += 6;
  doc.text(`Patient ID: ${p.patientCode||'—'}`, 15, y);
  y += 10;
  doc.setDrawColor(224,230,226);
  doc.line(15,y,195,y); y+=7;
  doc.setFont('helvetica','bold');
  doc.text('Description', 15, y); doc.text('Amount', 175, y, {align:'right'});
  y += 5; doc.setFont('helvetica','normal');
  doc.line(15,y,195,y); y+=7;
  rc.items.forEach(it=>{
    doc.text(it.desc, 15, y);
    doc.text(`Rs. ${it.amount}`, 195, y, {align:'right'});
    y += 7;
  });
  doc.line(15,y,195,y); y+=8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Total', 15, y); doc.text(`Rs. ${rc.total}`, 195, y, {align:'right'});
  y += 8; doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Payment mode: ${rc.paymentMode||'—'}`, 15, y);
  doc.setFontSize(9); doc.setTextColor(140,150,148);
  doc.text('Thank you for visiting.', 15, 285);
  return doc;
}
async function downloadPrescriptionPDF(rxId){
  const rx = findRxRecord(rxId);
  if(!rx){ showToast('Prescription not found'); return; }
  const p = await resolvePatientForRecord(rx);
  const doc = buildPrescriptionDoc(rx, p);
  doc.save(`Prescription_${(p.name||'patient').replace(/\s+/g,'_')}_${rx.date}.pdf`);
  showToast('PDF downloaded');
}
async function downloadReceiptPDF(receiptId){
  const rc = findReceiptRecord(receiptId);
  if(!rc){ showToast('Receipt not found'); return; }
  const p = await resolvePatientForRecord(rc);
  const doc = buildReceiptDoc(rc, p);
  doc.save(`Receipt_${(p.name||'patient').replace(/\s+/g,'_')}_${rc.date}.pdf`);
  showToast('PDF downloaded');
}

/* ---------------- UTIL ---------------- */
function escapeHtml(s){ if(s===undefined||s===null) return ""; return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
// Lightweight, safe markdown renderer for AI output: escapes everything
// first (so nothing the AI returns can inject real HTML), then converts a
// small set of markdown patterns to formatting tags on top of the already-
// escaped text.
function mdToHtml(text){
  let safe = escapeHtml(text||'');
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  safe = safe.replace(/(^|[\s(])\*(?!\s)(.+?)(?<!\s)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  const lines = safe.split('\n');
  let html = '', listType = null;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*•]\s+(.*)/);
    const numbered = raw.match(/^\s*\d+[\.\)]\s+(.*)/);
    if(bullet){
      if(listType!=='ul'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ul style="margin:4px 0 4px 18px;padding:0">'; listType='ul'; }
      html += `<li style="margin-bottom:2px">${bullet[1]}</li>`;
    } else if(numbered){
      if(listType!=='ol'){ if(listType) html += listType==='ul'?'</ul>':'</ol>'; html += '<ol style="margin:4px 0 4px 18px;padding:0">'; listType='ol'; }
      html += `<li style="margin-bottom:2px">${numbered[1]}</li>`;
    } else {
      if(listType){ html += listType==='ul'?'</ul>':'</ol>'; listType=null; }
      html += raw.trim()==='' ? '<div style="height:6px"></div>' : `<div style="margin:2px 0">${raw}</div>`;
    }
  }
  if(listType) html += listType==='ul'?'</ul>':'</ol>';
  return html;
}

/* ---------------- EXIT GUARDS ---------------- */
// 1) Browser tab close / reload / navigate-away: shows the browser's own
//    native "leave site?" prompt. Wording is controlled by the browser, not us.
//    Note: iOS Safari largely ignores this (Apple disabled custom unload
//    prompts years ago) — the back-button trap below still works there.
window.addEventListener('beforeunload', (e)=>{
  e.preventDefault();
  e.returnValue = '';
});

// 2) Back button / swipe-back gesture: trapped with our own confirmation.
let exitGuardActive = true;
function armExitGuard(){
  history.pushState({guard:true}, '', location.href);
  window.addEventListener('popstate', onPopState);
}
function onPopState(){
  if(!exitGuardActive) return; // user already chose to exit — let this one through
  history.pushState({guard:true}, '', location.href); // re-arm the trap
  if(state.modal && state.modal.type !== 'confirm-exit'){
    closeModal(); // back closes an open form/sheet first, like a normal app
    return;
  }
  if(state.view.screen==='visit-detail' || state.view.screen==='patient-detail'){
    goBack(); // back steps up through the app's own navigation first
    return;
  }
  if(state.view.tab!=='patients'){
    goTab('patients','patients-list');
    return;
  }
  openModal('confirm-exit');
}
function handleExitChoice(leave){
  closeModal();
  if(leave){
    exitGuardActive = false;
    window.removeEventListener('popstate', onPopState);
    showToast('Press back once more to exit');
  }
}
armExitGuard();
